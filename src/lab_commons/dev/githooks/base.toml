# THE FAMILY'S GIT HOOKS -- the base every repo runs, as data. Read by lab_commons.dev.githooks.table.
#
# A repo OPTS IN by declaring [tool.lab_commons.hooks] in its pyproject.toml (an empty table takes
# this base as is) and layers its own rows on top under [[tool.lab_commons.hooks.<stage>]]:
# a row whose `id` is new is APPENDED to the stage; a row whose `id` names a base row is MERGED over
# it key by key (e.g. one `exclude`). Keys, all optional except `id` and `run`:
#
#   run         argv, run from the repo root in the repo's own venv. A leading "python" is the venv
#               interpreter; any other first word is looked up in the venv's scripts directory first.
#   files       regex (re.search) over repo-relative POSIX paths; a hook with none sees every file.
#   exclude     regex removing paths that `files` admitted.
#   pass_files  append the selected paths to `run` (pre-commit and pre-push stages).
#   always_run  run even when no path is selected.
#   env         a table of environment variables the command runs with (a script's repo facts).
#   refs        pre-push only: regex over the pushed REMOTE refs; the hook runs only for matching
#               refs and reads only their lines on stdin.
#
# What each stage hands a hook is git's own contract: pre-commit selects among the STAGED paths;
# commit-msg appends the message file to `run`; pre-push pipes git's ref lines to stdin and selects
# among the paths those pushes change. The checks below report and never rewrite a file.

[[pre-commit]]
id = "check-added-large-files"
run = ["python", "-m", "lab_commons.dev.filechecks", "large-files"]
pass_files = true

[[pre-commit]]
id = "check-ast"
run = ["python", "-m", "lab_commons.dev.filechecks", "ast"]
files = '\.pyi?$'
pass_files = true

[[pre-commit]]
id = "check-case-conflict"
run = ["python", "-m", "lab_commons.dev.filechecks", "case-conflict"]
pass_files = true

[[pre-commit]]
id = "check-json"
run = ["python", "-m", "lab_commons.dev.filechecks", "json"]
files = '\.json$'
pass_files = true

[[pre-commit]]
id = "check-merge-conflict"
run = ["python", "-m", "lab_commons.dev.filechecks", "merge-conflict"]
pass_files = true

[[pre-commit]]
id = "check-toml"
run = ["python", "-m", "lab_commons.dev.filechecks", "toml"]
files = '\.toml$'
pass_files = true

[[pre-commit]]
id = "debug-statements"
run = ["python", "-m", "lab_commons.dev.filechecks", "debug-statements"]
files = '\.pyi?$'
pass_files = true

[[pre-commit]]
id = "end-of-file"
run = ["python", "-m", "lab_commons.dev.filechecks", "end-of-file"]
pass_files = true

[[pre-commit]]
id = "mixed-line-ending"
run = ["python", "-m", "lab_commons.dev.filechecks", "mixed-line-ending"]
pass_files = true

[[pre-commit]]
id = "trailing-whitespace"
run = ["python", "-m", "lab_commons.dev.filechecks", "trailing-whitespace"]
pass_files = true

# TRACKED-CITES-NO-EPHEMERAL on the STAGED files (fast); the full tree, orphaned escapes included, is
# the famtest `lab_commons.dev.famtests.ephemeralrefs` in the base part.
[[pre-commit]]
id = "ephemeral-refs"
run = ["python", "-m", "lab_commons.dev.ephemeralrefs"]
pass_files = true

# STRAY-FILE-REFUSED: no commit while an untracked, non-ignored file sits outside the declared stray roots
# ([tool.lab_commons.placement] stray_roots, plus scratch/), naming each one and its remedy (lab_commons.dev.codeplace).
[[pre-commit]]
id = "stray-files"
run = ["python", "-m", "lab_commons.dev.codeplace", "stray-check"]
always_run = true

[[commit-msg]]
id = "commitizen"
run = ["cz", "check", "--allow-abort", "--commit-msg-file"]

# Warns on a malformed `Refs #N` / `Closes #N` / `Fixes #N` and never blocks (lab_commons.dev.issueref).
[[commit-msg]]
id = "issue-ref"
run = ["python", "-m", "lab_commons.dev.issueref"]

# The origin host a `[priority] hosts` entry matches, as a `Forge-Host:` trailer (lab_commons.dev.forgeorigin).
# It appends the trailer and never blocks.
[[commit-msg]]
id = "forge-host"
run = ["python", "-m", "lab_commons.dev.forgeorigin"]

# ONE-SESSION-ONE-PR's identity: the launcher's LAB_SESSION as a `Lab-Session:` trailer, replacing any the
# agent wrote; a commit without it (agent or human) passes unstamped and is not judged (lab_commons.dev.labsession).
[[commit-msg]]
id = "lab-session"
run = ["python", "-m", "lab_commons.dev.labsession"]

# MERGE-DEVIATIONS-NAMED, checked when the merge is committed (lab_commons.dev.mergeaudit).
[[commit-msg]]
id = "merge-audit"
run = ["python", "-m", "lab_commons.dev.mergeaudit"]

# The session-branch invariants at push, local reads only (lab_commons.dev.sessionbranch): a declared session branch
# or the trunk is published from that very local branch (PUBLISH-IS-THE-LOCAL-REF), by fast-forward
# (SESSION-HISTORY-ONLY-GROWS), and the integration branch by audited merges (INTEGRATION-IS-MERGES-ONLY).
[[pre-push]]
id = "session-branch"
run = ["python", "-m", "lab_commons.dev.sessionbranch"]
always_run = true

# ONE-BRANCH-PER-SESSION at push time: a push creating or updating a branch the repo's [tool.lab_commons.branchset]
# does not declare is refused (lab_commons.dev.branchset_push). Lanes are local; only declared branches reach origin.
[[pre-push]]
id = "branchset-push"
run = ["python", "-m", "lab_commons.dev.branchset_push"]
always_run = true

# BEHIND-IS-BOUNDED: a push of a branch other than integration/trunk more than [tool.lab_commons.integrator]
# behind_max commits behind origin/<integration> is refused, naming `forge sync` (lab_commons.dev.behindpush).
[[pre-push]]
id = "behind-push"
run = ["python", "-m", "lab_commons.dev.behindpush"]
always_run = true

# PIN (user ruling 2026-10-17): a pushed commit commits uv.lock, and every hold below the newest declares its reason.
# Git objects only, milliseconds. FRESHNESS is the forge's alone (user ruling 2026-10-22): no push resolves; the
# forge relocks integration (lab_commons.dev.relock).
[[pre-push]]
id = "lock"
run = ["python", "-m", "lab_commons.dev.lockcheck"]
always_run = true

# ONE-SESSION-ONE-PR at the birth of a pr/* branch: a NEW pr/* whose commits share a Lab-Session with an unmerged
# origin/pr/* head is refused, naming that head's branch (lab_commons.dev.pradmit; `forge pr create` asks the forge).
[[pre-push]]
id = "pr-admit"
run = ["python", "-m", "lab_commons.dev.pradmit"]
always_run = true
refs = '^refs/heads/pr/'

# FORGE NOTICES WHERE A SESSION ACTS ON ITS PR (user ruling 2026-10-21): a pr/* push, and every commit on a pr/*
# branch, print that PR's open notices for this LAB_SESSION (lab_commons.dev.branchnotices: one reader, cached 60 s,
# short deadline, read-only, silent when none, exit 0 always). git verbs are the decision points every vendor shares.
[[pre-push]]
id = "pr-notices"
run = ["python", "-m", "lab_commons.dev.branchnotices", "--push"]
always_run = true
refs = '^refs/heads/pr/'

# post-commit is ADVISORY (githooks.table.ADVISORY): the commit is made, and no row can change its exit status.
[[post-commit]]
id = "pr-notices"
run = ["python", "-m", "lab_commons.dev.branchnotices"]
always_run = true
