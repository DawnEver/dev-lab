# THE FAMILY'S ONE SPELLING CONFIG (dev_lab.dev.spelling.CONFIG; user ruling 2026-11-24, v1-migration D35).
# Every family repo's verify passes THIS file to typos; no repo carries a copy. Which files are checked (dated
# memory before the ruling is history) is dev_lab.dev.spelling.checked, not this file.
[default]
locale = "en-us"
extend-ignore-re = [
    # The door for DATA that names a foreign spelling (a unit token, a retired-name registry): a marked block,
    # or one marked line. Prose and identifiers never use it.
    "(?s)spelling-off.*?spelling-on",
    "(?m)^.*spelling-ignore-line.*$",
    # Owned by lab-commons, which reads [tool.lab_commons.artefacts]; it moves when lab-commons migrates.
    "lab_commons\\\\?\\.artefacts",  # spelling-ignore-line (also its escaped regex form)
]

[default.extend-words]
# The prefix of mis-decode, mis-order, mis-tracked: English, not a misspelling of miss.
mis = "mis"
# numpy's own API spelling (ndarray.flags.writeable), which code must call as numpy spells it.
writeable = "writeable"
# A cited author (Mak-Morton-Wood), not a misspelling of make.
Mak = "Mak"

[default.extend-identifiers]
# numpy.typing.NDArray: a foreign API name, split by typos into "ND" + "Array".
NDArray = "NDArray"

[files]
# Applied to the explicit file list too (dev_lab.dev.spelling passes --force-exclude), so --write never touches them.
extend-exclude = [
    # Generated by a resolver, not written by a person.
    "*.lock",
    # Rendered machine data: the deny registry's regex fragments (`ontent`, `ove`) are patterns, not words.
    ".claude/hooks/deny-rules.json",
    ".codex/rules/family-denies.rules",
    # Declared data and goldens: fixture records and arrays, not prose; a binary one is also refused by
    # dev_lab.dev.spelling.is_binary, so --write can never corrupt it.
    "*.jsonl",
    "*.npz",
    "*.npy",
    "*.h5",
    "*.hdf5",
    "*.parquet",
    "*.pkl",
    "*.mat",
]
