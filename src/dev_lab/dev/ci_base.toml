# THE FAMILY'S GITHUB ACTIONS WORKFLOWS -- the base, as data. Rendered by dev_lab.dev.ciworkflows.
#
# EVERY REPO RENDERS EVERY TABLE HERE PLACED ON ITS FORGE (`forge`, github when omitted; the repo's forge is
# read from its origin) -- never an opt-in. A repo's `[tool.dev_lab.ci."<file>.yml"]` in its pyproject.toml is
# deep-merged over the base (tables merge key by key, any other value replaces); it may also render another
# forge's table, or declare a workflow the base does not have. `.github/workflows/<file>.yml` is then a RENDERED artefact: never hand-edited, never
# parsed back. Re-render with `python -m dev_lab.dev.ciworkflows render`.

# ONE PR LIFECYCLE ON BOTH FORGES (user ruling 2026-10-29). ci.yml is GitHub's half of the model Gitea's
# `forge serve` runs: the same tests/<part> parts, the same review, the same merge decision -- only
# who PRODUCES and who TRIGGERS differ. Every job runs a dev_lab door; none holds logic of its own:
#
#   parts         `jobparts matrix --event`: the commit's parts and the runner each need-set needs, an
#                 OS-free part on every OS of the event -- PR linux+windows, a full run also macos (D84) -- (the
#                 matrix is the COMMAND's output, never a list typed here). PARTS_EVENT names the event: a merge
#                 (a push, or merge-ready's `smoke` dispatch) takes the PR's set as its SMOKE -- every part, no
#                 macos -- because the head was just tested as a PR (D48-1A); the nightly schedule and an on-demand
#                 dispatch run the full set, and only while `integrate pending` says main lacks the tip
#   part          one job per row: `jobparts produce <row>`, the declared producer, posts tests/<row>
#                 (tests/<part>, or tests/<part>@<os> off its own runner)
#   absent-parts  always: `jobparts absent --event` posts pending (absent) on every expected row no job settled
#   security      `forge security run --pr N`: tests/security
#   merge-ready   after the parts, in THIS workflow (no cross-workflow trigger): `forge merge ready --pr N` posts
#                 tests/merge-ready and, when it is success, merges that head into integrate/main itself
#                 (GitHub refuses to enable auto-merge on a PR already mergeable, dev-lab#15); a merge the
#                 job token makes starts no workflow, so it dispatches this one on integrate/main; it
#                 runs after the parts, which gate it: every part PASS (user ruling 2026-11-04)
#   review        LAST (user ruling 2026-11-05; integrator ruling M8 2026-11-06: the one-shot review runs at the
#                 first MERGE-READY head): only when merge-ready's decision called the head's review due -- every
#                 other condition stands -- does `forge review run --pr N` post tests/review (pull_request ONLY --
#                 never pull_request_target, which would run a fork's code with this repository's secrets; Gitea's
#                 review.yml below is the one pull_request_target workflow: it acts on nothing the head declares,
#                 below). A push reviews nothing by itself; the merge tick merges the reviewed head
#   promote       NIGHTLY (D48-1A, user ruling 2026-11-01), never per merge: on the full run of a pending
#                 integrate/main tip, once every part settled: `integrate promote`
#                 refuses unless every part stands PASS at scope full,
#                 the SAME decision Gitea's integrator runs, fast-forwards main and the job token pushes it;
#                 then `branchprune sweep` deletes every branch integration now contains
#
# Permissions are least per job; the workflow grants only `contents: read`.
["ci.yml"]
name = "CI"
# THE NIGHTLY PROMOTION (D48-1A): integrate/main is GitHub's default branch, so the schedule (ciworkflows'
# NIGHTLY_CRON) runs on its tip.
nightly = true

# ONE FLOW (user ruling 2026-10-29, D83): PRs land on integrate/main; main moves only by `promote` below.
["ci.yml".on.push]
branches = ["integrate/main"]

# ready_for_review (D52/D53): a DRAFT RUNS NOTHING (user ruling 2026-11-05) -- every job of a PR-started workflow is
# guarded at render by forgedraft.READY_ONLY -- so marking it ready is what starts every job.
["ci.yml".on.pull_request]
types = ["opened", "synchronize", "reopened", "ready_for_review"]


# On demand the full run (the nightly one); merge-ready dispatches a merge's run with smoke = true.
["ci.yml".on.workflow_dispatch.inputs.smoke]
description = "a merge's smoke run: the PR's part set, no promote"
type = "boolean"
default = false

# A NEW PUSH CANCELS ITS PR'S SUPERSEDED RUN, and nothing else: a PR's runs share ci-pr-<number>; a push to
# integrate/main, the nightly run and a merge's smoke each take their own run_id, so none is ever cancelled -- not
# even while PENDING, which Actions cancels in a shared group whatever cancel-in-progress says.
["ci.yml".concurrency]
group = "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}"
cancel-in-progress = "${{ github.event_name == 'pull_request' }}"

["ci.yml".permissions]
contents = "read"

# The commit every status is posted on: a PR's HEAD (never the synthetic merge commit), else the pushed sha.
# The job token (GITHUB_TOKEN) is each job's own env, never the workflow's: the review job holds it in no
# environment at all (F-d61706393b50, the `review` steps).
["ci.yml".env]
HEAD_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"  # the family repos sit beside this one
# The event whose part set this run takes (`jobparts matrix --event`): a merge's smoke takes the PR's.
PARTS_EVENT = "${{ (github.event_name == 'push' || inputs.smoke) && 'pull_request' || github.event_name }}"

["ci.yml".jobs.parts]
env = { GITHUB_TOKEN = "${{ github.token }}" }
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { id = "pending", name = "Whether main still lacks the tip", if = "${{ env.PARTS_EVENT != 'pull_request' && github.ref == 'refs/heads/integrate/main' }}", run = 'uv run --no-sync python -m dev_lab.dev.integrate pending "$HEAD_SHA" >> "$GITHUB_OUTPUT"' },
    { id = "matrix", name = "The parts and their runners", if = "${{ steps.pending.outputs.pending != 'false' }}", run = 'echo "matrix=$(uv run --no-sync python -m dev_lab.dev.jobparts matrix --runners hosted --event "$PARTS_EVENT")" >> "$GITHUB_OUTPUT"' },
]

# An empty matrix (a tip main already holds) runs no part, no absent-parts and no promote.
["ci.yml".jobs.parts.outputs]
matrix = "${{ steps.matrix.outputs.matrix }}"
event = "${{ env.PARTS_EVENT }}"
pending = "${{ steps.pending.outputs.pending }}"

["ci.yml".jobs.part]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = "parts"
if = "${{ needs.parts.outputs.matrix != '' }}"
name = "tests/${{ matrix.part }}"
runs-on = "${{ matrix.runs-on }}"
steps = [
    { use-steps = "setup" },
    { name = "Produce and post the part", run = "uv run --no-sync python -m dev_lab.dev.jobparts produce ${{ matrix.part }}" },
]

# Records are attached as assets of the records prerelease (dev_lab.dev.forgerecords), hence contents: write.
["ci.yml".jobs.part.permissions]
contents = "write"
statuses = "write"

["ci.yml".jobs.part.strategy]
fail-fast = false
matrix = "${{ fromJSON(needs.parts.outputs.matrix) }}"

["ci.yml".jobs.absent-parts]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["parts", "part"]
if = "${{ always() && needs.parts.result == 'success' && needs.parts.outputs.matrix != '' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "Post every part no job settled", run = 'uv run --no-sync python -m dev_lab.dev.jobparts absent "$HEAD_SHA" --event "$PARTS_EVENT"' },
]

["ci.yml".jobs.absent-parts.permissions]
contents = "read"
statuses = "write"

["ci.yml".jobs.security]
env = { GITHUB_TOKEN = "${{ github.token }}" }
if = "${{ github.event_name == 'pull_request' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "tests/security", run = "uv run --no-sync python -m dev_lab.dev.forge security run --pr ${{ github.event.pull_request.number }}" },
]

["ci.yml".jobs.security.permissions]
contents = "read"
statuses = "write"
pull-requests = "read"

# A fork PR's job gets no secret: the review then holds the head for a maintainer's takeover.
# The review METHOD is ai-lab's, and a repo's own environment does not carry it (lab-commons #11 and dev-lab #3,
# 2026-10-31: "cannot import 'ai_lab.review'", nothing posted): the job installs ai-lab, from this owner's forge,
# into an environment of its own and hands THAT interpreter to the command. A job that still cannot run it holds
# the head and fails (forgereview_job.review_run), never exits green with no review.
# The method's install and key are the shared `method` steps (below, with `setup`): the review job and the review-again
# workflow use the same ones. The job holds the review key and a write token, so it acts on NOTHING the PR
# supplies (F-76c85dbc4b77, F-46e412ee799d): the head is checked out as DATA only -- never `setup`'s `uv sync`,
# whose lock and project are the PR's, and never a module path (forgereview_command.SAFE_PATH). THE TRUST CHAIN:
# the forge's default branch -> its integration name (forgereview_declared.trusted_integration, F-169e99e6c68c) -> that
# branch's review declaration (forgereview_declared.review_at) -> the command; a PR into any other base is not reviewed.
# The dev_lab door is the shared `door` steps': the dev-lab DOOR_SHA's uv.lock pins.
["ci.yml".jobs.review]
needs = ["merge-ready"]
if = "${{ always() && github.event_name == 'pull_request' && needs.merge-ready.outputs.due == 'true' }}"
runs-on = "ubuntu-latest"
steps = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    # The door and method install with uv; no cache, so nothing a PR run saved is restored into this job.
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = false } },
    { use-steps = "door" },
    { use-steps = "method" },
    { use-steps = "forge-tokens" },
    { use-steps = "review" },
]

# Findings are PR comments (the issues API).
["ci.yml".jobs.review.permissions]
contents = "read"
statuses = "write"
pull-requests = "write"
issues = "write"

["ci.yml".jobs.merge-ready]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["security", "part", "absent-parts"]
if = "${{ always() && github.event_name == 'pull_request' }}"
runs-on = "ubuntu-latest"
outputs = { due = "${{ steps.ready.outputs.due }}" }
steps = [
    { use-steps = "setup" },
    { id = "ready", name = "tests/merge-ready", run = 'said="$(uv run --no-sync python -m dev_lab.dev.forge merge ready --pr ${{ github.event.pull_request.number }})"; echo "$said"; case "$said" in *"; merged") echo "merged=true" >> "$GITHUB_OUTPUT" ;; esac; case "$said" in *"; review due"*) echo "due=true" >> "$GITHUB_OUTPUT" ;; esac' },
    { name = "Run CI on the merged integration", if = "${{ steps.ready.outputs.merged == 'true' }}", run = 'gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref integrate/main -f smoke=true', env = { GH_TOKEN = "${{ github.token }}" } },
]

# Merges the PR and deletes its head branch with the job token (contents: write, pull-requests: write), then
# dispatches CI on integration (actions: write).
["ci.yml".jobs.merge-ready.permissions]
contents = "write"
statuses = "write"
pull-requests = "write"
actions = "write"

# GITHUB'S MERGE TICK (user ruling 2026-11-04): the parts gate the merge, and a part can settle AFTER ci.yml's
# merge-ready ran -- a workstation or HPC part, or a late CI part -- so a posted `tests/<part>` re-judges every open PR
# into integration (`forge merge ready`, no number: the ONE decision) and merges each ready head as the job token, the
# way Gitea's merge.yml does. TRIGGERS: `status` and `schedule` run the DEFAULT branch's file (integrate/main), never a
# PR head's, so the merging token runs no head's code; the schedule catches a status the job token posted (it starts
# no workflow). merge-ready's own decision and a pending claim start nothing. A merge it makes starts no workflow, so
# it dispatches the merge's smoke run on integrate/main, as merge-ready does. When the decision calls a head's review
# due (the review is the last gate), the `review` job below reviews it, and a later tick merges it.
["merge-tick.yml"]
name = "Merge tick"

["merge-tick.yml".on]
status = {}
schedule = [{ cron = "*/15 * * * *" }]
workflow_dispatch = {}

["merge-tick.yml".concurrency]
group = "merge-tick"
cancel-in-progress = false

["merge-tick.yml".permissions]
contents = "read"

["merge-tick.yml".env]
HEAD_SHA = "${{ github.sha }}"
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"

["merge-tick.yml".jobs.merge-tick]
env = { GITHUB_TOKEN = "${{ github.token }}" }
if = "${{ github.event_name != 'status' || (startsWith(github.event.context, 'tests/') && github.event.context != 'tests/merge-ready' && github.event.state != 'pending') }}"
runs-on = "ubuntu-latest"
outputs = { due = "${{ steps.ready.outputs.due }}" }
steps = [
    { use-steps = "setup" },
    { id = "ready", name = "tests/merge-ready", run = 'said="$(uv run --no-sync python -m dev_lab.dev.forge merge ready)"; echo "$said"; case "$said" in *"; merged"*) echo "merged=true" >> "$GITHUB_OUTPUT" ;; esac; case "$said" in *"; review due"*) echo "due=true" >> "$GITHUB_OUTPUT" ;; esac' },
    { name = "Run CI on the merged integration", if = "${{ steps.ready.outputs.merged == 'true' }}", run = 'gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref integrate/main -f smoke=true', env = { GH_TOKEN = "${{ github.token }}" } },
]

["merge-tick.yml".jobs.merge-tick.permissions]
contents = "write"
statuses = "write"
pull-requests = "write"
actions = "write"

# THE REVIEW THE TICK ASKS FOR (user ruling 2026-11-05: review is the last gate), on the merge tick's ONE cadence:
# `forge review run --due` reviews every head the decision above called due, and resumes every head whose review
# batch is still running (user ruling 2026-11-04: review calls are batched by default) from the batch state on its
# PR -- polled, never resubmitted -- so a pending batch never waits for a human. A `status` event reviews only when
# its decision called a head due. It runs the default branch's file, never a PR head's, with the review method and
# key as the review job holds them.
["merge-tick.yml".jobs.review]
needs = ["merge-tick"]
if = "${{ always() && (github.event_name != 'status' || needs.merge-tick.outputs.due == 'true') }}"
runs-on = "ubuntu-latest"
env = { HEAD_SHA = "${{ github.sha }}", INTEGRATION_SHA = "${{ github.sha }}" }
steps = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = false } },
    { use-steps = "door" },
    { use-steps = "method" },
    { use-steps = "forge-tokens" },
    { name = "Review the due heads", run = '''trap 'git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit; rm -rf "$RUNNER_TEMP/forge-secrets"' EXIT
"$REVIEW_PYTHON" -I -m dev_lab.dev.forge review run --due --keys-env AI_LAB_KEYS_PR_REVIEW --git-token-file "$RUNNER_TEMP/forge-secrets/read" --api-token-file "$RUNNER_TEMP/forge-secrets/api" --runtime "ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python"
''', env = { AI_LAB_KEYS_PR_REVIEW = "${{ secrets.AI_LAB_KEYS_PR_REVIEW }}" } },
]

["merge-tick.yml".jobs.review.permissions]
contents = "read"
statuses = "write"
pull-requests = "write"
issues = "write"

# Pushes the fast-forwarded main and deletes every branch integration now contains (LANDED-BRANCHES-SWEPT,
# closing a landed PR first) with the job token, hence contents: write and pull-requests: write.
["ci.yml".jobs.promote]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["parts", "absent-parts"]
if = "${{ needs.parts.outputs.pending == 'true' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "Promote main", run = 'uv run --no-sync python -m dev_lab.dev.integrate promote "$HEAD_SHA" && git push origin main' },
    { name = "Delete the branches integration now contains", if = "${{ !cancelled() }}", run = "uv run --no-sync python -m dev_lab.dev.branchprune sweep" },
]

["ci.yml".jobs.promote.permissions]
contents = "write"
statuses = "write"
pull-requests = "write"

# THE SETUP EVERY JOB SHARES, once: the commit statuses are about (HEAD_SHA) with every origin branch fetched
# -- the outbox posts only on a commit an origin ref holds, and the merge decision trial-merges against one.
[_steps]
setup = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = true } },
    { name = "Sync the environment", run = "uv sync --frozen --all-extras" },
]

# A FORK PR HOLDS SECRET-FREE (F-dd353e505b47, dev-lab #38): under Gitea's pull_request_target a fork PR's run is
# handed the repository's secrets, so every secret these shared steps read is withheld when the PR's head repo is not
# this one -- no review key is stored (the review then holds the head for a maintainer, NEEDS_MAINTAINER) and no
# FAMILY_READ_TOKEN is handed out. Outside a PR event (review-again's issue_comment) the guard is open. Gitea's
# proxy forbids forks today (D44), but the template is family-wide. GitHub gives a fork PR no secret regardless.
#
# THE REVIEW METHOD, installed and keyed once for every job that reviews or judges (ci.yml review, review-again.yml).
# The method is ai-lab's, and a repo's own environment does not carry it (lab-commons #11 and dev-lab #3, 2026-10-31:
# "cannot import 'ai_lab.review'", nothing posted): ai-lab is installed from this owner's forge into an environment of
# its own, whose interpreter the door is handed. The ai-lab COMMIT is the one the DOOR's dev-lab lock pins (its
# non-default `review` group): dev-lab calls the method, so its lock says which one runs -- never a second pin, never
# a floating branch (dev-lab #5 took whatever was current that minute). So every job runs `door` before `method`.
# EVERY PACKAGE IN THE METHOD'S ENVIRONMENT IS AI-LAB'S LOCK (2026-11-05: ai-lab pinned, its lab-commons resolved
# to the integrate/main tip, and a lab-commons name it imported was gone, failing every review family-wide): the step
# exports ai-lab's own uv.lock at that commit, --frozen, and installs it and ai-lab --no-deps, so nothing resolves past it.
# ai-lab reads keys from the git
# credential store ONLY (dev-lab #5: every reviewer `unsupported` with the secret set), so the job's store is an
# in-memory credential cache, and the door that reviews or judges (`--keys-env`) pipes the task's ONE key bundle,
# AI_LAB_KEYS_PR_REVIEW (dev_lab.dev.taskkeys), to ai-lab's loader on stdin; with no secret (a fork PR) nothing is
# stored. Which providers the bundle holds is ai-lab's (routes.toml): no provider is named here.
# NO CREDENTIAL OUTLIVES ITS USE (F-00bc79a46330): a forge token reaches git as process-scoped GIT_CONFIG_* env of
# the one step that fetches, never a config file a later step reads; the key's cache lives as long as one review
# (30 min) and the step that reads it stops the cache daemon on exit (`git credential-cache exit`). The cache is
# the JOB's own (F-83bc8b74b803): its socket lives under RUNNER_TEMP, so a job killed before its trap leaves a key
# no later job on a persistent runner can reach -- the default socket is per HOME, shared by every job.
method = [
    { name = "Install the review method", run = '''
cd "$RUNNER_TEMP"
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
python3 -I -m venv "$RUNNER_TEMP/ai-lab" && "$RUNNER_TEMP/ai-lab/bin/python" -I -m pip install -q uv
AI_LAB_REV=$(python3 -I -c 'import sys, tomllib
lock = tomllib.loads(sys.stdin.read())
(source,) = [p["source"] for p in lock.get("package", []) if p["name"] == "ai-lab"] or sys.exit("the door lock pins no ai-lab")
"git" in source or sys.exit(f"ai-lab is locked from {source}, not a git revision")
print(source["git"].rpartition("#")[2])' < "$RUNNER_TEMP/dev-lab/uv.lock") || exit 1
git clone -q --no-tags --filter=blob:none --no-checkout "${FAMILY_SOURCE}ai-lab.git" "$RUNNER_TEMP/ai-lab-src"
git -C "$RUNNER_TEMP/ai-lab-src" fetch -q --no-tags origin "$AI_LAB_REV"
git -C "$RUNNER_TEMP/ai-lab-src" checkout -q --detach "$AI_LAB_REV"
"$RUNNER_TEMP/ai-lab/bin/uv" export --no-config --project "$RUNNER_TEMP/ai-lab-src" --frozen --no-hashes --no-header --no-annotate --no-emit-project > "$RUNNER_TEMP/ai-lab.txt"
"$RUNNER_TEMP/ai-lab/bin/uv" pip install --no-config --no-deps --python "$RUNNER_TEMP/ai-lab/bin/python" -r "$RUNNER_TEMP/ai-lab.txt"
"$RUNNER_TEMP/ai-lab/bin/uv" pip install --no-config --no-deps --python "$RUNNER_TEMP/ai-lab/bin/python" "$RUNNER_TEMP/ai-lab-src"
''', env = { FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
    { name = "Keep the review keys in memory", run = 'git config --global credential.helper "cache --timeout=1800 --socket=$RUNNER_TEMP/git-credential-cache/socket"' },
]

# THE REVIEW ITSELF, once: GitHub's ci.yml review job and Gitea's review.yml run this very step, each with the
# interpreter the `door` steps put the dev_lab door in (REVIEW_PYTHON), ISOLATED (-I): its cwd is the PR's checkout,
# and a PR-planted `dev_lab/` there would otherwise shadow the pinned door. The checkout is blobless, so the diff
# fetches base blobs on demand (F-ca1dda52c2ef, a consumer issue -- on a private forge the lazy fetch otherwise answers
# 401), and the door posts with the job token. NO FORGE TOKEN IS IN ANY ENVIRONMENT of the review (F-5a82981c5f22,
# F-d61706393b50): an unset variable still sits in /proc/<pid>/environ, readable by the reviewer it launches. So
# the hand-over step alone holds the tokens, writes each to a private file (umask 077), and the door reads each
# once and removes it before any subprocess: the read token is its git header, the job token its forge client's.
# The review task's key bundle (AI_LAB_KEYS_PR_REVIEW) reaches the door by env; it loads it and unsets it first.
# Whatever the door does, the files die with the step (F-5fd2611e79ea): a self-hosted runner may reuse RUNNER_TEMP.
forge-tokens = [
    { name = "Hand the forge tokens to the door", run = '''umask 077
mkdir -p "$RUNNER_TEMP/forge-secrets"
printf '%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" > "$RUNNER_TEMP/forge-secrets/read"
printf '%s' "$GITHUB_TOKEN" > "$RUNNER_TEMP/forge-secrets/api"
''', env = { FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
]
review = [
    { name = "tests/review", run = '''trap 'git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit; rm -rf "$RUNNER_TEMP/forge-secrets"' EXIT
"$REVIEW_PYTHON" -I -m dev_lab.dev.forge review run --pr ${{ github.event.pull_request.number }} --keys-env AI_LAB_KEYS_PR_REVIEW --git-token-file "$RUNNER_TEMP/forge-secrets/read" --api-token-file "$RUNNER_TEMP/forge-secrets/api" --runtime "ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python"
''', env = { AI_LAB_KEYS_PR_REVIEW = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.AI_LAB_KEYS_PR_REVIEW || '' }}" } },
]

# THE DOOR, installed from the dev-lab commit that DOOR_SHA's uv.lock pins (dev-lab #18): the consumer's lock is the
# one source of which door a job runs, so the job and `uv sync` never disagree. DOOR_SHA is a TRUSTED commit: a
# review job's BASE, never the PR head (F-76c85dbc4b77: the head is DATA, and its lock would let a PR choose the
# code that runs beside the review key); a job with no pull request (merge.yml) names the merged integration tip
# it fetched, as INTEGRATION_SHA. Neither is refused by name. dev-lab's own lock holds itself editable, so it runs
# the door at DOOR_SHA itself.
# Every dependency installs as the door commit's lock names it, the door itself --no-deps; a LIGHT job (below) whose
# verbs import less names its packages in DOOR_ONLY (`a|b`, lock names), and only those lines of the lock install,
# --no-deps -- a name the lock lacks refuses the job, and a test imports each verb to prove the set suffices; the door lives in a
# venv of its own (REVIEW_PYTHON). Every uv call runs from $RUNNER_TEMP with --no-config (F-963500c5db57): a PR's
# uv.toml or [tool.uv.pip] in the checkout would otherwise name the index the locked packages come from.
# The door is fetched by sha as well as cloned: a commit not on a branch head the clone took is still served by sha
# while it is reachable on the forge.
door = [
    { name = "Install the review door", run = '''
cd "$RUNNER_TEMP"
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
[ -n "$DOOR_SHA" ] || { echo "no commit names the door: no pull request base and no INTEGRATION_SHA"; exit 1; }
DEV_LAB_REF=$(git -C "$GITHUB_WORKSPACE" show "$DOOR_SHA:uv.lock" | python3 -I -c 'import sys, tomllib
lock = tomllib.loads(sys.stdin.read())
(source,) = [p["source"] for p in lock.get("package", []) if p["name"] == "dev-lab"] or sys.exit("the base lock pins no dev-lab")
if "git" in source:
    print(source["git"].rpartition("#")[2])
elif source.get("editable") == ".":
    print(sys.argv[1])
else:
    sys.exit(f"dev-lab is locked from {source}, not a git revision")' "$DOOR_SHA") || exit 1
git clone -q --no-tags --filter=blob:none --no-checkout "${FAMILY_SOURCE}dev-lab.git" "$RUNNER_TEMP/dev-lab"
git -C "$RUNNER_TEMP/dev-lab" fetch -q --no-tags origin "$DEV_LAB_REF"
git -C "$RUNNER_TEMP/dev-lab" checkout -q --detach "$DEV_LAB_REF"
python3 -I -m venv "$RUNNER_TEMP/review" && "$RUNNER_TEMP/review/bin/python" -I -m pip install -q uv
"$RUNNER_TEMP/review/bin/uv" export --no-config --project "$RUNNER_TEMP/dev-lab" --frozen --no-hashes --no-header --no-annotate --no-emit-project > "$RUNNER_TEMP/review.txt"
if [ -n "$DOOR_ONLY" ]; then
grep -E "^($DOOR_ONLY)( @ |==)" "$RUNNER_TEMP/review.txt" > "$RUNNER_TEMP/only.txt" && [ "$(wc -l < "$RUNNER_TEMP/only.txt")" -eq "$(echo "$DOOR_ONLY" | awk -F'|' '{print NF}')" ] || { echo "DOOR_ONLY=$DOOR_ONLY names a package the door's lock does not pin"; exit 1; }
"$RUNNER_TEMP/review/bin/uv" pip install --no-config --no-deps --python "$RUNNER_TEMP/review/bin/python" -r "$RUNNER_TEMP/only.txt"
else
"$RUNNER_TEMP/review/bin/uv" pip install --no-config --python "$RUNNER_TEMP/review/bin/python" -r "$RUNNER_TEMP/review.txt"
fi
"$RUNNER_TEMP/review/bin/uv" pip install --no-config --python "$RUNNER_TEMP/review/bin/python" --no-deps "$RUNNER_TEMP/dev-lab"
echo "REVIEW_PYTHON=$RUNNER_TEMP/review/bin/python" >> "$GITHUB_ENV"
''', env = { DOOR_SHA = "${{ github.event.pull_request.base.sha || env.INTEGRATION_SHA }}", FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
]

# THE BUNDLE ITSELF, once: both forges' prepare jobs run this step with the door's interpreter, isolated (-I).
prepare = [
    { name = "Prepare the review bundle", run = '"$REVIEW_PYTHON" -I -m dev_lab.dev.forge review prepare --pr ${{ github.event.pull_request.number }} --repo "$GITHUB_WORKSPACE"', env = { GITHUB_TOKEN = "${{ github.token }}" } },
]

# THE LEAN SETUP A GITEA HOST-MODE RUNNER TAKES (one `review` runner, behind a campus ACL). No `uses`
# action -- a host runner behind the ACL fetches none -- and no sync of the repo's own dependencies: the `door` steps
# install the review tooling the BASE's lock pins, never the PR's lock.
# The forge is the runner's registered instance, read off ACTIONS_RUNTIME_URL (act_runner sets it to the instance +
# /api/actions_pipeline/): `github.server_url` is Gitea's ROOT_URL, the public name the host's ACL may refuse.
# Git reads a job-scoped global config (GIT_CONFIG_GLOBAL under RUNNER_TEMP) holding NO credential: it rewrites the
# public forge onto the instance; the review tools come from FAMILY_SOURCE (public, unauthenticated). Each fetching
# step authenticates with FAMILY_READ_TOKEN
# (read on the family repos the job installs) when that secret is set, else the job token, as its own process env.
# Every origin branch is fetched (the merge decision trial-merges against one), blobless, one pack thread: the
# review reads only its range's blobs.
# THE MIRROR RULE (D53(b), user ruling 2026-11-01): a job never clones the whole history. The local index-pack of
# a consumer's full history was most of the runner's 557 MiB peak on the 1.6 GB host, which held capacity at 1. Each
# repository has ONE persistent bare blobless mirror, $HOME/mirrors/<owner>/<repo>.git under the runner's HOME; a job
# updates it incrementally under `flock` on <repo>.git.lock (the kernel drops the lock when a killed job dies; the
# first run builds it at <repo>.git.new and renames it, so a half-built mirror is never used, and a stale *.lock a
# killed fetch left is removed while the flock is held; its origin is re-pointed at this job's $REPO before every
# fetch -- 2026-11-03, the forge moved hosts and every job read the first clone's dead URL). The mirror holds only the forge's BRANCHES -- no PR ref,
# no hook (empty template; every job's git runs core.hooksPath=/dev/null), no credential (the header is the step's
# GIT_CONFIG_* env, never a config write). The checkout is a `clone --shared` of it in the job's workspace,
# disposable, re-pointed at the forge as its promisor; the PR head is fetched into the checkout alone.
# Two jobs of one repository may overlap (the concurrency group is per PR, so a superseded run is cancelled and no
# PR's pending run is dropped for another's): the flock serialises their mirror updates, and a --prune'd branch's
# objects stay in the mirror's packs until a gc's prune expiry (two weeks), far beyond a job.
# A JOB NEVER REPACKS THE WHOLE MIRROR (2026-11-06, forge-a1): the fetch's auto-gc ran `pack-objects --all` (360 MB)
# inside the 1 GB light runner, which hit memory.high 3928 times. The fetch runs with gc.auto=0, and under the same
# lock a GEOMETRIC repack merges only the small new packs, so the pack count stays bounded without a full rewrite.
# The checkout is sparse, root files only: the review reads the head through git and only pyproject.toml from
# the tree, and a full checkout would lazily fetch every blob of the head (a large consumer: 10+ minutes on the host).
# `reach` is its own list: every Gitea host-runner job (review.yml, merge.yml) takes it before its own fetch.
# A job with no pull request (merge.yml) takes EVERY PR head (refs/pull/*/head) and checks out integration's tip;
# every job learns that tip as INTEGRATION_SHA (a review's door still reads its PR base first).
reach = [
    { name = "Reach the forge on the runner's instance", run = '''
[ -n "$ACTIONS_RUNTIME_URL" ] || { echo "ACTIONS_RUNTIME_URL is unset: the runner names no forge to fetch from"; exit 1; }
echo "FORGE_URL=${ACTIONS_RUNTIME_URL%/api/actions_pipeline/}" >> "$GITHUB_ENV"
echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
''' },
]

lean = [
    { name = "Fetch the head", env = { FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
git config --global url."$FORGE_URL/".insteadOf "${{ github.server_url }}/"
git config --global pack.threads 1
git config --global core.hooksPath /dev/null
REPO="$FORGE_URL/${{ github.repository }}.git"
MIRROR="$HOME/mirrors/${{ github.repository }}.git"
mkdir -p "${MIRROR%/*}"
(
  flock 9
  if [ ! -d "$MIRROR/objects" ]; then
    rm -rf "$MIRROR.new"
    git clone -q --bare --template= --no-tags --filter=blob:none "$REPO" "$MIRROR.new"
    mv "$MIRROR.new" "$MIRROR"
  fi
  find "$MIRROR" -maxdepth 2 -name '*.lock' -type f -delete
  git -C "$MIRROR" remote set-url origin "$REPO"
  git -C "$MIRROR" -c gc.auto=0 fetch -q --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/heads/*'
  git -C "$MIRROR" repack -q -d --geometric=2
) 9>"$MIRROR.lock"
git clone -q --shared --no-checkout --template= "$MIRROR" .
git remote set-url origin "$REPO"
git config core.repositoryformatversion 1
git config extensions.partialClone origin
git config remote.origin.promisor true
git config remote.origin.partialclonefilter blob:none
git fetch -q --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*' "+refs/pull/${{ github.event.pull_request.number || '*' }}/head:refs/remotes/origin/pull/${{ github.event.pull_request.number || '*' }}"
git sparse-checkout set --cone
echo "INTEGRATION_SHA=$(git rev-parse origin/integrate/main)" >> "$GITHUB_ENV"
git checkout -q --detach "${HEAD_SHA:-origin/integrate/main}"
''' },
]

# GITEA'S REVIEW JOB (2026-11-01): tests/review on a Gitea-hosted repo is posted by its Actions job. Gitea vets no
# poster (reviewgate.forge_posted, user ruling 2026-11-06): the trigger below guards the review KEY and the job, not
# whose status counts. TRIGGERED BY pull_request_target (dev-lab #30, user ruling 2026-11-01, option (b)): Gitea runs a pull_request
# workflow from the PR HEAD, so a same-repo PR could rewrite this file to post success itself or print the review
# key; a pull_request_target workflow is detected from the BASE commit (notifier_helper.go, 1.27), so the BASE's
# workflow runs -- the PR can neither change what runs nor read the secret; the job fails unless it posted success
# (forgereview_job.job_exit). Safe ONLY because
# what the job takes from the head is the DIFF, read as data; what it acts on is the base's -- the workflow,
# the [tool.dev_lab.review] declaration of the integration branch the DEFAULT branch names (the trust chain at
# ci.yml's review job; F-46e412ee799d, F-169e99e6c68c) and the tools, pinned by SHA (the base lock's dev-lab, and the ai-lab that dev-lab's lock pins) (test_the_review_job_runs_no_code_the_pr_supplies).
# GitHub's ci.yml review keeps pull_request -- GitHub runs it from the merge ref with no secret for a fork.
# REVIEW IS THE LAST GATE (user ruling 2026-11-05; integrator ruling M8 2026-11-06): a push starts nothing here. The
# ONE type is `labeled`, and the job runs only for reviewturn.REVIEW_LABEL, which the merge decision applies once
# every other condition stands (reviewturn.review_turn, run by a serve: Gitea starts no workflow for its Actions
# user's event). Still a pull_request_target run at the head, so the trust chain and reviewgate's run binding are
# unchanged; a label anyone else adds reviews nothing (forgereview.review_pull reads the decision's DUE).
# The draft guard (forgedraft.READY_ONLY) still ANDs onto the job. NEVER `edited` (F-6adfea8621bf). The concurrency
# group is keyed on the label NAME, so any other label's run lands in its own group and cannot cancel a live review.
["review.yml"]
forge = "gitea"
name = "Review"

["review.yml".on.pull_request_target]
types = ["labeled"]

["review.yml".concurrency]
group = "review-${{ github.event.pull_request.number }}-${{ github.event.label.name }}"
cancel-in-progress = true

["review.yml".env]
HEAD_SHA = "${{ github.event.pull_request.head.sha }}"
# Where the review tools come from: the toolchain lives on GitHub (ruling 2026-10-29), public and unauthenticated;
# the forge's own copy is not readable by the job token (D37). The host cannot substitute content: the locked dev-lab
# and the ai-lab its lock pins are full commit SHAs. A runner that cannot reach GitHub cannot run this job, and says so.
FAMILY_SOURCE = "https://github.com/DawnEver/"
UV_PYTHON = "python3"  # the host's interpreter: a host runner behind the ACL downloads none
UV_PYTHON_DOWNLOADS = "never"
UV_CONCURRENT_INSTALLS = "1"  # one at a time: the runner is memory-capped
UV_CONCURRENT_BUILDS = "1"

# NOTHING TO REVIEW IS SETTLED FIRST (2026-11-03, consumer #5514): before any clone or install, a bare python3 runs
# dev_lab.dev.reviewcode -- fetched alone at the door's locked dev-lab commit -- which posts the review's own
# ONLY_GENERATED success on a PR holding no code and skips every later step; whatever it cannot read, the review runs.
["review.yml".jobs.review]
if = "${{ github.event.label.name == 'review-due' }}"
runs-on = "review"
steps = [
    { use-steps = "reach" },
    { name = "Settle a PR with no code to review", id = "code", env = { GITHUB_TOKEN = "${{ github.token }}", PR_NUMBER = "${{ github.event.pull_request.number }}", BASE_SHA = "${{ github.event.pull_request.base.sha }}" }, run = '''
python3 -I -c 'import os, sys, tomllib, urllib.request
env = os.environ
api = env["FORGE_URL"] + "/api/v1/repos/" + env["GITHUB_REPOSITORY"]
auth = {"Authorization": "token " + env["GITHUB_TOKEN"]}
def get(url, headers):
    with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as reply:
        return reply.read().decode("utf-8")
base, path = env["BASE_SHA"], "src/dev_lab/dev/reviewcode.py"
lock = tomllib.loads(get(api + "/raw/uv.lock?ref=" + base, auth))
(source,) = [p["source"] for p in lock.get("package", []) if p["name"] == "dev-lab"] or sys.exit("the base lock pins no dev-lab")
if "git" in source:
    text = get(env["FAMILY_SOURCE"] + "dev-lab/raw/" + source["git"].rpartition("#")[2] + "/" + path, {})
elif source.get("editable") == ".":
    text = get(api + "/raw/" + path + "?ref=" + base, auth)
else:
    sys.exit("dev-lab is locked from %s, not a git revision" % source)
exec(compile(text, path, "exec"), {"__name__": "__main__"})' || echo "settled=false" >> "$GITHUB_OUTPUT"
''' },
    { use-steps = "lean", if = "${{ steps.code.outputs.settled != 'true' }}" },
    { use-steps = "door", if = "${{ steps.code.outputs.settled != 'true' }}" },
    { use-steps = "method", if = "${{ steps.code.outputs.settled != 'true' }}" },
    { use-steps = "forge-tokens", if = "${{ steps.code.outputs.settled != 'true' }}" },
    { use-steps = "review", if = "${{ steps.code.outputs.settled != 'true' }}" },
]

# Gitea has no `statuses` scope: POST /statuses/{sha} asks Code write (reqRepoWriter(unit.TypeCode), 1.27), so the
# job takes contents: write. Under pull_request_target the base's block is the one that runs, so a PR cannot widen
# it; the ceiling is still the repo/org MaxTokenPermissions.
["review.yml".jobs.review.permissions]
actions = "read"  # reviewgate reads the job's own run: GET actions/runs/{id} is reqRepoReader(unit.TypeActions)
contents = "write"
pull-requests = "write"
issues = "write"

# THE BUNDLE PREPARE (forgereview_pointer): a repo declaring [tool.dev_lab.review] where = "judge" is reviewed by an
# isolated judge host, which reads a bundle only as the `review-bundle` ARTIFACT of the newest concluded, successful
# run of THIS workflow for the PR (event, workflow, pull request, head sha) -- located by the judge, never by a
# status. Never declared by a repo and never keyed by its file name here: ciworkflows renders `_prepare` under
# reviewgate.PREPARE_WORKFLOW -- the one name the judge lists runs by -- exactly when the repo is a judge repo.
# pull_request_target ALONE (reviewgate.REVIEW_EVENT): the BASE's definition runs, so a PR can neither alter it nor
# make its own run count. The head is checked out as DATA for the bundle -- read through git, never run; the door is
# the base lock's (`door`), started isolated (-I). No review method and no key, and nothing is posted.
# EITHER FORGE (`forge`, Gitea unless the repo's layer names "github"; its `by-forge` table is that forge's part):
# * Gitea: the host runner's `reach`/`lean` setup; the bundle goes up with the run's own ACTIONS_RUNTIME_TOKEN
#   (actionsartifact), which only this run's job holds. A fork PR's job still has no FAMILY_READ_TOKEN (the `door`
#   guard).
# * GitHub: a hosted runner, whose `run` steps are never handed the runtime token, so `prepare` leaves the bundle in
#   $RUNNER_TEMP and actions/upload-artifact attaches it to this run (overwrite: a re-run attempt replaces it, so the
#   run holds one). The checkout keeps no credential. A fork PR is not prepared: GitHub lists no pull request on a
#   fork's run, so the judge could never bind it to the PR (reviewgate._of_workflow).
[_prepare]
forge = "gitea"
name = "Review prepare"

[_prepare.on.pull_request_target]
types = ["opened", "synchronize", "reopened", "ready_for_review"]

[_prepare.concurrency]
group = "review-prepare-${{ github.event.pull_request.number }}"
cancel-in-progress = true

[_prepare.env]
HEAD_SHA = "${{ github.event.pull_request.head.sha }}"

# Read only: the artifact upload authenticates with the run's runtime token, not the job token; prepare reads the PR.
[_prepare.jobs.prepare.permissions]
contents = "read"
pull-requests = "read"

[_prepare.by-forge.gitea.env]
FAMILY_SOURCE = "https://github.com/DawnEver/"
UV_PYTHON = "python3"
UV_PYTHON_DOWNLOADS = "never"
UV_CONCURRENT_INSTALLS = "1"
UV_CONCURRENT_BUILDS = "1"

# Gitea prepares a head only once the merge decision calls its review due (the `review.yml` label, above); GitHub
# starts no workflow for a label its job token applies, so there a push prepares (no model call) and the judge reads
# only a head the decision called due (forgereview_bundle._called_due).
[_prepare.by-forge.gitea.on.pull_request_target]
types = ["labeled"]

[_prepare.by-forge.gitea.concurrency]
group = "review-prepare-${{ github.event.pull_request.number }}-${{ github.event.label.name }}"
cancel-in-progress = true

[_prepare.by-forge.gitea.jobs.prepare]
if = "${{ github.event.label.name == 'review-due' }}"
runs-on = "light"
steps = [
    { use-steps = "reach" },
    { use-steps = "lean" },
    { use-steps = "door" },
    { use-steps = "prepare" },
]

[_prepare.by-forge.github.env]
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"

[_prepare.by-forge.github.jobs.prepare]
if = "${{ github.event.pull_request.head.repo.full_name == github.repository }}"
runs-on = "ubuntu-latest"
steps = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0, persist-credentials = false } },
    { use-steps = "door" },
    { use-steps = "prepare" },
    { name = "Attach the review bundle to this run", uses = "actions/upload-artifact@v4", with = { name = "review-bundle", path = "${{ runner.temp }}/review-bundle/bundle.json", if-no-files-found = "error", overwrite = true } },
]

# A LANDED BRANCH CONTINUES (LANDED-BRANCH-CONTINUES, user-approved design 2026-11-07): a merged PR is never reused,
# so a push onto its branch is carried by a continuation PR (`continues #N`) the forge opens -- on GitHub, this job, on
# a push to any branch but integration and the trunk (`forge pr continue --head <branch> --sha <sha>`, one forge call
# when the branch has no merged PR). It reads the integration branch's review declaration, so it fetches that ref. A
# PR the job token opens starts no workflow: the continuation's CI starts at its next push.
["continue.yml"]
name = "Continue a landed branch"

["continue.yml".on.push]
branches-ignore = ["integrate/main", "main"]

["continue.yml".concurrency]
group = "continue-${{ github.ref_name }}"
cancel-in-progress = false

["continue.yml".permissions]
contents = "read"

["continue.yml".env]
HEAD_SHA = "${{ github.sha }}"
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"

["continue.yml".jobs.continue]
env = { GITHUB_TOKEN = "${{ github.token }}" }
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "Fetch the integration branch", run = 'git fetch --no-tags --depth=1 origin "+refs/heads/integrate/main:refs/remotes/origin/integrate/main"' },
    { name = "Open the continuation PR", run = 'uv run --no-sync python -m dev_lab.dev.forge pr continue --head "$GITHUB_REF_NAME" --sha "$GITHUB_SHA"' },
]

["continue.yml".jobs.continue.permissions]
contents = "read"
pull-requests = "write"
issues = "write"

# A REVIEW ASKED AGAIN IS RUN BY THE FORGE (user ruling 2026-11-06): the review is one-shot, and `forge review again
# <pr>` -- after a security finding is fixed -- leaves a comment carrying the review-again marker; `forge review carry
# <pr>` -- a continuation's carried finding resolved or deferred -- one carrying the review-carry marker, on which the
# run re-posts the standing verdict with no model call (LANDED-BRANCH-CONTINUES). That comment
# triggers this job, which runs the PR's review as the job's own identity (forgereview.review_pull honours the
# request). A separate workflow, so a comment never runs the parts of ci.yml. GitHub runs an issue_comment workflow
# from the default branch only, so the door is the trusted one.
["review-again.yml"]
name = "Review again"

["review-again.yml".on.issue_comment]
types = ["created", "edited"]

["review-again.yml".concurrency]
group = "review-again-${{ github.event.issue.number }}"
cancel-in-progress = false

["review-again.yml".permissions]
contents = "read"

["review-again.yml".env]
HEAD_SHA = "${{ github.sha }}"
INTEGRATION_SHA = "${{ github.sha }}"  # the door's trusted commit: an issue_comment runs the default branch's tip
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"  # the family repos sit beside this one
GITHUB_TOKEN = "${{ github.token }}"

["review-again.yml".jobs.again]
if = "${{ github.event.issue.pull_request && (contains(github.event.comment.body, '<!-- lab-commons:review-again:') || contains(github.event.comment.body, '<!-- lab-commons:review-carry:')) }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { use-steps = "door" },
    { use-steps = "method" },
    { name = "Review the PR again", run = 'trap "git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit" EXIT; uv run --no-sync python -m dev_lab.dev.forge review run --pr ${{ github.event.issue.number }} --keys-env AI_LAB_KEYS_PR_REVIEW --runtime "ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python"', env = { AI_LAB_KEYS_PR_REVIEW = "${{ secrets.AI_LAB_KEYS_PR_REVIEW }}" } },
]

["review-again.yml".jobs.again.permissions]
contents = "read"
statuses = "write"
pull-requests = "write"
issues = "write"

# GITEA PROMOTES ON THE HOST, NEVER HERE: on Gitea the trunk's one promoter is `dev_lab.ops` `[ops.promote]`, a timer
# on the forge host (src/dev_lab/ops/promote.py). A workflow promoting too would be a second promoter racing its
# pushes to main, and would push main on a repo whose host deliberately does not promote it. GitHub promotes in ci.yml.

# GITEA MERGES IN ITS OWN CI (P3, user ruling 2026-11-02): a PR into integration whose review passed and whose head is
# safe and clean is merged by THIS job -- `forge merge ready` with no number judges every open PR into integration by
# the ONE decision (dev_lab.dev.forgemerge.ready) and merges each ready head as the job token -- then the landed PRs
# are closed (dev_lab.dev.prlanded) and the landed branches swept (branchprune sweep). Declaring this table is the
# opt-in (forgemerge.ci_merges): the workstation's `forge serve` then merges, closes and sweeps nothing for the repo.
# TRIGGERS. Gitea 1.27 has no `status` event, so a posted status starts nothing: the Review workflow completing
# (workflow_run, read from the DEFAULT branch) and a schedule are the triggers; tests/security, posted by a serve,
# is caught by the schedule. NEVER a pull_request-family event (pull_request_review included): Gitea runs those from
# the PR HEAD's workflow file, and this job holds a token that merges.
# THE TOKEN. The Actions token merges and deletes branches with contents: write (POST pulls/{n}/merge asks
# CanWrite(code), routers/api/v1/api.go 1.27; no Actions special case in services/pull/merge.go) unless the
# integration branch's protection enables a merge whitelist, which the Actions user can never be on. Closing a PR
# is pull-requests: write. No bot token: the forge-bot is parked (motronics memory 2026-11-01).
# A merge the Actions user makes starts no workflow (notifier_helper.go skips its events); the serve hosts produce
# the integration parts by polling, as before.
# Trees are needed (the trial merge, the audit), so it fetches through the persistent per-repo mirror (`lean`).
["merge.yml"]
forge = "gitea"
name = "Merge"

["merge.yml".on.workflow_run]
workflows = ["Review"]
types = ["completed"]

["merge.yml".on]
schedule = [{ cron = "*/10 * * * *" }]

["merge.yml".on.workflow_dispatch]

["merge.yml".concurrency]
group = "merge"
cancel-in-progress = false

["merge.yml".env]
FAMILY_SOURCE = "https://github.com/DawnEver/"
UV_PYTHON = "python3"
UV_PYTHON_DOWNLOADS = "never"
UV_CONCURRENT_INSTALLS = "1"
UV_CONCURRENT_BUILDS = "1"

# The decision validates the review declaration (lab_commons.units: pint, numpy, pydantic) and runs the repo's
# message row (dev_lab.dev.commitmsg), so this door installs the whole lock -- a hand list of that closure would be a second lock.
["merge.yml".jobs.merge]
runs-on = "light"
steps = [
    { use-steps = "reach" },
    { use-steps = "lean" },
    { use-steps = "door" },
    { name = "Merge every ready PR", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
"$REVIEW_PYTHON" -I -m dev_lab.dev.forge merge ready
''' },
    { name = "Close the landed PRs", if = "${{ !cancelled() }}", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
"$REVIEW_PYTHON" -I -m dev_lab.dev.prlanded
''' },
    { name = "Delete the branches integration now contains", if = "${{ !cancelled() }}", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
"$REVIEW_PYTHON" -I -m dev_lab.dev.branchprune sweep
''' },
]

["merge.yml".jobs.merge.permissions]
contents = "write"
pull-requests = "write"

# THE GITEA RUNNER LABELS, declared once (user ruling 2026-11-02); every Gitea job's runs-on is one of them.
[_runners]
review = "the review job: the review method and its key; one review peaks at 557 MB, so capacity 1"
light = "merge, close, sweep and promote: no review method, no key, a door of only what the verbs import"
