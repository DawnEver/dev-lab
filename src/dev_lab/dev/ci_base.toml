# THE FAMILY'S GITHUB ACTIONS WORKFLOWS -- the base, as data. Rendered by dev_lab.dev.ciworkflows.
#
# A repo OPTS IN to a workflow by declaring its table, `[tool.dev_lab.ci."<file>.yml"]`, in its own
# pyproject.toml (an empty table takes the base as is); the repo's table is deep-merged over the base
# (tables merge key by key, any other value replaces). A repo may also declare a workflow the base
# does not have. `.github/workflows/<file>.yml` is then a RENDERED artefact: never hand-edited, never
# parsed back. Re-render with `python -m dev_lab.dev.ciworkflows render`.

# ONE PR LIFECYCLE ON BOTH FORGES (user ruling 2026-10-29). ci.yml is GitHub's half of the model Gitea's
# `forge serve` runs: the same tests/<part> parts, the same review round, the same merge decision -- only
# who PRODUCES and who TRIGGERS differ. Every job runs a dev_lab door; none holds logic of its own:
#
#   parts         `jobparts matrix --event`: the commit's parts and the runner each need-set needs, an
#                 OS-free part on every OS of the event -- PR linux+windows, a full run also macos (D84) -- (the
#                 matrix is the COMMAND's output, never a list typed here). PARTS_EVENT names the event: a merge
#                 (a push, or merge-ready's `smoke` dispatch) takes the PR's set as its SMOKE -- every part, no
#                 macos -- because the head was just tested as a PR (D48-1A); the nightly schedule and an on-demand
#                 dispatch run the full set, and only while `integrate pending` says main lacks the tip
#   part          one job per row: `jobparts produce <row>`, the declared producer, posts tests/<row>
#                 (tests/<part>, or tests/<part>@<os> off its own runner)
#   absent-parts  always: `jobparts absent --event` posts pending (absent) on every expected row no job settled
#   security      `forge security run --pr N`: tests/security
#   review        `forge review run --pr N`: tests/review (pull_request ONLY -- never pull_request_target,
#                 which would run a fork's code with this repository's secrets; Gitea's review.yml below is the
#                 one pull_request_target workflow: it acts on nothing the head declares, below)
#   merge-ready   last, in THIS workflow (no cross-workflow trigger): `forge merge ready --pr N` posts
#                 tests/merge-ready and, when it is success, merges that head into integrate/main itself
#                 (GitHub refuses to enable auto-merge on a PR already mergeable, dev-lab#15); a merge the
#                 job token makes starts no workflow, so it dispatches this one on integrate/main; the
#                 parts never gate it (user ruling 2026-10-29)
#   promote       NIGHTLY (D48-1A, user ruling 2026-11-01), never per merge: on the full run of a pending
#                 integrate/main tip, once every part settled: `integrate promote`
#                 refuses unless every part stands PASS -- the ONE place the parts gate,
#                 the SAME decision Gitea's integrator runs, fast-forwards main and the job token pushes it;
#                 then `branchprune sweep` deletes every branch integration now contains
#
# Permissions are least per job; the workflow grants only `contents: read`.
["ci.yml"]
name = "CI"
# THE NIGHTLY PROMOTION (D48-1A): integrate/main is GitHub's default branch, so the schedule (ciworkflows'
# NIGHTLY_CRON) runs on its tip.
nightly = true

# ONE FLOW (user ruling 2026-10-29, D83): PRs land on integrate/main; main moves only by `promote` below.
["ci.yml".on.push]
branches = ["integrate/main"]

# ready_for_review (D52/D53): a draft is never reviewed, so marking it ready is what reviews it.
["ci.yml".on.pull_request]
types = ["opened", "synchronize", "reopened", "ready_for_review"]


# On demand the full run (the nightly one); merge-ready dispatches a merge's run with smoke = true.
["ci.yml".on.workflow_dispatch.inputs.smoke]
description = "a merge's smoke run: the PR's part set, no promote"
type = "boolean"
default = false

# A merge's smoke run never cancels the nightly run on the same ref, nor the reverse.
["ci.yml".concurrency]
group = "ci-${{ github.ref }}-${{ (github.event_name == 'push' || inputs.smoke) && 'smoke' || github.event_name }}"
cancel-in-progress = true

["ci.yml".permissions]
contents = "read"

# The commit every status is posted on: a PR's HEAD (never the synthetic merge commit), else the pushed sha.
# The job token (GITHUB_TOKEN) is each job's own env, never the workflow's: the review job holds it in no
# environment at all (F-d61706393b50, the `review` steps).
["ci.yml".env]
HEAD_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"  # the family repos sit beside this one
# The event whose part set this run takes (`jobparts matrix --event`): a merge's smoke takes the PR's.
PARTS_EVENT = "${{ (github.event_name == 'push' || inputs.smoke) && 'pull_request' || github.event_name }}"

["ci.yml".jobs.parts]
env = { GITHUB_TOKEN = "${{ github.token }}" }
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { id = "pending", name = "Whether main still lacks the tip", if = "${{ env.PARTS_EVENT != 'pull_request' && github.ref == 'refs/heads/integrate/main' }}", run = 'uv run --no-sync python -m dev_lab.dev.integrate pending "$HEAD_SHA" >> "$GITHUB_OUTPUT"' },
    { id = "matrix", name = "The parts and their runners", if = "${{ steps.pending.outputs.pending != 'false' }}", run = 'echo "matrix=$(uv run --no-sync python -m dev_lab.dev.jobparts matrix --runners hosted --event "$PARTS_EVENT")" >> "$GITHUB_OUTPUT"' },
]

# An empty matrix (a tip main already holds) runs no part, no absent-parts and no promote.
["ci.yml".jobs.parts.outputs]
matrix = "${{ steps.matrix.outputs.matrix }}"
event = "${{ env.PARTS_EVENT }}"
pending = "${{ steps.pending.outputs.pending }}"

["ci.yml".jobs.part]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = "parts"
if = "${{ needs.parts.outputs.matrix != '' }}"
name = "tests/${{ matrix.part }}"
runs-on = "${{ matrix.runs-on }}"
steps = [
    { use-steps = "setup" },
    { name = "Produce and post the part", run = "uv run --no-sync python -m dev_lab.dev.jobparts produce ${{ matrix.part }}" },
]

# Records are attached as assets of the records prerelease (dev_lab.dev.forgerecords), hence contents: write.
["ci.yml".jobs.part.permissions]
contents = "write"
statuses = "write"

["ci.yml".jobs.part.strategy]
fail-fast = false
matrix = "${{ fromJSON(needs.parts.outputs.matrix) }}"

["ci.yml".jobs.absent-parts]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["parts", "part"]
if = "${{ always() && needs.parts.result == 'success' && needs.parts.outputs.matrix != '' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "Post every part no job settled", run = 'uv run --no-sync python -m dev_lab.dev.jobparts absent "$HEAD_SHA" --event "$PARTS_EVENT"' },
]

["ci.yml".jobs.absent-parts.permissions]
contents = "read"
statuses = "write"

["ci.yml".jobs.security]
env = { GITHUB_TOKEN = "${{ github.token }}" }
if = "${{ github.event_name == 'pull_request' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "tests/security", run = "uv run --no-sync python -m dev_lab.dev.forge security run --pr ${{ github.event.pull_request.number }}" },
]

["ci.yml".jobs.security.permissions]
contents = "read"
statuses = "write"
pull-requests = "read"

# A fork PR's job gets no secret: the review then holds the head for a maintainer's takeover.
# The review METHOD is ai-lab's, and a repo's own environment does not carry it (lab-commons #11 and dev-lab #3,
# 2026-10-31: "cannot import 'ai_lab.review'", nothing posted): the job installs ai-lab, from this owner's forge,
# into an environment of its own and hands THAT interpreter to the command. A job that still cannot run it holds
# the head and fails (forgetakeover.review_run), never exits green with no review.
# The method's install and key are the shared `method` steps (below, with `setup`): the review job and the claims
# workflow use the same ones. The job holds the review key and a write token, so it acts on NOTHING the PR
# supplies (F-76c85dbc4b77, F-46e412ee799d): the head is checked out as DATA only -- never `setup`'s `uv sync`,
# whose lock and project are the PR's, and never a module path (forgereview_command.SAFE_PATH). THE TRUST CHAIN:
# the forge's default branch -> its integration name (forgereview_declared.trusted_integration, F-169e99e6c68c) -> that
# branch's review declaration (forgereview_declared.review_at) -> the command; a PR into any other base is not reviewed.
# The dev_lab door is the shared `door` steps': the dev-lab DOOR_SHA's uv.lock pins.
["ci.yml".jobs.review]
if = "${{ github.event_name == 'pull_request' }}"
runs-on = "ubuntu-latest"
steps = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    # The door and method install with uv; no cache, so nothing a PR run saved is restored into this job.
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = false } },
    { use-steps = "door" },
    { use-steps = "method" },
    { use-steps = "review" },
]

# Findings are PR comments (the issues API).
["ci.yml".jobs.review.permissions]
contents = "read"
statuses = "write"
pull-requests = "write"
issues = "write"

["ci.yml".jobs.merge-ready]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["security", "review"]
if = "${{ always() && github.event_name == 'pull_request' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { id = "ready", name = "tests/merge-ready", run = 'said="$(uv run --no-sync python -m dev_lab.dev.forge merge ready --pr ${{ github.event.pull_request.number }})"; echo "$said"; case "$said" in *"; merged") echo "merged=true" >> "$GITHUB_OUTPUT" ;; esac' },
    { name = "Run CI on the merged integration", if = "${{ steps.ready.outputs.merged == 'true' }}", run = 'gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref integrate/main -f smoke=true', env = { GH_TOKEN = "${{ github.token }}" } },
]

# Merges the PR and deletes its head branch with the job token (contents: write, pull-requests: write), then
# dispatches CI on integration (actions: write).
["ci.yml".jobs.merge-ready.permissions]
contents = "write"
statuses = "write"
pull-requests = "write"
actions = "write"

# Pushes the fast-forwarded main and deletes every branch integration now contains (LANDED-BRANCHES-SWEPT,
# closing a landed PR first) with the job token, hence contents: write and pull-requests: write.
["ci.yml".jobs.promote]
env = { GITHUB_TOKEN = "${{ github.token }}" }
needs = ["parts", "absent-parts"]
if = "${{ needs.parts.outputs.pending == 'true' }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { name = "Promote main", run = 'uv run --no-sync python -m dev_lab.dev.integrate promote "$HEAD_SHA" && git push origin main' },
    { name = "Delete the branches integration now contains", if = "${{ !cancelled() }}", run = "uv run --no-sync python -m dev_lab.dev.branchprune sweep" },
]

["ci.yml".jobs.promote.permissions]
contents = "write"
statuses = "write"
pull-requests = "write"

# THE SETUP EVERY JOB SHARES, once: the commit statuses are about (HEAD_SHA) with every origin branch fetched
# -- the outbox posts only on a commit an origin ref holds, and the merge decision trial-merges against one.
[_steps]
setup = [
    { uses = "actions/checkout@v4", with = { ref = "${{ env.HEAD_SHA }}", fetch-depth = 0 } },
    { name = "Install uv", uses = "astral-sh/setup-uv@v5", with = { enable-cache = true } },
    { name = "Sync the environment", run = "uv sync --frozen --all-extras" },
]

# A FORK PR HOLDS SECRET-FREE (F-dd353e505b47, dev-lab #38): under Gitea's pull_request_target a fork PR's run is
# handed the repository's secrets, so every secret these shared steps read is withheld when the PR's head repo is not
# this one -- no review key is stored (the review then holds the head for a maintainer, NEEDS_MAINTAINER) and no
# FAMILY_READ_TOKEN is handed out. Outside a PR event (review-claims' issue_comment) the guard is open. Gitea's
# proxy forbids forks today (D44), but the template is family-wide. GitHub gives a fork PR no secret regardless.
#
# THE REVIEW METHOD, installed and keyed once for every job that reviews or judges (ci.yml review, review-claims.yml).
# The method is ai-lab's, and a repo's own environment does not carry it (lab-commons #11 and dev-lab #3, 2026-10-31:
# "cannot import 'ai_lab.review'", nothing posted): ai-lab is installed from this owner's forge into an environment of
# its own, whose interpreter the door is handed. The ai-lab COMMIT is the install step's AI_LAB_REF -- the ONE
# declaration (ciworkflows.pinned_ref('ai-lab')), never a floating branch (dev-lab #5 took whatever was current that minute).
# ai-lab reads keys from the git
# credential store ONLY (dev-lab #5: every reviewer `unsupported` with the secret set), so the key is stored for the
# review task in an in-memory credential cache, on stdin; with no secret (a fork PR) nothing is stored.
# NO CREDENTIAL OUTLIVES ITS USE (F-00bc79a46330): a forge token reaches git as process-scoped GIT_CONFIG_* env of
# the one step that fetches, never a config file a later step reads; the key's cache lives as long as one review
# (30 min) and the step that reads it stops the cache daemon on exit (`git credential-cache exit`). The cache is
# the JOB's own (F-83bc8b74b803): its socket lives under RUNNER_TEMP, so a job killed before its trap leaves a key
# no later job on a persistent runner can reach -- the default socket is per HOME, shared by every job.
method = [
    { name = "Install the review method", run = '''
cd "$RUNNER_TEMP"
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
python3 -I -m venv "$RUNNER_TEMP/ai-lab" && "$RUNNER_TEMP/ai-lab/bin/python" -I -m pip install -q uv
"$RUNNER_TEMP/ai-lab/bin/uv" pip install --no-config --python "$RUNNER_TEMP/ai-lab/bin/python" "ai_lab @ git+${FAMILY_SOURCE}ai-lab.git@$AI_LAB_REF"
''', env = { AI_LAB_REF = "3f8c7c5b25188b40673602682ce9df61157a16f6", FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
    { name = "Store the review key", run = '''if [ -n "$ANTHROPIC_API_KEY" ]; then git config --global credential.helper "cache --timeout=1800 --socket=$RUNNER_TEMP/git-credential-cache/socket" && printf '%s\n' "$ANTHROPIC_API_KEY" | "$RUNNER_TEMP/ai-lab/bin/python" -I -m ai_lab.auth login anthropic --task pr-review; fi''', env = { ANTHROPIC_API_KEY = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY || '' }}" } },
]

# THE REVIEW ITSELF, once: GitHub's ci.yml review job and Gitea's review.yml run this very step, each with the
# interpreter the `door` steps put the dev_lab door in (REVIEW_PYTHON), ISOLATED (-I): its cwd is the PR's checkout,
# and a PR-planted `dev_lab/` there would otherwise shadow the pinned door. The checkout is blobless, so the diff
# fetches base blobs on demand (F-ca1dda52c2ef, a consumer issue -- on a private forge the lazy fetch otherwise answers
# 401), and the door posts with the job token. NO FORGE TOKEN IS IN ANY ENVIRONMENT of the review (F-5a82981c5f22,
# F-d61706393b50): an unset variable still sits in /proc/<pid>/environ, readable by the reviewer it launches. So
# the hand-over step alone holds the tokens, writes each to a private file (umask 077), and the door reads each
# once and removes it before any subprocess: the read token is its git header, the job token its forge client's.
# The review key (ANTHROPIC_API_KEY) stays in the tests/review env: the reviewer needs it, a separate concern.
# Whatever the door does, the files die with the step (F-5fd2611e79ea): a self-hosted runner may reuse RUNNER_TEMP.
review = [
    { name = "Hand the forge tokens to the door", run = '''umask 077
mkdir -p "$RUNNER_TEMP/forge-secrets"
printf '%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" > "$RUNNER_TEMP/forge-secrets/read"
printf '%s' "$GITHUB_TOKEN" > "$RUNNER_TEMP/forge-secrets/api"
''', env = { FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
    { name = "tests/review", run = '''trap 'git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit; rm -rf "$RUNNER_TEMP/forge-secrets"' EXIT
"$REVIEW_PYTHON" -I -m dev_lab.dev.forge review run --pr ${{ github.event.pull_request.number }} --secret-env ANTHROPIC_API_KEY --git-token-file "$RUNNER_TEMP/forge-secrets/read" --api-token-file "$RUNNER_TEMP/forge-secrets/api" --runtime "ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python"
''', env = { ANTHROPIC_API_KEY = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY || '' }}" } },
]

# THE DOOR, installed from the dev-lab commit that DOOR_SHA's uv.lock pins (dev-lab #18): the consumer's lock is the
# one source of which door a job runs, so the job and `uv sync` never disagree. DOOR_SHA is a TRUSTED commit: a
# review job's BASE, never the PR head (F-76c85dbc4b77: the head is DATA, and its lock would let a PR choose the
# code that runs beside the review key); a job with no pull request (promote.yml) names the merged integration tip
# it fetched, as INTEGRATION_SHA. Neither is refused by name. dev-lab's own lock holds itself editable, so it runs
# the door at DOOR_SHA itself.
# Every dependency installs as the door commit's lock names it, the door itself --no-deps; the door lives in a
# venv of its own (REVIEW_PYTHON). Every uv call runs from $RUNNER_TEMP with --no-config (F-963500c5db57): a PR's
# uv.toml or [tool.uv.pip] in the checkout would otherwise name the index the locked packages come from.
# The door is fetched by sha as well as cloned: a commit not on a branch head the clone took is still served by sha
# while it is reachable on the forge.
door = [
    { name = "Install the review door", run = '''
cd "$RUNNER_TEMP"
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
[ -n "$DOOR_SHA" ] || { echo "no commit names the door: no pull request base and no INTEGRATION_SHA"; exit 1; }
DEV_LAB_REF=$(git -C "$GITHUB_WORKSPACE" show "$DOOR_SHA:uv.lock" | python3 -I -c 'import sys, tomllib
lock = tomllib.loads(sys.stdin.read())
(source,) = [p["source"] for p in lock.get("package", []) if p["name"] == "dev-lab"] or sys.exit("the base lock pins no dev-lab")
if "git" in source:
    print(source["git"].rpartition("#")[2])
elif source.get("editable") == ".":
    print(sys.argv[1])
else:
    sys.exit(f"dev-lab is locked from {source}, not a git revision")' "$DOOR_SHA") || exit 1
git clone -q --no-tags --filter=blob:none --no-checkout "${FAMILY_SOURCE}dev-lab.git" "$RUNNER_TEMP/dev-lab"
git -C "$RUNNER_TEMP/dev-lab" fetch -q --no-tags origin "$DEV_LAB_REF"
git -C "$RUNNER_TEMP/dev-lab" checkout -q --detach "$DEV_LAB_REF"
python3 -I -m venv "$RUNNER_TEMP/review" && "$RUNNER_TEMP/review/bin/python" -I -m pip install -q uv
"$RUNNER_TEMP/review/bin/uv" export --no-config --project "$RUNNER_TEMP/dev-lab" --frozen --no-hashes --no-header --no-annotate --no-emit-project > "$RUNNER_TEMP/review.txt"
"$RUNNER_TEMP/review/bin/uv" pip install --no-config --python "$RUNNER_TEMP/review/bin/python" -r "$RUNNER_TEMP/review.txt"
"$RUNNER_TEMP/review/bin/uv" pip install --no-config --python "$RUNNER_TEMP/review/bin/python" --no-deps "$RUNNER_TEMP/dev-lab"
echo "REVIEW_PYTHON=$RUNNER_TEMP/review/bin/python" >> "$GITHUB_ENV"
''', env = { DOOR_SHA = "${{ github.event.pull_request.base.sha || env.INTEGRATION_SHA }}", FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" } },
]

# THE LEAN SETUP A GITEA HOST-MODE RUNNER TAKES (one `review` runner, behind a campus ACL). No `uses`
# action -- a host runner behind the ACL fetches none -- and no sync of the repo's own dependencies: the `door` steps
# install the review tooling the BASE's lock pins, never the PR's lock.
# The forge is the runner's registered instance, read off ACTIONS_RUNTIME_URL (act_runner sets it to the instance +
# /api/actions_pipeline/): `github.server_url` is Gitea's ROOT_URL, the public name the host's ACL may refuse.
# Git reads a job-scoped global config (GIT_CONFIG_GLOBAL under RUNNER_TEMP) holding NO credential: it rewrites the
# public forge onto the instance; the review tools come from FAMILY_SOURCE (public, unauthenticated). Each fetching
# step authenticates with FAMILY_READ_TOKEN
# (read on the family repos the job installs) when that secret is set, else the job token, as its own process env.
# Every origin branch is fetched (the merge decision trial-merges against one), blobless, one pack thread: the
# review reads only its range's blobs.
# THE MIRROR RULE (D53(b), user ruling 2026-11-01): a job never clones the whole history. The local index-pack of
# a consumer's full history was most of the runner's 557 MiB peak on the 1.6 GB host, which held capacity at 1. Each
# repository has ONE persistent bare blobless mirror, $HOME/mirrors/<owner>/<repo>.git under the runner's HOME; a job
# updates it incrementally under `flock` on <repo>.git.lock (the kernel drops the lock when a killed job dies; the
# first run builds it at <repo>.git.new and renames it, so a half-built mirror is never used, and a stale *.lock a
# killed fetch left is removed while the flock is held). The mirror holds only the forge's BRANCHES -- no PR ref,
# no hook (empty template; every job's git runs core.hooksPath=/dev/null), no credential (the header is the step's
# GIT_CONFIG_* env, never a config write). The checkout is a `clone --shared` of it in the job's workspace,
# disposable, re-pointed at the forge as its promisor; the PR head is fetched into the checkout alone.
# Two jobs of one repository may overlap (the concurrency group is per PR, so a superseded run is cancelled and no
# PR's pending run is dropped for another's): the flock serialises their mirror updates, and a --prune'd branch's
# objects stay in the mirror's packs until a gc's prune expiry (two weeks), far beyond a job.
# The checkout is sparse, root files only: the review reads the head through git and only pyproject.toml from
# the tree, and a full checkout would lazily fetch every blob of the head (a large consumer: 10+ minutes on the host).
# `reach` is its own list: every Gitea host-runner job (review.yml, promote.yml) takes it before its own fetch.
reach = [
    { name = "Reach the forge on the runner's instance", run = '''
[ -n "$ACTIONS_RUNTIME_URL" ] || { echo "ACTIONS_RUNTIME_URL is unset: the runner names no forge to fetch from"; exit 1; }
echo "FORGE_URL=${ACTIONS_RUNTIME_URL%/api/actions_pipeline/}" >> "$GITHUB_ENV"
echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/gitconfig" >> "$GITHUB_ENV"
''' },
]

lean = [
    { name = "Fetch the head", env = { FAMILY_READ_TOKEN = "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}", GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}" | base64 -w0)"
git config --global url."$FORGE_URL/".insteadOf "${{ github.server_url }}/"
git config --global pack.threads 1
git config --global core.hooksPath /dev/null
REPO="$FORGE_URL/${{ github.repository }}.git"
MIRROR="$HOME/mirrors/${{ github.repository }}.git"
mkdir -p "${MIRROR%/*}"
(
  flock 9
  if [ ! -d "$MIRROR/objects" ]; then
    rm -rf "$MIRROR.new"
    git clone -q --bare --template= --no-tags --filter=blob:none "$REPO" "$MIRROR.new"
    mv "$MIRROR.new" "$MIRROR"
  fi
  find "$MIRROR" -maxdepth 2 -name '*.lock' -type f -delete
  git -C "$MIRROR" fetch -q --prune --no-tags --filter=blob:none origin '+refs/heads/*:refs/heads/*'
) 9>"$MIRROR.lock"
git clone -q --shared --no-checkout --template= "$MIRROR" .
git remote set-url origin "$REPO"
git config core.repositoryformatversion 1
git config extensions.partialClone origin
git config remote.origin.promisor true
git config remote.origin.partialclonefilter blob:none
git fetch -q --no-tags --filter=blob:none origin '+refs/heads/*:refs/remotes/origin/*' "+refs/pull/${{ github.event.pull_request.number }}/head:refs/remotes/origin/pull/${{ github.event.pull_request.number }}"
git sparse-checkout set --cone
git checkout -q --detach "$HEAD_SHA"
''' },
]

# GITEA'S REVIEW JOB (2026-11-01): tests/review on a Gitea-hosted repo is posted by its Actions job, so the status's
# recorded creator is the forge's Actions ghost (D11) -- but so is EVERY Actions job's, a PR-head workflow's too.
# TRIGGERED BY pull_request_target (dev-lab #30, user ruling 2026-11-01, option (b)): Gitea runs a pull_request
# workflow from the PR HEAD, so a same-repo PR could rewrite this file to post success itself or print the review
# key; a pull_request_target workflow is detected from the BASE commit (notifier_helper.go, 1.27), so the BASE's
# workflow runs -- the PR can neither change what runs nor read the secret -- and reviewgate counts a success only
# when that run concluded success (the job fails unless it posted success, forgetakeover.job_exit). Safe ONLY because
# what the job takes from the head is the DIFF, read as data; what it acts on is the base's -- the workflow,
# the [tool.dev_lab.review] declaration of the integration branch the DEFAULT branch names (the trust chain at
# ci.yml's review job; F-46e412ee799d, F-169e99e6c68c) and the tools, pinned by SHA (the base lock's dev-lab, AI_LAB_REF) (test_the_review_job_runs_no_code_the_pr_supplies).
# GitHub's ci.yml review keeps pull_request -- GitHub runs it from the merge ref with no secret for a fork.
# The types are pull_request's defaults plus ready_for_review (D52/D53): a draft is never reviewed, so marking it
# ready is what reviews it.
["review.yml"]
forge = "gitea"
name = "Review"

["review.yml".on.pull_request_target]
types = ["opened", "synchronize", "reopened", "ready_for_review"]

["review.yml".concurrency]
group = "review-${{ github.event.pull_request.number }}"
cancel-in-progress = true

["review.yml".env]
HEAD_SHA = "${{ github.event.pull_request.head.sha }}"
# Where the review tools come from: the toolchain lives on GitHub (ruling 2026-10-29), public and unauthenticated;
# the forge's own copy is not readable by the job token (D37). The host cannot substitute content: the locked dev-lab
# and AI_LAB_REF are full commit SHAs. A runner that cannot reach GitHub cannot run this job, and says so.
FAMILY_SOURCE = "https://github.com/DawnEver/"
UV_PYTHON = "python3"  # the host's interpreter: a host runner behind the ACL downloads none
UV_PYTHON_DOWNLOADS = "never"
UV_CONCURRENT_INSTALLS = "1"  # one at a time: the runner is memory-capped
UV_CONCURRENT_BUILDS = "1"

["review.yml".jobs.review]
runs-on = "review"
steps = [
    { use-steps = "reach" },
    { use-steps = "lean" },
    { use-steps = "door" },
    { use-steps = "method" },
    { use-steps = "review" },
]

# Gitea has no `statuses` scope: POST /statuses/{sha} asks Code write (reqRepoWriter(unit.TypeCode), 1.27), so the
# job takes contents: write. Under pull_request_target the base's block is the one that runs, so a PR cannot widen
# it; the ceiling is still the repo/org MaxTokenPermissions.
["review.yml".jobs.review.permissions]
actions = "read"  # reviewgate reads the job's own run: GET actions/runs/{id} is reqRepoReader(unit.TypeActions)
contents = "write"
pull-requests = "write"
issues = "write"

# CLAIMS ARE ADJUDICATED BY THE FORGE (user ruling 2026-10-31): a `forge review dispose` comment carrying the claim
# marker triggers this job, which rules on every pending claim of that PR or ledger issue as the job's own identity
# -- never the claimant's session (dev_lab.dev.forgereview_judge). A separate workflow, so a comment never runs the
# parts of ci.yml.
["review-claims.yml"]
name = "Review claims"

["review-claims.yml".on.issue_comment]
types = ["created", "edited"]

["review-claims.yml".concurrency]
group = "claims-${{ github.event.issue.number }}"
cancel-in-progress = false

["review-claims.yml".permissions]
contents = "read"

["review-claims.yml".env]
HEAD_SHA = "${{ github.sha }}"
FAMILY_SOURCE = "${{ github.server_url }}/${{ github.repository_owner }}/"  # the family repos sit beside this one
GITHUB_TOKEN = "${{ github.token }}"

["review-claims.yml".jobs.adjudicate]
if = "${{ contains(github.event.comment.body, '<!-- lab-commons:review-claim:') }}"
runs-on = "ubuntu-latest"
steps = [
    { use-steps = "setup" },
    { use-steps = "method" },
    { name = "Adjudicate the claims", run = 'trap "git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit" EXIT; uv run --no-sync python -m dev_lab.dev.forge review adjudicate ${{ github.event.issue.number }} --runtime "ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python"' },
]

["review-claims.yml".jobs.adjudicate.permissions]
contents = "read"
statuses = "write"
pull-requests = "write"
issues = "write"

# GITEA'S NIGHTLY PROMOTION (D48-1A, user ruling 2026-11-01): Gitea promotes integrate/main's tip once a night by the
# SAME decision as ci.yml's promote job -- `integrate promote`, the ONE place the parts gate -- then `branchprune
# sweep`. The decision reads only git and the forge's statuses (the parts Ada's `forge serve` already posted on the
# tip, D111), so the Gitea host, which cannot reach Ada, runs it: Ada pulls its work and pushes its verdicts, and the
# promotion asks Ada nothing. A tip main already holds is `current`: nothing moves. The parts are NOT re-run here --
# on Gitea the serve produces them per integration push; a tip whose run has not finished is refused tonight and
# promoted the first night it stands PASS. The checkout is commits only (--filter=tree:0, the MIRROR RULE's
# spirit: never the history's blobs); promote reads ancestry and the declaration at the tip, fetched on demand.
# Gitea's default branch is main, so the clone's HEAD would hold main and promote would refuse to move it: HEAD is
# detached onto integration's tip, and no worktree holds a branch.
# The door is the dev-lab the tip's own uv.lock pins: the fetch exports INTEGRATION_SHA, the `door` steps read it.
["promote.yml"]
forge = "gitea"
name = "Promote"
nightly = true

["promote.yml".on.workflow_dispatch]

["promote.yml".concurrency]
group = "promote"
cancel-in-progress = false

["promote.yml".env]
FAMILY_SOURCE = "https://github.com/DawnEver/"
UV_PYTHON = "python3"
UV_PYTHON_DOWNLOADS = "never"
UV_CONCURRENT_INSTALLS = "1"
UV_CONCURRENT_BUILDS = "1"

["promote.yml".jobs.promote]
runs-on = "review"
steps = [
    { use-steps = "reach" },
    { name = "Fetch integration's commits", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
git config --global url."$FORGE_URL/".insteadOf "${{ github.server_url }}/"
git config --global core.hooksPath /dev/null
git clone -q --no-tags --filter=tree:0 --no-checkout "$FORGE_URL/${{ github.repository }}.git" .
git update-ref --no-deref HEAD "$(git rev-parse origin/integrate/main)"
echo "INTEGRATION_SHA=$(git rev-parse origin/integrate/main)" >> "$GITHUB_ENV"
''' },
    { use-steps = "door" },
    { name = "Promote main", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
"$REVIEW_PYTHON" -I -m dev_lab.dev.integrate promote "$INTEGRATION_SHA" && git push origin main
''' },
    { name = "Delete the branches integration now contains", if = "${{ !cancelled() }}", env = { GITHUB_TOKEN = "${{ github.token }}" }, run = '''
export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$FORGE_URL/.extraHeader" GIT_CONFIG_VALUE_0="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
"$REVIEW_PYTHON" -I -m dev_lab.dev.branchprune sweep
''' },
]

# Promote posts no status: contents: write pushes main and deletes landed branches, pull-requests: write closes a
# landed PR before its branch goes.
["promote.yml".jobs.promote.permissions]
contents = "write"
pull-requests = "write"
