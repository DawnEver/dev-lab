# The native agent harnesses and how a session id may look: the ONE source of the catalog.
# Python reads it here; the installed JS launcher reads the JSON rendered from it (native_session.catalog_json).
max_length = 128
punctuation = "_.-"

[[harnesses]]
primary = "CLAUDE_CODE_SESSION_ID"
auxiliary = []

[[harnesses]]
primary = "CODEX_THREAD_ID"
auxiliary = ["CODEX_SESSION_ID"]

[[harnesses]]
primary = "ANTIGRAVITY_CONVERSATION_ID"
auxiliary = ["ANTIGRAVITY_TRAJECTORY_ID"]
