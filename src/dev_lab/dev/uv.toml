# THE uv that writes every lock in the family, and the one every installer here installs (dev_lab.dev.lockcheck).
# uv.lock's `revision` line is the WRITER'S format, so two uv releases relocking the same pins churn it and conflict.
# The forge keeps this at the newest uv release: a `forge serve` tick's relock (dev_lab.dev.relock) reads it against
# the newest release tag and raises it in the same pull request that relocks with that uv.
version = "0.13.9"

# The sha256 of each platform's archive of that release (dev_lab.dev.uvrelease.ASSETS), read from the release's
# <asset>.sha256 files when the version above moved (lockcheck.pin_uv); a lock writer is that exact uv, installed
# user-space beside any other pinned uv, never the host's PATH uv moved back and forth (2026-11-20).

[sha256]
linux-amd64 = "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
linux-arm64 = "0797542018e541a9288855df555c8077eed06f7a47d206362030480e8ecc9f3d"
osx-amd64 = "617a3211261b0fc739562f0071aa34e9739797c510208ede8e2977c30903d041"
osx-arm64 = "5aeca67f2283f75235de40d0bd9c0a5bbc5fce23b6d48b3bf9fa1b2db08382ca"
windows-amd64 = "edd61f7f5728a56cc62455386661860bdfc7bab65872f39b0c25bdcc1d8e1beb"
windows-arm64 = "72eed595983a4d7d22d79f21065b0f4479cc7e5c7a89104bb410c8f47559a878"
