# THE FAMILY'S GIT HOOKS -- the base every repo runs, as data. Read by dev_lab.dev.githooks.table.
#
# A repo OPTS IN by declaring [tool.dev_lab.hooks] in its pyproject.toml (an empty table takes
# this base as is) and layers its own rows on top under [[tool.dev_lab.hooks.<stage>]]:
# a row whose `id` is new is APPENDED to the stage; a row whose `id` names a base row is MERGED over
# it key by key (e.g. one `exclude`). Keys, all optional except `id` and `run`:
#
#   run         argv, run from the repo root in the repo's own venv. A leading "python" is the venv
#               interpreter; any other first word is looked up in the venv's scripts directory first.
#   files       regex (re.search) over repo-relative POSIX paths; a hook with none sees every file.
#   exclude     regex removing paths that `files` admitted.
#   pass_files  append the selected paths to `run` (pre-commit and pre-push stages).
#   always_run  run even when no path is selected.
#   env         a table of environment variables the command runs with (a script's repo facts).
#   refs        pre-push only: regex over the pushed REMOTE refs; the hook runs only for matching
#               refs and reads only their lines on stdin.
#   advisory    the row only SPEAKS (a warning, a notice): its output is shown whatever its exit, and no exit of
#               its fails the stage or is recorded as a wall.
#   isolate     run as its own subprocess. A `python -m <module>` row otherwise runs IN the runner's interpreter
#               (one interpreter per stage); any other `run` is always a subprocess.
#   bootstraps  it creates the checkout's own venv, so it runs on whichever interpreter the shim found.
#
# ONE STAGE PER CHECK: a check runs at the one stage its nature needs, never at two
# (tests/test_dev_githooks_runner.py, `test_no_base_module_runs_at_two_stages`).
#
# What each stage hands a hook is git's own contract: pre-commit selects among the STAGED paths;
# commit-msg appends the message file to `run`; pre-push pipes git's ref lines to stdin and selects
# among the paths those pushes change. A merge counts only its OWN content (a path differing from every
# parent), never a file it brings in (user ruling 2026-11-13): a hook checks, and a formatter rewrites, only
# what the commit changes; whole-tree checks are the forge's. The checks below report and never rewrite a file.
#
# WHAT RUNS HERE (toolchain plan P3, user-approved 2026-10-23; amended by the user ruling of 2026-11-07): a local
# row is an irreversible-harm check, a second-scale format check, or -- since 2026-11-07 -- a WARNING on the
# CURRENCY of a pr/* head. Everything else the forge judges on the pushed sha is the forge's alone, and a local copy only refused the
# same push twice: the tracked-tree scans (TRACKED-CITES-NO-EPHEMERAL, SCRATCH-IS-NEVER-COMMITTED:
# dev_lab.dev.famtests.ephemeralrefs, dev_lab.dev.scratch), the branch set (dev_lab.dev.famtests.branchset,
# dev_lab.dev.branchprune), the lock PIN (dev_lab.dev.famtests.lockpin) and PR advice (`forge pr create`,
# dev_lab.dev.pradmit, never a refusal). THE 2026-11-07 RULING reverses P3's "no local behind bound or lock
# freshness": agents kept pushing stale pr/* heads, and the forge's integration alarm and lock freshness status came
# after the harm. So the `pr-current` row (PR-HEAD-IS-CURRENT, dev_lab.dev.prcurrent) names a pr/* push whose
# tip lacks origin/<integration> (fetched afresh) or whose lock pins a floated sibling past the lag window
# (dev_lab.dev.locklag.within_window, the one window lock/lag reads), naming `forge sync`. Since dev-lab #661 the
# forge's `pr-current` is an ALARM, never a merge gate, so the row WARNS and never refuses; `forge pr ready` reads the
# same judgment. A finding the forge cannot see (an untracked stray file) is a post-commit hint.

# The per-file checks, ONE row (dev_lab.dev.filechecks all): the staged paths are handed over once and each file is
# read once, every check reporting under its own name. A repo skips one (`--skip CHECK`) or narrows one
# (`--exclude CHECK=REGEX`, `--max-kb N`) by restating this `run` in its own row of id "filechecks".
[[pre-commit]]
id = "filechecks"
run = ["python", "-m", "dev_lab.dev.filechecks", "all"]
pass_files = true

# USER-FROZEN-FILES (dev_lab.dev.frozen, user ruling 2026-11-24): in a repo declaring [tool.dev_lab.freeze], a
# commit changing a frozen file's bytes, deleting it, or adding a path outside freeze.toml's `tracked` is refused.
# Opt-in; a repo that does not declare it is never judged. The always-on family check is the CI half.
[[pre-commit]]
id = "frozen-files"
run = ["python", "-m", "dev_lab.dev.frozen", "commit"]
always_run = true

# The conventional-commit shape, owned once in dev_lab.dev.commitmsg (an empty message is an abort, not a refusal).
[[commit-msg]]
id = "conventional-commit"
run = ["python", "-m", "dev_lab.dev.commitmsg", "--commit-msg-file"]

# PRIVATE-MARKERS on the message, judged BEFORE the commit exists: the pre-push scan of the same message refuses
# a commit amend may no longer reword (GIT-COMMIT-AMEND), so the marker is caught while the reword is free.
[[commit-msg]]
id = "private-markers-message"
run = ["python", "-m", "dev_lab.dev.privatemarkers", "--commit-msg-file"]

# Warns on a malformed `Refs #N` / `Closes #N` / `Fixes #N` and never blocks (dev_lab.dev.issueref): `advisory`, so
# the warning is shown although the row passes.
[[commit-msg]]
id = "issue-ref"
run = ["python", "-m", "dev_lab.dev.issueref"]
advisory = true

# The origin host a `[priority] hosts` entry matches, as a `Forge-Host:` trailer (dev_lab.dev.forgeorigin).
# It appends the trailer and never blocks.
[[commit-msg]]
id = "forge-host"
run = ["python", "-m", "dev_lab.dev.forgeorigin"]

# ONE-SESSION-ONE-PR's identity: the launcher's LAB_SESSION as a `Lab-Session:` trailer, replacing any the
# agent wrote; a commit without it (agent or human) passes unstamped and is not judged (dev_lab.dev.labsession).
[[commit-msg]]
id = "lab-session"
run = ["python", "-m", "dev_lab.dev.labsession"]

# MERGE-DEVIATIONS-NAMED, checked when the merge is committed (dev_lab.dev.mergeaudit). It stays local: the
# remedy is a trailer IN the merge commit, and a pushed merge cannot be amended, so a forge-side red has no exit.
[[commit-msg]]
id = "merge-audit"
run = ["python", "-m", "dev_lab.dev.mergeaudit"]

# MERGE-RESOLUTION-DECLARED, beside it (dev_lab.dev.mergeresolution): every file the parents conflict on is
# declared once in the merge commit as `<path>: <class> -- <why>`; the conflicted set is recomputed, never read.
[[commit-msg]]
id = "merge-resolution"
run = ["python", "-m", "dev_lab.dev.mergeresolution"]

# SESSION-COMMITS-UNDER-ITS-TASK (dev_lab.dev.taskgate, user ruling 2026-11-14): in a repo declaring
# [tool.dev_lab.task] required = true, an agent session pushes only from a branch pr/<task>/<feature> of a task
# open in the machine's one task ledger (dev_lab.dev.taskledger; user ruling 2026-11-23: the branch is the task). Judged at every commit too: rem's PreToolUse guard is Claude
# Code's alone, so the git rows are the backstop for Codex, Antigravity or any agent. Opt-in; a repo that does not
# declare it is never judged.
[[commit-msg]]
id = "task-bound-commit"
run = ["python", "-m", "dev_lab.dev.taskgate"]
always_run = true

[[pre-push]]
id = "task-bound"
run = ["python", "-m", "dev_lab.dev.taskgate"]
always_run = true

# MEMORY-SHAPE, the change half (dev_lab.dev.memoryadds): a push may only ADD under **/.claude/memory/**, judged net
# over each pushed range since origin/<integration>. ONE stage, the one that PUBLISHES: immutability starts at
# publication, and every route a commit can take (a merge, a rebase, a commit made with the hook off) reaches it.
[[pre-push]]
id = "memory-adds"
run = ["python", "-m", "dev_lab.dev.memoryadds"]
always_run = true

# ZERO-CORE-CHANGE (dev_lab.dev.corechange, user ruling 2026-11-24): in a repo declaring [tool.dev_lab.layers], a
# pushed change set touching an application root AND the core is refused unless a commit of it carries
# `Architecture-Decision: <task>#D<n>` naming a decision recorded in the task ledger. Judged NET since the merge-base
# with origin/<integration>, so a split across pushes is one set. Opt-in; an undeclared repo is said to be not judged.
[[pre-push]]
id = "zero-core-change"
run = ["python", "-m", "dev_lab.dev.corechange"]
always_run = true

# The session-branch invariants at push, local reads only (dev_lab.dev.sessionbranch): a declared session branch
# or the trunk is published from that very local branch (PUBLISH-IS-THE-LOCAL-REF), by fast-forward
# (SESSION-HISTORY-ONLY-GROWS), and the integration branch by audited merges (INTEGRATION-IS-MERGES-ONLY);
# origin takes only a branch the set admits (ORIGIN-HOLDS-ONLY-DECLARED-BRANCHES). EARLY FEEDBACK for a PR head: the
# forge posts the same judgment as the `session-branch` status on every PR head and the merge requires it
# (dev_lab.dev.forgeheadgate).
[[pre-push]]
id = "session-branch"
run = ["python", "-m", "dev_lab.dev.sessionbranch"]
always_run = true

# BASE-HOLDS-THE-MILESTONE and VERSION-TAG-NEEDS-APPROVAL (dev_lab.dev.milestonebase, user ruling 2026-11-13): a
# pushed branch contains the newest milestone, the highest v<major>.<minor>.<patch>[.devN] tag on origin/<integration>
# or origin/<trunk>, a local-only stray ignored (remedy
# `forge sync`), and an agent session creates a v* tag on origin only with the user's words in DEV_LAB_TAG_APPROVED,
# and a dev tag only as .dev0 (hatch-vcs refuses .devN, N != 0). Local reads only.
[[pre-push]]
id = "milestone-base"
run = ["python", "-m", "dev_lab.dev.milestonebase"]
always_run = true

# NO-PUSH-ONTO-A-CLOSED-PR (dev_lab.dev.closedpush): a branch whose PR into the integration branch the forge
# closed UNMERGED, with no open PR for it, takes no new push -- no PR would carry it. A merged PR's branch passes:
# the forge opens its continuation (dev_lab.dev.prcontinue). An unreadable forge refuses.
[[pre-push]]
id = "closed-pr"
run = ["python", "-m", "dev_lab.dev.closedpush"]
always_run = true

# LOSSLESS-DELETE at push (dev_lab.dev.pushdelete, toolchain O22): EVERY branch a push deletes, however the push was
# spelled -- a `$refs` variable, xargs, a script; the PUSH-REMOTE-DELETE deny row reads only text -- is judged on git's
# own ref lines by the judgment `branchprune delete` makes (dev_lab.dev.deletejudge), after `git fetch --prune
# origin`, against the open PR heads. Irreversible harm, so it refuses; no `refs`: a deletion is the very line a ref
# filter drops. The door's own push passes it, no exemption. An unreadable forge or origin refuses (fails closed).
# A tag holds nothing (D22); a branch `[tool.dev_lab.integrator] derived` declares with its producer goes (D23).
[[pre-push]]
id = "lossless-delete"
run = ["python", "-m", "dev_lab.dev.pushdelete"]
always_run = true

# PR-HEAD-IS-CURRENT (dev_lab.dev.prcurrent, user ruling 2026-11-07; a TIME window 2026-11-15): a pr/* head lacks
# no origin/<integration> landing older than locklag.LAG_WINDOW, its lock pins no floated sibling past that window,
# and the pushing venv holds what that lock pins (else these hooks ran a stale kit); the remedy is `forge sync` (for
# the kit, the bootstrap door). A WARNING, never a refusal (`advisory`): the forge posts the same judgment as the
# `pr-current` status on every PR head, an ALARM the merge never waits on (dev_lab.dev.forgeheadgate, W5 dev-lab#644,
# #661): mergeability is the trial merge at merge time, and a push refused on it would be a gate that does not exist.
[[pre-push]]
id = "pr-current"
run = ["python", "-m", "dev_lab.dev.prcurrent"]
always_run = true
refs = '^refs/heads/pr/'
advisory = true

# FORGE NOTICES WHERE A SESSION ACTS ON ITS PR (user ruling 2026-10-21): a pr/* push prints that PR's open notices
# for this LAB_SESSION (dev_lab.dev.branchnotices: one reader, cached 60 s, short deadline, read-only, silent when
# none, exit 0 always; `advisory`, so what it prints is shown). The PUSH is where a session acts on its PR -- a commit
# is local, and the PR has not seen it -- and git's ref lines name exactly the pr/* heads it publishes.
[[pre-push]]
id = "pr-notices"
run = ["python", "-m", "dev_lab.dev.branchnotices"]
always_run = true
refs = '^refs/heads/pr/'
advisory = true

# TASK-HEARS-ITS-FORGE-EVENTS (2026-11-12): a push records its branches and heads as the agent session's
# (the canonical native harness identity) in the repository git is pushing, from git's own ref lines -- never from a shell line's
# working directory (dev_lab.dev.sessionprs.record_pushed). Records, says a failure, exits 0 always.
[[pre-push]]
id = "session-prs"
run = ["python", "-m", "dev_lab.dev.sessionprs", "--push"]
always_run = true
refs = '^refs/heads/'

# post-commit is ADVISORY (githooks.table.ADVISORY): the commit is made, and no row can change its exit status.

# STRAY-FILE-REFUSED as a HINT: an untracked, non-ignored file outside the declared stray roots
# (layout.toml stray_roots, plus scratch/) is named with its remedy after the commit
# (dev_lab.dev.strays). Untracked files are invisible to the forge, so this is the one place it is said.
[[post-commit]]
id = "stray-files"
run = ["python", "-m", "dev_lab.dev.strays", "check"]
always_run = true

# A PRESSED HOST TELLS ITS AGENTS (ruling D54): this host's disk/memory/CPU alarms, the agent hook's own lines
# (dev_lab.dev.hostalarm check; silent when the host is not pressed, exit 0; `advisory`, so its lines are shown) --
# a secondary channel to the hook.
[[post-commit]]
id = "host-pressure"
run = ["python", "-m", "dev_lab.dev.hostalarm", "check"]
always_run = true
advisory = true

# RECLAIM RUNS IN THE WORKFLOW (user ruling 2026-11-12: clearing useless worktrees is REQUIRED): a merge detaches a
# background reclaim of the main checkout (dev_lab.dev.reclaimrun --background: per-repo lock, bounded batch, exit 0
# always), so it never delays the merge. ONE git trigger beside the agent's SessionStart run: a tree becomes
# reclaimable when its branch LANDS, which a checkout learns when it takes in upstream -- a pull, `forge sync` --
# never at a push (it lands nothing) or a checkout (it creates a tree, never frees one).
[[post-merge]]
id = "reclaim"
run = ["python", "-m", "dev_lab.dev.reclaimrun", "--background"]
always_run = true

# KEEP WHAT GIT STOPPED TRACKING BUT THE REPO NOW IGNORES (dev_lab.dev.keepignored): a commit that untracks a path
# beside a .gitignore line (local state moved out of git) would have git DELETE it from every checkout that takes the
# commit in; the row writes the previous head's bytes back, never over a file, never for a path still tracked or not
# ignored. A merge's previous head is ORIG_HEAD; a checkout's (a rebase checks out too) is HEAD@{1}.
[[post-merge]]
id = "keep-ignored"
run = ["python", "-m", "dev_lab.dev.keepignored", "--since", "ORIG_HEAD"]
always_run = true

[[post-checkout]]
id = "keep-ignored"
run = ["python", "-m", "dev_lab.dev.keepignored", "--since", "HEAD@{1}"]
always_run = true

# VENV-FOLLOWS-THE-LOCK (user ruling 2026-11-04): a checkout that moved pyproject.toml/uv.lock detaches a
# re-bootstrap of this checkout's venv (dev_lab.dev.venvfollow); an unchanged lock costs one hash, a live run skips.
# ADVISORY: the checkout is done. `bootstraps`: a checkout with NO venv (a new worktree) runs it on the interpreter
# the shim found, so the venv is created rather than every row skipped. ONE git trigger: post-checkout is the only
# event a new worktree fires, and without its venv every judged stage there is refused; a merge that moves the lock
# leaves a WORKING venv one kit behind, which the SessionStart follow and the pr-current kit warning both name.
[[post-checkout]]
id = "venv-follows-lock"
run = ["python", "-m", "dev_lab.dev.venvfollow", "--background"]
always_run = true
bootstraps = true
