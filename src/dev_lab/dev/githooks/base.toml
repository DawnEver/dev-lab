# THE FAMILY'S GIT HOOKS -- the base every repo runs, as data. Read by dev_lab.dev.githooks.table.
#
# A repo OPTS IN by declaring [tool.dev_lab.hooks] in its pyproject.toml (an empty table takes
# this base as is) and layers its own rows on top under [[tool.dev_lab.hooks.<stage>]]:
# a row whose `id` is new is APPENDED to the stage; a row whose `id` names a base row is MERGED over
# it key by key (e.g. one `exclude`). Keys, all optional except `id` and `run`:
#
#   run         argv, run from the repo root in the repo's own venv. A leading "python" is the venv
#               interpreter; any other first word is looked up in the venv's scripts directory first.
#   files       regex (re.search) over repo-relative POSIX paths; a hook with none sees every file.
#   exclude     regex removing paths that `files` admitted.
#   pass_files  append the selected paths to `run` (pre-commit and pre-push stages).
#   always_run  run even when no path is selected.
#   env         a table of environment variables the command runs with (a script's repo facts).
#   refs        pre-push only: regex over the pushed REMOTE refs; the hook runs only for matching
#               refs and reads only their lines on stdin.
#
# What each stage hands a hook is git's own contract: pre-commit selects among the STAGED paths;
# commit-msg appends the message file to `run`; pre-push pipes git's ref lines to stdin and selects
# among the paths those pushes change. The checks below report and never rewrite a file.
#
# WHAT RUNS HERE (toolchain plan P3, user-approved 2026-10-23; amended by the user ruling of 2026-11-07): a local
# row is an irreversible-harm check, a second-scale format check, or -- since 2026-11-07 -- the CURRENCY of a pr/*
# head. Everything else the forge judges on the pushed sha is the forge's alone, and a local copy only refused the
# same push twice: the tracked-tree scans (TRACKED-CITES-NO-EPHEMERAL, SCRATCH-IS-NEVER-COMMITTED:
# dev_lab.dev.famtests.ephemeralrefs, dev_lab.dev.scratch), the branch set (dev_lab.dev.famtests.branchset,
# dev_lab.dev.branchprune), the lock PIN (dev_lab.dev.famtests.lockpin) and PR advice (`forge pr create`,
# dev_lab.dev.pradmit, never a refusal). THE 2026-11-07 RULING reverses P3's "no local behind bound or lock
# freshness": agents kept pushing stale pr/* heads, and the forge's integration alarm and lock/fresh status came
# after the harm. So the `pr-current` row (PR-HEAD-IS-CURRENT, dev_lab.dev.prcurrent) refuses a pr/* push whose
# tip lacks origin/<integration> (fetched afresh) or whose lock pins a floated sibling past the lag
# window (dev_lab.dev.locklag.within_window, the one window lock/lag reads), naming `forge sync`; `forge pr ready` reads the same judgement. A finding
# the forge cannot see (an untracked stray file) is a post-commit hint.

[[pre-commit]]
id = "check-added-large-files"
run = ["python", "-m", "dev_lab.dev.filechecks", "large-files"]
pass_files = true

[[pre-commit]]
id = "check-ast"
run = ["python", "-m", "dev_lab.dev.filechecks", "ast"]
files = '\.pyi?$'
pass_files = true

[[pre-commit]]
id = "check-case-conflict"
run = ["python", "-m", "dev_lab.dev.filechecks", "case-conflict"]
pass_files = true

[[pre-commit]]
id = "check-json"
run = ["python", "-m", "dev_lab.dev.filechecks", "json"]
files = '\.json$'
pass_files = true

[[pre-commit]]
id = "check-merge-conflict"
run = ["python", "-m", "dev_lab.dev.filechecks", "merge-conflict"]
pass_files = true

[[pre-commit]]
id = "check-toml"
run = ["python", "-m", "dev_lab.dev.filechecks", "toml"]
files = '\.toml$'
pass_files = true

[[pre-commit]]
id = "debug-statements"
run = ["python", "-m", "dev_lab.dev.filechecks", "debug-statements"]
files = '\.pyi?$'
pass_files = true

[[pre-commit]]
id = "end-of-file"
run = ["python", "-m", "dev_lab.dev.filechecks", "end-of-file"]
pass_files = true

[[pre-commit]]
id = "mixed-line-ending"
run = ["python", "-m", "dev_lab.dev.filechecks", "mixed-line-ending"]
pass_files = true

[[pre-commit]]
id = "trailing-whitespace"
run = ["python", "-m", "dev_lab.dev.filechecks", "trailing-whitespace"]
pass_files = true

# The conventional-commit shape, owned once in dev_lab.dev.commitmsg (an empty message is an abort, not a refusal).
[[commit-msg]]
id = "conventional-commit"
run = ["python", "-m", "dev_lab.dev.commitmsg", "--commit-msg-file"]

# Warns on a malformed `Refs #N` / `Closes #N` / `Fixes #N` and never blocks (dev_lab.dev.issueref).
[[commit-msg]]
id = "issue-ref"
run = ["python", "-m", "dev_lab.dev.issueref"]

# The origin host a `[priority] hosts` entry matches, as a `Forge-Host:` trailer (dev_lab.dev.forgeorigin).
# It appends the trailer and never blocks.
[[commit-msg]]
id = "forge-host"
run = ["python", "-m", "dev_lab.dev.forgeorigin"]

# ONE-SESSION-ONE-PR's identity: the launcher's LAB_SESSION as a `Lab-Session:` trailer, replacing any the
# agent wrote; a commit without it (agent or human) passes unstamped and is not judged (dev_lab.dev.labsession).
[[commit-msg]]
id = "lab-session"
run = ["python", "-m", "dev_lab.dev.labsession"]

# MERGE-DEVIATIONS-NAMED, checked when the merge is committed (dev_lab.dev.mergeaudit). It stays local: the
# remedy is a trailer IN the merge commit, and a pushed merge cannot be amended, so a forge-side red has no exit.
[[commit-msg]]
id = "merge-audit"
run = ["python", "-m", "dev_lab.dev.mergeaudit"]

# MERGE-RESOLUTION-DECLARED, beside it (dev_lab.dev.mergeresolution): every file the parents conflict on is
# declared once in the merge commit as `<path>: <class> -- <why>`; the conflicted set is recomputed, never read.
[[commit-msg]]
id = "merge-resolution"
run = ["python", "-m", "dev_lab.dev.mergeresolution"]

# MEMORY-SHAPE, the change half (dev_lab.dev.memoryadds): EVERY commit, a merge included, may only ADD under
# **/.claude/memory/** -- read off the index, so a plain commit and a merge resolution are judged alike.
[[commit-msg]]
id = "memory-adds"
run = ["python", "-m", "dev_lab.dev.memoryadds", "commit"]

# The session-branch invariants at push, local reads only (dev_lab.dev.sessionbranch): a declared session branch
# or the trunk is published from that very local branch (PUBLISH-IS-THE-LOCAL-REF), by fast-forward
# (SESSION-HISTORY-ONLY-GROWS), and the integration branch by audited merges (INTEGRATION-IS-MERGES-ONLY);
# origin takes only a branch the set admits (ORIGIN-HOLDS-ONLY-DECLARED-BRANCHES).
# MEMORY-SHAPE again at push, over each pushed range since origin/<integration>: a commit made past the
# commit-msg row (--no-verify, another tool) still reds before it leaves.
[[pre-push]]
id = "memory-adds"
run = ["python", "-m", "dev_lab.dev.memoryadds", "push"]
always_run = true

# The session-branch invariants (dev_lab.dev.sessionbranch). EARLY FEEDBACK for a PR head: the forge posts the same
# judgement as the `session-branch` status on every PR head and the merge requires it (dev_lab.dev.forgeheadgate).
[[pre-push]]
id = "session-branch"
run = ["python", "-m", "dev_lab.dev.sessionbranch"]
always_run = true

# NO-PUSH-ONTO-A-CLOSED-PR (dev_lab.dev.closedpush): a branch whose PR into the integration branch the forge
# closed UNMERGED, with no open PR for it, takes no new push -- no PR would carry it. A merged PR's branch passes:
# the forge opens its continuation (dev_lab.dev.prcontinue). An unreadable forge refuses.
[[pre-push]]
id = "closed-pr"
run = ["python", "-m", "dev_lab.dev.closedpush"]
always_run = true

# PR-HEAD-IS-CURRENT (dev_lab.dev.prcurrent, user ruling 2026-11-07): a pr/* head holds origin/<integration>'s
# current tip and a lock fresh against the floated siblings' heads; the remedy is `forge sync`. EARLY FEEDBACK only:
# the forge posts the same judgement as the `pr-current` status on every PR head and the merge requires it
# (dev_lab.dev.forgeheadgate, user ruling 2026-11-07), so a stale or missing shim never disarms it.
[[pre-push]]
id = "pr-current"
run = ["python", "-m", "dev_lab.dev.prcurrent"]
always_run = true
refs = '^refs/heads/pr/'

# FORGE NOTICES WHERE A SESSION ACTS ON ITS PR (user ruling 2026-10-21): a pr/* push, and every commit on a pr/*
# branch, print that PR's open notices for this LAB_SESSION (dev_lab.dev.branchnotices: one reader, cached 60 s,
# short deadline, read-only, silent when none, exit 0 always). git verbs are the decision points every vendor shares.
[[pre-push]]
id = "pr-notices"
run = ["python", "-m", "dev_lab.dev.branchnotices", "--push"]
always_run = true
refs = '^refs/heads/pr/'

# SESSION-HEARS-ITS-PRS (2026-11-12): a push records its branches and heads as the agent session's
# (CLAUDE_CODE_SESSION_ID) in the repository git is pushing, from git's own ref lines -- never from a shell line's
# working directory (dev_lab.dev.sessionprs.record_pushed). Records, says a failure, exits 0 always.
[[pre-push]]
id = "session-prs"
run = ["python", "-m", "dev_lab.dev.sessionprs", "--push"]
always_run = true
refs = '^refs/heads/'

# post-commit is ADVISORY (githooks.table.ADVISORY): the commit is made, and no row can change its exit status.

# STRAY-FILE-REFUSED as a HINT: an untracked, non-ignored file outside the declared stray roots
# ([tool.dev_lab.placement] stray_roots, plus scratch/) is named with its remedy after the commit
# (dev_lab.dev.codeplace). Untracked files are invisible to the forge, so this is the one place it is said.
[[post-commit]]
id = "stray-files"
run = ["python", "-m", "dev_lab.dev.codeplace", "stray-check"]
always_run = true

[[post-commit]]
id = "pr-notices"
run = ["python", "-m", "dev_lab.dev.branchnotices"]
always_run = true

# A PRESSED HOST TELLS ITS AGENTS (ruling D54): this host's disk/memory/CPU alarms, the agent hook's own lines
# (dev_lab.dev.hostalarm check; silent when the host is not pressed) -- a secondary channel to the hook.
[[post-commit]]
id = "host-pressure"
run = ["python", "-m", "dev_lab.dev.hostalarm", "check"]
always_run = true

# VENV-FOLLOWS-THE-LOCK (user ruling 2026-11-04): a merge or checkout that moved pyproject.toml/uv.lock detaches a
# re-bootstrap of this checkout's venv (dev_lab.dev.venvfollow); an unchanged lock costs one hash, a live run skips.
# Both stages are ADVISORY: the merge or checkout is done.
[[post-merge]]
id = "venv-follows-lock"
run = ["python", "-m", "dev_lab.dev.venvfollow", "--background"]
always_run = true

[[post-checkout]]
id = "venv-follows-lock"
run = ["python", "-m", "dev_lab.dev.venvfollow", "--background"]
always_run = true
