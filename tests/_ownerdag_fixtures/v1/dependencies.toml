# ---------------------------------------------------------------------------------------------------------
# Rust: crate graph and external crates
# ---------------------------------------------------------------------------------------------------------
# There is no [rust.crates] table (D121, D123): a crate lives at rust/crates/<owner>/<child>, the path of the Python
# owner it belongs to, and its Cargo dependencies must be a subset of the [python.owners] + [python.siblings.*] edges
# between those owners -- one graph, derived and checked. product_native (rust/pybind) is the one Python exit and
# may depend on every crate; its submodules derive from the crate paths.

[rust.external]
numerics = { crates = ["models_geometry", "compile_discretize", "compile_assemble", "runtime_execution", "models_signal", "models_constitutive_relations"], reason = "the family solver library, depended on directly (no door crate, D64); discretize: dense ops, condensation (D79); geometry: dual numbers and bit-reproducible transcendentals (D107)" }
rayon = { crates = ["models_geometry", "compile_discretize", "compile_assemble", "models_constitutive_relations", "runtime_execution"], reason = "the one data-parallel mechanism; thread count from configuration, reductions independent of it" }
robust = { crates = ["models_geometry", "compile_discretize"], reason = "exact geometric predicates (Shewchuk)" }
libm = { crates = ["models_geometry"], reason = "bit-identical math across platforms (rust-lang)" }
pyo3 = { crates = ["product_native", "contracts"], reason = "Python binding; moves with numpy (pins live in Cargo.toml)" }
numpy = { crates = ["product_native", "contracts"], reason = "numpy buffers; tracks pyo3's minor" }
ndarray = { crates = ["*"], reason = "the array type of generated IR records (ArrayD) and numpy's buffers; pyo3/numpy in contracts only behind its pyo3 feature (dev-lab irrust)" }
serde = { crates = ["contracts"], features = ["derive"], reason = "generated IR records derive (de)serialization (dev-lab irrust)" }
cc = { crates = ["runtime_external_jmag"], kind = "build", reason = "compiles the C++ shim (rust-lang)" }
serde_json = { crates = ["contracts"], dev_crates = ["*"], features = ["float_roundtrip"], reason = "generated IR record encoding in `contracts` (dev-lab irrust); every crate's tests read .jsonl goldens; float_roundtrip is mandatory (1-ulp misreads measured)" }
sha2 = { crates = ["contracts"], kind = "dev", reason = "cross-checks the generated content_hash against Python" }
tract-onnx = { crates = ["runtime_execution"], reason = "pure-Rust ONNX inference of learned field operators (U-Net/FNO measured 3e-7..9e-7 rel L2 vs torch f32); constitutive laws never go through ONNX (D82)" }
num-complex = { crates = ["compile_discretize", "compile_assemble", "runtime_execution", "models_constitutive_relations"], reason = "complex harmonic quantities; MIT/Apache (D99 recording correction)" }
libloading = { crates = ["runtime_external_c_compiler"], reason = "loads a compiled C-Script library in process (D85)" }
memmap2 = { crates = ["runtime_external_c_compiler"], reason = "buffers shared with the isolated host process (D85)" }
windows-sys = { crates = ["runtime_external_c_compiler"], reason = "named-event doorbell and PE section table for static-image checkpoints on Windows (D85)" }
libc = { crates = ["runtime_external_c_compiler"], reason = "the stable line only, never an alpha; futex doorbell and dl_iterate_phdr for static-image checkpoints on Linux (D85)" }
num-rational = { crates = ["models_geometry"], reason = "exact rational arithmetic for the certified NURBS offset (D79); MIT OR Apache-2.0" }
num-bigint = { crates = ["models_geometry"], reason = "arbitrary-precision integers under num-rational (D79); MIT OR Apache-2.0" }
faer = { crates = [], reason = "linear algebra is numerics-lab's" }

[rust.std]
# std items restricted by crate; anything unlisted is allowed. Tests may use std::fs.
"std::sync::Arc" = { crates = ["*"], reason = "shared read-only data, no side effect" }
"std::sync::atomic" = { crates = ["runtime_execution"], reason = "cancellation flags and progress counters" }
"std::sync::Mutex" = { crates = ["runtime_external_jmag", "runtime_external_c_compiler"], reason = "a DLL loads once per process; no shared mutable state elsewhere (D64)" }
"std::sync::RwLock" = { crates = [], reason = "no shared mutable state" }
"std::sync::OnceLock" = { crates = ["runtime_external_jmag"], reason = "the one process-wide jbdll handle; C-Script blocks load one copy per instance (D85); no global caches" }
"std::sync::LazyLock" = { crates = [], reason = "no global caches" }
"std::env" = { crates = [], reason = "explicit configuration only (D65)" }
"std::fs" = { crates = ["runtime_external_jmag", "runtime_external_c_compiler"], reason = "IO is Python's; tests read goldens" }
"std::process" = { crates = ["runtime_external_jmag", "runtime_external_c_compiler"], reason = "the guard process" }
"std::net" = { crates = [], reason = "no network" }
"std::thread" = { crates = ["runtime_execution"], reason = "real-time loop and co-simulation pacing only; parallel computation is rayon" }
unsafe = { crates = ["runtime_external_jmag", "runtime_external_jmag_guard", "runtime_external_c_compiler"], reason = "the JMAG jbdll FFI and the PLECS block ABI (D85); elsewhere only by receipt with a benchmark" }
'extern "C"' = { crates = ["runtime_external_jmag", "runtime_external_jmag_guard", "runtime_external_c_compiler"], reason = "the JMAG jbdll FFI and the PLECS block ABI (D85)" }
