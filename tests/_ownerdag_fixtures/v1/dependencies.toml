# Who may depend on what (D63). Versions live in pyproject.toml / Cargo.toml and their locks; this file names
# only permission. Paths are layout.toml rows; a row here naming no layout row is refused. Every row says why.
# Python: a third-party or family package no row names is refused everywhere; a standard-library module is
# allowed unless a row restricts it. Rust: an external crate no row names is refused.

# ---------------------------------------------------------------------------------------------------------
# Python: internal layers
# ---------------------------------------------------------------------------------------------------------
[python.owners]
# The owner DAG: each top-level owner lists exactly the owners it may import (least privilege, no implied
# order). The table must be acyclic. Inside an owner, children import each other only along the edges its
# [python.siblings.<owner>] table declares (default: none); what two siblings share otherwise moves to their parent or to contracts (D69).
# A child may import its parent; a parent never imports its children (D112 C6). Every sibling table lists ALL children,
# an empty list meaning no edge, so the table is also the closed list of the owner's children.
contracts = []                                   # the dependency-free leaf every layer talks through (D13)
models = ["contracts"]                           # declares physics, laws, signals, geometry (D22)
compile = ["contracts", "models"]                # lowers declarations to IR; transforms only declare (D38, D107)
runtime = ["contracts", "models", "compile"]     # executes IR: one entry, native or external (D111)
presentation = ["contracts", "models"]           # generic: results -> display units, view descriptions, reports
ingest = ["contracts", "models"]                 # generic input boundary: foreign inputs -> typed objects (D71)
applications = ["contracts", "models", "compile", "runtime", "presentation", "ingest"]   # the only domain knowledge composes everything below (D71, D106)
benchmarks = ["contracts", "models", "compile", "runtime", "presentation", "applications"]   # never parses vendor files: references arrive as result records (D71, D72)
agent = ["contracts", "models", "compile", "runtime", "presentation", "ingest", "applications", "benchmarks"]   # tools derive from the verb table + the owners' typed action entry points (D104 E1, D107)
cli = ["contracts", "models", "compile", "runtime", "presentation", "ingest", "applications", "benchmarks"]   # the thin entry point: parse, call a typed entry, render (D104 E1)

[python.siblings.applications]
# Edges BETWEEN the children of one owner (default: none). Applications follow product containment (D71):
# a part used by two or more applications is its own application (D47) and its users import it directly.
electric_machine = []
magnetic_component = []
power_converter = ["magnetic_component"]
drive_unit = ["electric_machine", "power_converter"]
vehicle = ["drive_unit"]

[python.siblings.compile]
# elaborate, transform and emit exchange only contracts IR; runtime/execution chains them (D112 C1).
# discretize, analyze_structure and assemble are Rust-owned children (no Python folder, D36); they join the ONE
# graph so their crate edges have Python edges to be a subset of (D121, D123).
elaborate = []
transform = []
emit = []
discretize = []
analyze_structure = []
assemble = ["discretize"]

[python.siblings."compile/transform"]
# transforms chain by declared pre/post conditions, never by import (D112 C2).
formulation = []
symmetry_reduction = []
dimension_reduction = []
coordinate_change = []
frequency_domain = []
linearization = []
sensitivity = []
model_order_reduction = []
asymptotic_limits = []
switching_averaging = []
coupling_simplification = []

[python.siblings."compile/emit"]
# real nesting of generated content only (D112 C4).
c_code = []
fmi = ["c_code"]
spice = []
jmag = []
aedt = []
femm = []
fluent = []
openfoam = []
plecs = ["c_code"]
matlab = []
simba = []
mapdl = []
lsdyna = []
smtlib = []

[python.siblings.presentation]
views = []
tables = []
reports = ["views", "tables"]

[python.siblings."models/geometry"]
# assembly composes construction trees; reconstruction fits emit the same tree (D77, D112 M1/M2); exchange writes it.
construction = []
assembly = ["construction"]
reconstruction = ["construction"]
exchange = ["construction"]

[python.siblings.contracts]
# generated holds the types built from schema; serialization and foreign_formats read them (D38, D108).
serialization = ["generated"]
foreign_formats = ["generated"]
generated = []

[python.siblings.models]
geometry = []
governing_equations = []
constitutive_relations = []
signal = []

[python.siblings.benchmarks]
accuracy = ["references"]   # verdicts read the reference rung (D30, D54)
references = []
performance = []
strategies = []

[python.importers]
# A child whose importers are narrower than its owner's: only these may import it (D72).
"contracts/foreign_formats" = ["compile/emit", "ingest", "runtime/external", "tests"]

[python.siblings.runtime]
# execution dispatches every problem class; outer classes go to nested_problems with execution passed in as the
# inner evaluator (recursion by callback, adds = control), so no child imports execution (D106, D111).
execution = ["nested_problems", "external", "result_cache"]
nested_problems = []
external = ["result_cache"]
result_cache = []

