# The closed inventory of this checkout: every directory and the file formats it allows (dev-lab DECLARED-LAYOUT).
# No inheritance: every directory matches a row of its own; a directory no row matches is refused.

read_only = ["temp", "attic"]
scratch = "scratch/"
max_age = "3 d"
pruned_paths = [".claude/worktrees"]
# Tool caches under output/cache/<tool>/: each tool's private format, unjudged. oracle = the Oracle client's cache.
tool_caches = ["pytest", "ruff", "coverage", "hypothesis", "pyright", "oracle"]
# Vendor job trees under output/logs/<yy>/<mm>/<dd>/vendor/<program>/<job>/: the emitted model and scripts plus the
# program's own files, unjudged, written only by runtime/external/<program> (D95; dev-lab pr/toolchain/vendor-jobs ae88c990).
vendor_jobs = ["jmag", "aedt", "femm", "fluent", "openfoam", "plecs", "ngspice", "matlab", "simba", "mapdl", "lsdyna", "freecad", "gmsh", "z3", "c_compiler"]   # equals the runtime/external children (architecture test)

[layout]
"." = [
  "pyproject.toml", "uv.lock", "rust-toolchain.toml", "freeze.toml", "layout.toml", "dependencies.toml",
  "AGENTS.md", "CLAUDE.md", "README.md", ".gitignore", ".gitattributes",
]

# --- agent and editor configuration
".vscode" = ["settings.json"]
".claude" = ["settings.json", "settings.local.json", "automode.json"]
".claude/hooks" = ["deny-commands.js", "venv_resolver.js", "py.js", "deny-rules.json", "native_session.json"]
".claude/memory" = []
".claude/memory/[0-9][0-9][0-9][0-9]" = []
".claude/memory/[0-9][0-9][0-9][0-9]/[0-9][0-9]" = []
".claude/memory/[0-9][0-9][0-9][0-9]/[0-9][0-9]/[0-9][0-9]" = [".md"]
".codex" = []
".codex/rules" = ["family-doors.rules", "family-denies.rules"]

# --- docs: one cross-owner map; owner responsibilities live in their __init__ docstrings (pdoc)
"docs-src" = ["index.md", "architecture.md"]

