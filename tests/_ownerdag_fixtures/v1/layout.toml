"data/standards/unece" = []
"data/standards/gb" = []
"data/standards/en" = []
"data/standards/*/*" = [".toml"]                  # <number>/<part>.toml, filed under the ORIGINATING body; adoption and edition read go in each citation
"data/materials" = []
"data/materials/*" = [".toml"]                    # <family>: steel, ferrite, ndfeb, smco, copper, insulation, ... (D105)
"data/applications" = { mirror = "src/product/applications", allow = [".toml"], depth = 1 }   # data an application owns and many cases cite (e.g. electric_machine power-scaling laws, factory capability) (D105, D108)
