"output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/convert/fmi" = [".fmu"]
"output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/convert/matlab_code" = [".zip"]   # generated MATLAB .m scripts (e.g. descriptor models) leave as one archive (D104, D107)
"output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/convert/smtlib" = [".smt2"]  # certificates as SMT-LIB2, re-checked by runtime/external/z3 (D107)
"output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/pack" = [".jsonl", ".zip"]    # manifest.toml inside the zip; client delivery is a pack option (--for client)
"output/logs/[0-9][0-9]/[0-9][0-9]/[0-9][0-9]/vendor" = [".jsonl"]          # vendor operation records; job trees below come with the vendor_jobs exemption
"output/cache" = []
"output/store" = [".npz", ".onnx", ".dll", ".so", ".dylib", ".jsonl"]   # THE result store (not a cache): input hash + producer identity, per stage; compiled C-Script libraries are a stage (D61, D71, D78, D85, D107)
"scratch" = ["*"]
"scratch/*" = ["*"]
