# --- data (D58, D59): curated, small, text data reviewed and frozen in git; large/binary/raw lives in Oracle
"data" = []
"data/cases" = { mirror = "src/product/applications", allow = [], depth = 1, extra = ["verification"] }
# one engineering object = one case (D89, D90); one row per application so verification's closed theory list holds (D108)
"data/cases/electric_machine/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/magnetic_component/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/power_converter/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/drive_unit/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/vehicle/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/power_converter/*/code" = [".c", ".h"]        # controller source (C-Script) archived with the case, hashed into the closure (D111)
"data/cases/drive_unit/*/code" = [".c", ".h"]             # controller source (C-Script) archived with the case (D111)
"data/cases/verification" = { mirror = "src/product/models/governing_equations", allow = [], depth = 1, extra = ["coupled", "signal"] }   # circuits go by physics (D110); structure-acoustic coupling in coupled, pure acoustics in fluid_mechanics (D104)
"data/cases/verification/*/*" = ["case.toml", "evidence.toml", "references.lock", "README.md"]
"data/cases/verification/signal/*/code" = [".c", ".h"]   # control-only problems with C-Script source (D111)
