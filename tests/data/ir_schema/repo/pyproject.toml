# Illustrative consumer declaration: the worked example of docs-src/dev/ir-schema.md.
[build-system]
requires = ["hatchling", "dev-lab"]
build-backend = "hatchling.build"

[project]
name = "sample-pkg"
version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/sample_pkg"]

[tool.hatch.build.hooks.ir-schema]

[tool.dev_lab.ir_schema]
version = "1.0.0"
package = "sample_pkg"
package_dir = "src/sample_pkg"
quantities = "ir/quantities.toml"
migrations = "sample_pkg.ir_migrations"

[tool.dev_lab.ir_schema.modules]
widgets = "ir/widgets.toml"
samples = "ir/samples.toml"
