[project]
name = "dev-lab"
dynamic = ["version"]
description = "The family development system: forge, hooks, gate, verify. Depends on lab-commons."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mingyang Bao" }]
requires-python = ">=3.12"
# dev-lab IS the development system, so what lab-commons shipped as its `dev` extra is this package's base
# install: the lab-commons runtime it is built on (logging, paths, config, units for the duration/quantity
# parsers) plus the tools it DRIVES as executables (pytest, ruff, `cz check` for the base commit-msg hook).
# Floor: lab-commons at the split base 8c401f0 (hatch-vcs 0.3.1.dev992); one bare git URL graph-wide, as the
# consumers spell it, so uv.lock pins its tip -- never a machine-local path.
dependencies = [
    "lab-commons[units,paths,io,structured]>=0.3.1.dev992",
    "pytest",
    # The verify door runs a selection on every core its claim admits (verifybox.selection_workers); without the
    # plugin xdist_installed() answers False and every part ran serially -- this repo's hosted part measured 483 s
    # on Linux and 2740 s on Windows on 4-vCPU runners (2026-11-05). Base, so every consumer's door has it.
    "pytest-xdist",
    # The verify door writes a coverage REPORT on every pytest step (verifysteps.coverage_args); base for the
    # reason pytest-xdist is: every consumer's door runs it. It brings coverage.
    "pytest-cov",
    "ruff",
    # THE FAMILY'S ONE TOML WRITER (user ruling 2026-11-05): dev.dep_observe writes its observations with it;
    # every read is stdlib tomllib.
    "tomlkit",
    # dev.forgeapp signs a GitHub App judge's RS256 JWT: the one maintained RSA, never our own. Base, not the ops
    # extra: the dev layer imports it, and dev never reaches up into an ops extra.
    "cryptography",
]

[project.optional-dependencies]
# THE FAMILY'S ONE JS TEST RUNTIME (dev.jsrun): a pinned Node binary installed from the lock, so a test
# running client JS or the agent-guard engine needs no host Node. Node rather than an embedded engine:
# the code under test uses require/fs/process, DecompressionStream, TextDecoder, atob and timers, which a
# bare QuickJS or V8 isolate does not provide. TEST/DEV ONLY (user ruling 2026-10-28): a consumer takes
# it as `dev-lab[test]` in its dev extra, never in a runtime dependency (famtests.hostnode refuses that).
#
# THE ONE TEST KIT (user ruling 2026-11-05): with the base install (pytest, pytest-xdist, pytest-cov, ruff) this
# extra is the family's complete shared test/dev tool set, so a consumer declares `dev-lab[test]` and nothing
# else of the kind. pytest-timeout: the per-test ceiling every gate relies on; hypothesis: property tests;
# pyright: the type checker; pdoc: dev.docsite builds with it. NOT in it: maturin (a repo's own build tool)
# and pytest-mock (unittest.mock and monkeypatch cover it).
test = [
    "nodejs-wheel-binaries",
    "dev-lab[ops]",
    "pytest-timeout",
    "hypothesis",
    "pyright",
    "pdoc",
]
# A FORGE HOST'S extra (dev_lab.ops): `access enrol` / `consent enrol` draw the otpauth QR on the enrolling
# terminal with segno (pure Python, no dependencies of its own). The test extra carries it so the QR is tested.
ops = ["segno"]

[dependency-groups]
# THE REVIEW METHOD the CI review jobs run (ci_base.toml `method` steps): dev-lab is the code that calls it, so this
# lock names which ai-lab runs. NON-DEFAULT: neither `uv sync`, the door's `uv export`, nor a consumer installs it.
review = ["ai-lab @ git+https://github.com/DawnEver/ai-lab.git"]

# The allocation record's reader, loaded by lab_commons.hpc.allocation.recorded: every submitter reads it.
[project.entry-points."lab_commons.hpc.allocation"]
forge = "dev_lab.dev.forgerecords:read_allocation"

# The HPC account affinity's reader, loaded by lab_commons.hpc.affinity.declared: a research submit yields verify.
[project.entry-points."lab_commons.hpc.affinity"]
forge = "dev_lab.dev.forgeaffinity:research_affinity"

# THE FAMILY ROWS NO REPO CAN DROP (user ruling 2026-11-07): pytest autoloads this wherever dev-lab is
# installed, so NO-CJK-IN-TRACKED-SOURCE runs in every family repo with no consumer file (famtests.alwayson).
[project.entry-points.pytest11]
dev_lab_family = "dev_lab.pytest_family"

[project.urls]
Homepage = "https://github.com/DawnEver/dev-lab"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/dev_lab/__version__.py"
template = "__version__ = version = \"{version}\"\n__version_tuple__ = version_tuple = {version_tuple}\n"

[tool.hatch.build.targets.wheel]
packages = ["src/dev_lab"]

[tool.uv.sources]
# lab-commons follows its integration line on GitHub, its one home.
lab-commons = { git = "https://github.com/DawnEver/lab-commons.git" }

# THE FAMILY PLACEMENT MAP (`dev_lab.dev.codeplace.FAMILY_HOMES`) plus this repo's delta: none.
[tool.dev_lab.placement]
code_roots = []
# A worktree is a real second tree with its own src/, judged by the run inside it.
pruned_paths = ['.claude/worktrees']
# SCRATCH-IS-NEVER-COMMITTED: the one-off sink, and when the SessionStart notice starts naming a one-off.
scratch = 'scratch/'
max_age_days = 3.0

# How the cluster builds this repo's env, read at the commit being judged (lab_commons.hpc.builds).
# It installs the project itself: the venv must import lab_commons.envkey to report its env key.
[tool.lab_commons.hpc]
install = "uv sync --frozen --all-extras"

# The run record's root (dev_lab.dev.platformparts).
[tool.dev_lab.parts]
output = "output/logs"

# One need vocabulary (lab_commons.hpc.needsets): user ruling 2026-11-05, every test completes on a hosted
# runner, so this repo declares no resource and its one part is tests/base. `produce` is the ONE local
# producer of every part ({part} filled); a cluster part runs from [tool.lab_commons.hpc].
[tool.lab_commons.tests]
produce = ["-m", "dev_lab.dev.verify", "--part", "{part}"]

# The tool FLOORS this repo's parts need (D21): `<tool> = {floor = "<version>", reason = "<why>"}`. A
# declaration is a floor with its reason, never a pin (user ruling 2026-10-17); a tool needing no floor --
# node, here -- is not declared, is present at any version whose smoke passes, and its version is recorded.
[tool.lab_commons.tools]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# once every derived tests/<part> of an integration commit stands PASS at scope full.
[tool.dev_lab.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "abc4e5b3ff450b41870ab33df47329ad1cc34c5c"  # INTEGRATION-IS-MERGES-ONLY from here on: the split base (lab-commons 8c401f0 rewritten)
pr_merges_since = "abc4e5b3ff450b41870ab33df47329ad1cc34c5c"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after this sha: the split base

# FORGE-PROTECTION-DECLARED (dev_lab.dev.forgeprotect): the branches above, the contexts derived from the rendered
# workflows, the approver from [tool.dev_lab.review]; declared here only the ONE bypass identity per forge. A GitHub
# ruleset cannot name a user, so on this personal repository break-glass bypasses as the admin role, in pull_request
# mode only (it may merge a PR past the rules, never push). `python -m dev_lab.dev.forge protect plan|check|apply`.
[tool.dev_lab.protection.forges."github.com"]
breakglass = "role:admin"

# This repo's layer over the family hook base (dev_lab/dev/githooks/base.toml); run by
# `python -m dev_lab.dev.githooks run <stage>`, installed by `python -m dev_lab.dev.hook_install --install`.
[[tool.dev_lab.hooks.pre-commit]]
id = "ruff"
run = ["ruff", "check", "--force-exclude"]
files = '\.pyi?$'
pass_files = true

[[tool.dev_lab.hooks.pre-commit]]
id = "ruff-format"
run = ["ruff", "format", "--check", "--force-exclude"]
files = '\.pyi?$'
pass_files = true

# PRIVATE-MARKERS at commit time: an irreversible-harm row -- a pushed marker is public for good, and the forge has
# no denylist to catch it (absent there, the row judges the generic layer only).
[[tool.dev_lab.hooks.pre-commit]]
id = "private-markers"
run = ["python", "-m", "dev_lab.dev.privatemarkers"]
pass_files = true

[[tool.dev_lab.hooks.pre-push]]
id = "pushgate"
run = ["python", "-m", "dev_lab.dev.pushgate", "--trunk-ref", "refs/heads/main"]
always_run = true

[tool.dev_lab.branchset]
# ONE-BRANCH-PER-SESSION: the trunk and the integration branch are the long-lived ones; a lane merges and is deleted.
trunk = 'main'
sessions = ['integrate/main']
# User ruling 2026-10-13 ("origin should not carry this junk"): every serving host (idempotently) deletes
# merged undeclared origin branches idle >= grace_hours (dev_lab.dev.branchprune).
prune_merged = true

[tool.dev_lab.doors]
# This repo's exits, keyed by deny-rule ID. The agent guard runs from whichever project a session
# started in; when a refused command TARGETS this repo (its cwd, `cd X &&`, `git -C X`), the refusal
# names the door declared here instead of the session repo's. <venv python> is .venv/Scripts/python.exe
# on Windows and .venv/bin/python on POSIX -- in a worktree, the main checkout's.
BARE-TEST-INVOCATION = "<venv python> -m dev_lab.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
NETWORK-VERB = "<venv python> -m dev_lab.dev.netverb -- <git push|fetch|pull|clone|ls-remote|submodule update ...  or  uv lock|add|remove ...>  (retries 3x, then reports a diagnosis); an environment change is <venv python> -m dev_lab.dev.dep --sync, which retries inside"

[tool.dev_lab.render]
# What the family renderers read from this repo (dev_lab.dev.famfiles.RENDERERS); a relock re-runs each one due.
deltas = "tests/_famconfig_delta.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "not_applicable: a skip of this test is NOT_APPLICABLE (lab_commons.hpc.pytest_item.judged); any other skip is refused",
]

[tool.ruff]
line-length = 120
# py312 AND NOT py313, against the consumers' identical py313 -- this is the one scalar where the
# kit must differ, and the evidence is `requires-python = ">=3.12"` eleven lines above. This repo
# SHIPS A WHEEL to the family; a py313 target lets the UP group rewrite shipped code into syntax a
# 3.12 interpreter cannot parse, and the 3.12 half of this repo's own declared support would break
# at import rather than at lint. Two of the three consumers ALSO declare `>=3.12` while targeting
# py313, so their scalar is the one that disagrees with its own metadata; only consumer-a
# (`>=3.13,<3.14`) has earned it. This repo's venv is CPython 3.12.14.
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# THE FAMILY'S SELECT, ADOPTED VERBATIM (R1, 2026-09-17). These 58 selectors are byte-identical in
# consumer-b, consumer-c and consumer-a -- pairwise symmetric difference EMPTY, measured by
# `tests/_config_census_rows.py::CONSUMER_SELECT` -- so this is not a negotiation but the family's
# answer, already held three times. Until today this repo selected 12 and was therefore blind to 50
# groups it lints everything it ships to for; `tests/test_the_kit_is_not_linted_less_than_what_it_ships.py`
# now reds if that gap reopens. The four single codes the old 12 carried beyond E W F I UP B SIM RUF
# (ARG001 PLC0415 PLW0603 TRY301) are subsumed by the groups ARG PLC PLW TRY, and none of them is
# ignored below, so nothing this repo enforced yesterday stopped being enforced today.
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DJ", "DTZ", "E", "EM",
    "ERA", "F", "FA", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N",
    "NPY", "PD", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "TRY", "UP", "W", "YTT",
]

# A RATCHET THAT MAY ONLY SHRINK. Every entry states why the rule is wrong FOR THIS REPO, not that
# it was expensive; `test_the_kit_is_not_linted_less_than_what_it_ships.py` pins the set so an
# addition is a deliberate edit to a named constant. Deliberately NOT copied from the consumers:
# their 62-code list carries a 20-code block headed "TODO: remove these", and none of the eight
# codes this repo already enforced (B018 B904 E501 RUF012 RUF043 SIM108 SIM113 UP017) appears here.
ignore = [
    # -- the three the FORMATTER owns; ruff itself documents each as conflicting with `ruff format`,
    # and `quote-style = "single"` above is the decision Q000/Q003 would argue with.
    "COM812",  # missing-trailing-comma -- the formatter adds them; the lint rule fights its output
    "Q000",    # bad-quotes-inline-string -- asserts double quotes against our single-quote format
    "Q003",    # avoidable-escaped-quote -- same axis, and the formatter already picks the cheaper quote
    # -- the two MUTUALLY EXCLUSIVE pairs. Ruff emits a warning and disables one of each pair anyway;
    # naming which half we drop is the difference between a decision and a startup warning.
    "D203",    # incorrect-blank-line-before-class -- we take D211 (no blank line before a class docstring)
    "D213",    # multi-line-summary-second-line -- we take D212 (summary on the first physical line)
    # -- the four where a SHARPER rule already covers the hazard, so dropping these loses nothing.
    #    Each names the rule that keeps the floor; none of them is "the count was high".
    "D400",    # missing-trailing-period -- D415 is KEPT and accepts "?"; five summaries here are
               # QUESTIONS ("Does origin carry this branch at all?"), which is this repo's idiom for
               # a predicate, and D400 would force them into worse statements. D415 still reds a
               # summary with no terminal punctuation at all, which is the floor that mattered.
    "D401",    # non-imperative-mood -- 96 sites, and every one is a NOUN-PHRASE summary naming what
               # the accessor IS ("The stamped line: the five fields, one per token"). D401 wants
               # "Return the stamped line", which adds a verb carrying no information. D205/D415 and
               # the whole D1xx family are kept, so a MISSING or malformed docstring still reds.
    "PLR0913", # too-many-arguments -- counts KEYWORD-ONLY parameters, i.e. a declared configuration
               # surface, not a call-site hazard. PLR0917 (too-many-POSITIONAL-arguments) is the
               # honest half, it is SELECTED, and it is at zero: `MultiProcessing.__init__` was made
               # keyword-only in this same pass rather than waived.
    "S603",    # subprocess-without-shell-equals-true -- fires on EVERY subprocess call whose argv is
               # not a literal, which in a repo whose job is driving git, uv, ruff and pre-commit is
               # every call it has. It carries no per-site information, so it cannot be acted on.
               # S607 is NOT waived: its one site carries a `# noqa` naming why PATH resolution is
               # deliberate there.
    # -- ONE DEBT, NOT A JUDGEMENT, and it is labelled as such so it is not read as settled.
    "N818",    # error-suffix-on-exception-name -- 16 classes (2026-09-17). This is the kit's PUBLIC
               # exception surface; seven of the sixteen are re-exported through
               # `dev_lab.dev.__init__`, so the rename is a cross-file, cross-repo move and
               # belongs to the stage that re-points the consumers (R4), not to a lint pass. The
               # count above is the ceiling: this entry is expected to DISAPPEAR, not to be explained
               # again.
]

# Per-file ignores are a statement about a TREE'S JOB, not a second ignore list. Each line names the
# property of `tests/` that makes the rule inapplicable there and would be false of `src/`.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",  # a test's parameters are pytest FIXTURES; the type is declared ONCE on the fixture and
               # repeating it at 275 request sites is a copy that can drift. ANN2xx is NOT waived, so
               # every fixture and helper still declares what it RETURNS -- which is where the type is.
    "ARG002",  # a test may request a fixture for its SIDE EFFECT (a seat taken, an env var set); the
               # unused parameter IS the request, and removing it removes the setup
    "D101",    # a test class is a NAMED GROUPING; its name and its methods' docstrings are the prose
    "D102",    # ditto for a test method, whose name is already a sentence in this suite
    "D103",    # ditto for a module-level test function
    "INP001",  # tests/ is rootdir-relative by design and has no __init__.py -- adding one shadows src/
    "N802",    # this suite SHOUTS the load-bearing word in a test name
               # (`test_a_transient_that_never_clears_STOPS_at_the_bound`), 64 times. Lower-casing them
               # deletes the emphasis, which is information the name is carrying on purpose.
    "PLR2004", # a literal in an assertion IS the expected value; hoisting it to a constant hides it
    "S101",    # assert IS the test vocabulary; src/ carries this rule unwaived
    "SLF001",  # a test that cannot read a private member cannot pin a private invariant
]

# THIS REPO'S CI: the family base (dev_lab/dev/ci_base.toml) as is -- every repo renders its forge's whole
# base with `python -m dev_lab.dev.ciworkflows render`; this repo declares no [tool.dev_lab.ci] layer.

# Who reviews this repo's PRs: the family's isolated judge host (user ruling 2026-11-10), gated on GitHub by the
# family App's review/judge check run. Keys and defaults: dev_lab.dev.forgereview_declared.
[tool.dev_lab.review]
where = "judge"
judge_app = 5619495

# The bundle prepare the judge reads, on THIS forge (the base places it on Gitea unless a repo names GitHub).
[tool.dev_lab.ci."review-prepare.yml"]
forge = "github"
