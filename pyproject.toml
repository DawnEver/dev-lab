[project]
name = "lab-commons"
dynamic = ["version"]
description = "Project-agnostic shared infrastructure (logging, paths) for the consumer-a/consumer-c/consumer-b family of labs."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mingyang Bao" }]
requires-python = ">=3.12"
# The base install is the standard library; every capability that needs a package is an extra.
dependencies = []

[project.urls]
Homepage = "https://github.com/DawnEver/lab-commons"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lab_commons/__version__.py"
template = "__version__ = version = \"{version}\"\n__version_tuple__ = version_tuple = {version_tuple}\n"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_commons"]

[project.optional-dependencies]
# Each defining module has an explicit installation capability, not a root facade.
units = ["numpy", "pint>=0.25.2", "pydantic>=2"]
paths = ["platformdirs"]
io = ["rtoml"]
structured = ["structlog", "colorama; sys_platform == 'win32'"]

# THE GATE FOR ``lab_commons.dev``. That subpackage is opt-in exactly as ``lab_commons.em`` is --
# the top level does not import it, and `tests/test_dev_gate.py` pins that against a fresh
# interpreter -- and the extra below is what a consumer installs to opt in. It names the tools the
# dev layer DRIVES (pytest and ruff, as executables rather than as imports); the layer itself needs
# no new dependency, which the same test proves by reading its import statements. A consumer that
# wants only logging installs nothing heavier than the tier-1 list above.
dev = [
    "lab-commons[units,paths,io,structured]",
    "pytest",
    "pytest-mock",
    "ruff",
    # `cz check` is the base commit-msg hook (`lab_commons/dev/githooks/base.toml`), run in this venv
    # like every hook -- DRIVEN as an executable, exactly as pytest and ruff are.
    "commitizen",
]

# THE TWO GATES FOR ``lab_commons.viz``, AND THERE ARE TWO ON PURPOSE. The plotting vocabulary
# (`lab_commons.viz` itself) imports NO plotting library: a producer declares the figure it wants and
# installs nothing. Drawing it is an ADAPTER, one module per library, and each adapter's library is
# its own extra -- so a consumer takes the backend it wants and does not inherit the other's. The
# layer is equal-peer by construction rather than by intent, and `tests/test_viz_gate.py` pins both
# halves: that importing `lab_commons` pulls neither in, and that each adapter imports exactly the
# library its own extra names.
# The viz VOCABULARY is NumPy data, so it is its own extra; each backend extra names only its library.
viz = ["numpy"]
viz-mpl = [
    # 3.5 is where `matplotlib.colormaps` -- the registry the layer's palette-name check reads --
    # landed. Nothing below it is claimed, and no ceiling is stated: an upper bound here would be a
    # resolver constraint inherited by every consumer that wants a plot.
    "matplotlib>=3.5",
]
viz-bokeh = [
    # 3.0 is where a figure's title became a model with text rather than a string, and where the
    # palette registry this layer checks its colormap names against is the shape it reads. The
    # adapter is written against that API and says so here instead of failing at the first figure.
    "bokeh>=3",
]

# THE FAMILY PLACEMENT MAP (`lab_commons.dev.codeplace.FAMILY_HOMES`) plus this repo's delta: none.
[tool.lab_commons.placement]
code_roots = []
# A worktree is a real second tree with its own src/, judged by the run inside it.
pruned_paths = ['.claude/worktrees']

# How the cluster builds this repo's env, read at the commit being judged (lab_commons.hpc.builds).
# It installs the project itself: the venv must import lab_commons.dev.envkey to report its env key.
[tool.lab_commons.hpc]
install = "uv sync --frozen --all-extras"

# The run record's root (lab_commons.dev.platformparts).
[tool.lab_commons.parts]
output = "output/logs"

# One need vocabulary (lab_commons.hpc.needsets): a test marks the resources it needs, and its part is its
# need-set -- tests/base, tests/codex, tests/dev_checkout, tests/node, tests/dev_checkout+node. A host claims a part when
# its machine file's [capabilities.<name>] (and the probe, for node) give it every one; the cluster's per-sha
# tree has neither. `produce` is the ONE local producer of every part ({part} filled); a cluster part runs
# from [tool.lab_commons.hpc].
[tool.lab_commons.tests]
resources = ["codex", "dev_checkout", "node"]
produce = ["-m", "lab_commons.dev.verify", "--part", "{part}"]

# The tool FLOORS this repo's parts need (D21): `<tool> = {floor = "<version>", reason = "<why>"}`. A
# declaration is a floor with its reason, never a pin (user ruling 2026-10-17); a tool needing no floor --
# node, here -- is not declared, is present at any version whose smoke passes, and its version is recorded.
[tool.lab_commons.tools]

# The family branch flow: integrate/main coordinates; main moves only by `integrate promote` (fast-forward)
# once every derived tests/<part> of an integration commit stands PASS at scope full.
[tool.lab_commons.integrator]
trunk = "main"
integration = "integrate/main"
merges_only_since = "c6ba73b78d56f7e0c3a4e95d208e752b9047bdf4"  # INTEGRATION-IS-MERGES-ONLY from here on
pr_merges_since = "b97d2aa2871e09630863620bda713de750374ccb"  # INTEGRATION-TAKES-ONLY-FORGE-MERGES after this sha

# This repo's layer over the family hook base (lab_commons/dev/githooks/base.toml); run by
# `python -m lab_commons.dev.githooks run <stage>`, installed by `python -m lab_commons.dev.hook_install --install`.
[[tool.lab_commons.hooks.pre-commit]]
id = "ruff"
run = ["ruff", "check", "--force-exclude"]
files = '\.pyi?$'
pass_files = true

[[tool.lab_commons.hooks.pre-commit]]
id = "ruff-format"
run = ["ruff", "format", "--check", "--force-exclude"]
files = '\.pyi?$'
pass_files = true

[[tool.lab_commons.hooks.pre-push]]
id = "pushgate"
run = ["python", "-m", "lab_commons.dev.pushgate", "--trunk-ref", "refs/heads/main"]
always_run = true

[tool.lab_commons.branchset]
# ONE-BRANCH-PER-SESSION: the trunk and the integration branch are the long-lived ones; a lane merges and is deleted.
trunk = 'main'
sessions = ['integrate/main']
# Short-lived PR heads (user ruling 2026-10-19): pushable with no row, deleted by the forge once their PR is gone.
ephemeral = ['pr/*']
# User ruling 2026-10-13 ("origin should not carry this junk"): every serving host (idempotently) deletes
# merged undeclared origin branches idle >= grace_hours (lab_commons.dev.branchprune).
prune_merged = true

[tool.lab_commons.doors]
# This repo's exits, keyed by deny-rule ID. The agent guard runs from whichever project a session
# started in; when a refused command TARGETS this repo (its cwd, `cd X &&`, `git -C X`), the refusal
# names the door declared here instead of the session repo's. <venv python> is .venv/Scripts/python.exe
# on Windows and .venv/bin/python on POSIX -- in a worktree, the main checkout's.
BARE-TEST-INVOCATION = "<venv python> -m lab_commons.dev.verify -- <paths>  (the measure door; a full run is the forge producer's; a hand-written pytest line has none)"
PUSH-NO-VERIFY = "push without skipping the hook; no hook runs a test, and the forge produces the part"
GIT-NETWORK-VERB = "<venv python> -m lab_commons.dev.netverb -- git <push|fetch|pull|clone|ls-remote> ...  (retries 3x, then reports a diagnosis)"
OUTPUT-REDIRECT-IS-DATED = "<command> > output/logs/<yy>/<mm>/<dd>/<kind>/<name> 2>&1  (create the day's <kind> directory first; the shape is lab_commons.dev.datedlog's)"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "codex: drives the real Codex execpolicy engine through the `codex` CLI, which only a host providing it carries",
    "dev_checkout: asserts a developer-checkout invariant (hooks installed, branches on origin, worktree placement)",
    "node: drives the agent-guard engine through a real `node`, which the cluster's compute nodes do not carry",
    "not_applicable: a skip of this test is NOT_APPLICABLE (lab_commons.hpc.pytest_item.judged); any other skip is refused",
]

[tool.ruff]
line-length = 120
# py312 AND NOT py313, against the consumers' identical py313 -- this is the one scalar where the
# kit must differ, and the evidence is `requires-python = ">=3.12"` eleven lines above. This repo
# SHIPS A WHEEL to the family; a py313 target lets the UP group rewrite shipped code into syntax a
# 3.12 interpreter cannot parse, and the 3.12 half of this repo's own declared support would break
# at import rather than at lint. Two of the three consumers ALSO declare `>=3.12` while targeting
# py313, so their scalar is the one that disagrees with its own metadata; only consumer-a
# (`>=3.13,<3.14`) has earned it. This repo's venv is CPython 3.12.14.
target-version = "py312"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
# THE FAMILY'S SELECT, ADOPTED VERBATIM (R1, 2026-09-17). These 58 selectors are byte-identical in
# consumer-b, consumer-c and consumer-a -- pairwise symmetric difference EMPTY, measured by
# `tests/_config_census_rows.py::CONSUMER_SELECT` -- so this is not a negotiation but the family's
# answer, already held three times. Until today this repo selected 12 and was therefore blind to 50
# groups it lints everything it ships to for; `tests/test_the_kit_is_not_linted_less_than_what_it_ships.py`
# now reds if that gap reopens. The four single codes the old 12 carried beyond E W F I UP B SIM RUF
# (ARG001 PLC0415 PLW0603 TRY301) are subsumed by the groups ARG PLC PLW TRY, and none of them is
# ignored below, so nothing this repo enforced yesterday stopped being enforced today.
select = [
    "A", "AIR", "ANN", "ARG", "ASYNC", "B", "BLE", "C4", "C90", "COM", "D", "DJ", "DTZ", "E", "EM",
    "ERA", "F", "FA", "FBT", "FIX", "FLY", "FURB", "G", "I", "ICN", "INP", "INT", "ISC", "LOG", "N",
    "NPY", "PD", "PERF", "PGH", "PIE", "PLC", "PLE", "PLR", "PLW", "PT", "PTH", "PYI", "Q", "RET",
    "RSE", "RUF", "S", "SIM", "SLF", "SLOT", "T10", "T20", "TD", "TID", "TRY", "UP", "W", "YTT",
]

# A RATCHET THAT MAY ONLY SHRINK. Every entry states why the rule is wrong FOR THIS REPO, not that
# it was expensive; `test_the_kit_is_not_linted_less_than_what_it_ships.py` pins the set so an
# addition is a deliberate edit to a named constant. Deliberately NOT copied from the consumers:
# their 62-code list carries a 20-code block headed "TODO: remove these", and none of the eight
# codes this repo already enforced (B018 B904 E501 RUF012 RUF043 SIM108 SIM113 UP017) appears here.
ignore = [
    # -- the three the FORMATTER owns; ruff itself documents each as conflicting with `ruff format`,
    # and `quote-style = "single"` above is the decision Q000/Q003 would argue with.
    "COM812",  # missing-trailing-comma -- the formatter adds them; the lint rule fights its output
    "Q000",    # bad-quotes-inline-string -- asserts double quotes against our single-quote format
    "Q003",    # avoidable-escaped-quote -- same axis, and the formatter already picks the cheaper quote
    # -- the two MUTUALLY EXCLUSIVE pairs. Ruff emits a warning and disables one of each pair anyway;
    # naming which half we drop is the difference between a decision and a startup warning.
    "D203",    # incorrect-blank-line-before-class -- we take D211 (no blank line before a class docstring)
    "D213",    # multi-line-summary-second-line -- we take D212 (summary on the first physical line)
    # -- the four where a SHARPER rule already covers the hazard, so dropping these loses nothing.
    #    Each names the rule that keeps the floor; none of them is "the count was high".
    "D400",    # missing-trailing-period -- D415 is KEPT and accepts "?"; five summaries here are
               # QUESTIONS ("Does origin carry this branch at all?"), which is this repo's idiom for
               # a predicate, and D400 would force them into worse statements. D415 still reds a
               # summary with no terminal punctuation at all, which is the floor that mattered.
    "D401",    # non-imperative-mood -- 96 sites, and every one is a NOUN-PHRASE summary naming what
               # the accessor IS ("The stamped line: the five fields, one per token"). D401 wants
               # "Return the stamped line", which adds a verb carrying no information. D205/D415 and
               # the whole D1xx family are kept, so a MISSING or malformed docstring still reds.
    "PLR0913", # too-many-arguments -- counts KEYWORD-ONLY parameters, i.e. a declared configuration
               # surface, not a call-site hazard. PLR0917 (too-many-POSITIONAL-arguments) is the
               # honest half, it is SELECTED, and it is at zero: `MultiProcessing.__init__` was made
               # keyword-only in this same pass rather than waived.
    "S603",    # subprocess-without-shell-equals-true -- fires on EVERY subprocess call whose argv is
               # not a literal, which in a repo whose job is driving git, uv, ruff and pre-commit is
               # every call it has. It carries no per-site information, so it cannot be acted on.
               # S607 is NOT waived: its one site carries a `# noqa` naming why PATH resolution is
               # deliberate there.
    # -- ONE DEBT, NOT A JUDGEMENT, and it is labelled as such so it is not read as settled.
    "N818",    # error-suffix-on-exception-name -- 16 classes (2026-09-17). This is the kit's PUBLIC
               # exception surface; seven of the sixteen are re-exported through
               # `lab_commons.dev.__init__`, so the rename is a cross-file, cross-repo move and
               # belongs to the stage that re-points the consumers (R4), not to a lint pass. The
               # count above is the ceiling: this entry is expected to DISAPPEAR, not to be explained
               # again.
]

# Per-file ignores are a statement about a TREE'S JOB, not a second ignore list. Each line names the
# property of `tests/` that makes the rule inapplicable there and would be false of `src/`.
[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN001",  # a test's parameters are pytest FIXTURES; the type is declared ONCE on the fixture and
               # repeating it at 275 request sites is a copy that can drift. ANN2xx is NOT waived, so
               # every fixture and helper still declares what it RETURNS -- which is where the type is.
    "ARG002",  # a test may request a fixture for its SIDE EFFECT (a seat taken, an env var set); the
               # unused parameter IS the request, and removing it removes the setup
    "D101",    # a test class is a NAMED GROUPING; its name and its methods' docstrings are the prose
    "D102",    # ditto for a test method, whose name is already a sentence in this suite
    "D103",    # ditto for a module-level test function
    "INP001",  # tests/ is rootdir-relative by design and has no __init__.py -- adding one shadows src/
    "N802",    # this suite SHOUTS the load-bearing word in a test name
               # (`test_a_transient_that_never_clears_STOPS_at_the_bound`), 64 times. Lower-casing them
               # deletes the emphasis, which is information the name is carrying on purpose.
    "PLR2004", # a literal in an assertion IS the expected value; hoisting it to a constant hides it
    "S101",    # assert IS the test vocabulary; src/ carries this rule unwaived
    "SLF001",  # a test that cannot read a private member cannot pin a private invariant
]

# THIS REPO'S CI, as TOML: rendered to .github/workflows/ by `python -m lab_commons.dev.ciworkflows render`
# (the family base is lab_commons/dev/ci_base.toml). ci.yml is the base caller, pointed at the reusable
# workflow beside it; python-verify.yml is THE family CI definition, which every repo's ci.yml calls.
[tool.lab_commons.ci."ci.yml".jobs.verify]
uses = "./.github/workflows/python-verify.yml"

[tool.lab_commons.ci."ci.yml".jobs.verify.with]
runner-os = '["ubuntu-latest", "windows-latest", "macos-latest"]'
extras = "dev viz-mpl viz-bokeh"
guard-targets = "adoption"

[tool.lab_commons.ci."python-verify.yml"]
name = "Python verify (reusable)"

[tool.lab_commons.ci."python-verify.yml".on.workflow_call.inputs.python-versions]
description = "JSON array of Python versions to run the matrix over."
required = false
default = "[\"3.12\", \"3.13\"]"
type = "string"

[tool.lab_commons.ci."python-verify.yml".on.workflow_call.inputs.runner-os]
description = '''JSON array of GitHub-hosted runner labels to run the verify matrix over. Crossed with `python-versions`, so the job count is the PRODUCT -- the default is 3 x 2 = 6 legs.
THE DEFAULT IS THE WHOLE SET, AND THAT IS THE COVERAGE GUARD. This family develops on Windows, shipped a CI that ran only Ubuntu, and claims macOS support; a coverage claim that silently shrinks is its named defect. An opt-IN axis reproduces that exactly -- the callers that never pass it stay on one platform and nothing says so. Defaulting to the full set inverts it: narrowing becomes an explicit JSON array in the CALLER's workflow, which is a line in a diff a reviewer reads. No test can assert that a platform actually ran; a default that must be typed over to shrink is the strongest guard this file holds.
COST, MEASURED 2026-09-19: both consuming repositories (DawnEver/lab-commons, DawnEver/consumer-c) answer the UNAUTHENTICATED GitHub API with 200, so both are PUBLIC and GitHub-hosted minutes on all three platforms are FREE -- the 2x Windows and 10x macOS multipliers apply to PRIVATE repositories only and are not being paid here. The real budget is WALL CLOCK, and the legs run in parallel, so 6 legs cost the slowest one rather than the sum. Should either repo go private, THIS is the input to narrow, and the trade to weigh then is the full python matrix on one OS plus a single python on the others (4 legs) -- a saving bought only by giving up coverage that is currently free.
'''
required = false
default = "[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]"
type = "string"

[tool.lab_commons.ci."python-verify.yml".on.workflow_call.inputs.extras]
description = "Space-separated optional-dependency extras to sync (each becomes --extra X)."
required = false
default = "dev"
type = "string"

[tool.lab_commons.ci."python-verify.yml".on.workflow_call.inputs.guard-targets]
description = '''Space-separated `make` targets run as their OWN named steps after `verify`, so that a named architectural guard is legible from the job list instead of buried in a pytest summary. Each is already inside `verify`; re-running one is cheap and the point is the label. Every target must exist in the caller's Makefile.
'''
required = false
default = ""
type = "string"

[tool.lab_commons.ci."python-verify.yml".on.workflow_call.inputs.report-failures]
description = '''File / update / close a tracking issue in the CALLING repository. Requires the caller to grant `issues: write` -- a reusable workflow can never widen the permissions it was given, so if the caller forgets, this silently cannot file and the mechanism reads as working while doing nothing. Leave it on and grant the permission.
'''
required = false
default = true
type = "boolean"

[tool.lab_commons.ci."python-verify.yml".jobs.verify]
runs-on = "${{ matrix.os }}"

[tool.lab_commons.ci."python-verify.yml".jobs.verify.strategy]
fail-fast = false

[tool.lab_commons.ci."python-verify.yml".jobs.verify.strategy.matrix]
os = "${{ fromJSON(inputs.runner-os) }}"
python-version = "${{ fromJSON(inputs.python-versions) }}"

[tool.lab_commons.ci."python-verify.yml".jobs.verify.defaults.run]
shell = "bash"

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
uses = "actions/checkout@v4"

[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps.with]
fetch-depth = 0

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
name = "Install uv"
uses = "astral-sh/setup-uv@v5"

[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps.with]
enable-cache = true

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
name = "Sync the environment"
run = '''extra_flags=""
for extra in ${{ inputs.extras }}; do
  extra_flags="$extra_flags --extra $extra"
done
uv sync --python ${{ matrix.python-version }} $extra_flags
'''

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
name = "Install the declared git hooks"
run = '''
uv run --no-sync python -m lab_commons.dev.hook_install --install
'''

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
name = "make verify"
run = '''
uv run --no-sync make verify
'''

[[tool.lab_commons.ci."python-verify.yml".jobs.verify.steps]]
name = "Named guards"
if = "inputs.guard-targets != ''"
run = '''for target in ${{ inputs.guard-targets }}; do
  echo "::group::make $target"
  uv run --no-sync make "$target"
  echo "::endgroup::"
done
'''

[tool.lab_commons.ci."python-verify.yml".jobs.report]
needs = "verify"
if = "${{ always() && inputs.report-failures && github.event_name == 'push' }}"
runs-on = "ubuntu-latest"

[tool.lab_commons.ci."python-verify.yml".jobs.report.permissions]
contents = "read"
issues = "write"

[[tool.lab_commons.ci."python-verify.yml".jobs.report.steps]]
uses = "actions/github-script@v7"

[tool.lab_commons.ci."python-verify.yml".jobs.report.steps.with]
script = '''// `github.repository` and GITHUB_TOKEN resolve to the CALLER's repository: a reusable
// workflow runs in the caller's context, so consumer-c's red opens an issue in
// consumer-c, not here.
const {owner, repo} = context.repo;
const branch = context.ref.replace('refs/heads/', '');
const title = `CI failing on ${branch}`;
const label = 'ci-failure';
const runUrl =
  `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
const failed = '${{ needs.verify.result }}' !== 'success';

// THE LABEL MUST EXIST BEFORE IT IS APPLIED, and this is not defensive noise -- it
// is the one link in this chain that had never been exercised. MEASURED 2026-09-16:
// neither caller repository has a `ci-failure` label, because no build has gone red
// since this job was written, so the first red would have been the first time the
// `labels: [label]` below was ever evaluated. Whether the REST API auto-creates a
// missing label on issue creation is a detail to look up, not to assume, and the cost
// of assuming wrong is precisely the failure this job exists to prevent: a
// notification that never arrives while the mechanism reads as working. Created
// explicitly, tolerating the 422 that means somebody already made it.
try {
  await github.rest.issues.createLabel({
    owner, repo, name: label, color: 'b60205',
    description: 'Opened, updated and closed by CI itself. See .github/workflows.',
  });
} catch (error) {
  if (error.status !== 422) throw error;   // 422 = already_exists, which is the goal
}

// The STABLE KEY is the exact title. Matching on it is what makes this
// create-or-update rather than create-every-time. A label filter that matches nothing
// returns an empty list rather than a 404, so a first run finds no existing issue and
// creates one, which is the intended path.
const open = await github.paginate(github.rest.issues.listForRepo, {
  owner, repo, state: 'open', labels: label, per_page: 100,
});
const existing = open.find((issue) => issue.title === title);

const body = [
  `\`${{ needs.verify.result }}\` on \`${branch}\`.`,
  '',
  `* run: ${runUrl}`,
  `* commit: \`${context.sha}\``,
  `* failing job: \`verify\` (see the run for which matrix leg)`,
  '',
  'This issue is opened, updated and CLOSED by CI itself. Closing it by hand does not',
  'fix anything; the next green run on this branch closes it.',
].join('\n');

if (failed) {
  if (existing) {
    await github.rest.issues.createComment({
      owner, repo, issue_number: existing.number, body,
    });
  } else {
    await github.rest.issues.create({
      owner, repo, title, body, labels: [label],
    });
  }
} else if (existing) {
  await github.rest.issues.createComment({
    owner, repo, issue_number: existing.number,
    body: `Green again on \`${context.sha}\`. ${runUrl}`,
  });
  await github.rest.issues.update({
    owner, repo, issue_number: existing.number, state: 'closed',
  });
}
'''
