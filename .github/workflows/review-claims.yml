# Rendered by dev_lab.dev.ciworkflows from TOML (dev_lab/dev/ci_base.toml + [tool.dev_lab.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m dev_lab.dev.ciworkflows render`.
{
  "name": "Review claims",
  "on": {
    "issue_comment": {
      "types": [
        "created",
        "edited"
      ]
    }
  },
  "concurrency": {
    "group": "claims-${{ github.event.issue.number }}",
    "cancel-in-progress": false
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "HEAD_SHA": "${{ github.sha }}",
    "FAMILY_SOURCE": "${{ github.server_url }}/${{ github.repository_owner }}/",
    "GITHUB_TOKEN": "${{ github.token }}"
  },
  "jobs": {
    "adjudicate": {
      "if": "${{ contains(github.event.comment.body, '<!-- lab-commons:review-claim:') }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "name": "Install the review method",
          "run": "cd \"$RUNNER_TEMP\"\nexport GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=\"http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader\" GIT_CONFIG_VALUE_0=\"Authorization: basic $(printf 'x-access-token:%s' \"${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}\" | base64 -w0)\"\npython3 -I -m venv \"$RUNNER_TEMP/ai-lab\" && \"$RUNNER_TEMP/ai-lab/bin/python\" -I -m pip install -q uv\n\"$RUNNER_TEMP/ai-lab/bin/uv\" pip install --no-config --python \"$RUNNER_TEMP/ai-lab/bin/python\" \"ai_lab @ git+${FAMILY_SOURCE}ai-lab.git@$AI_LAB_REF\"\n",
          "env": {
            "AI_LAB_REF": "ad0a0ace14846f633d4a42f153948062ce0b4164",
            "FAMILY_READ_TOKEN": "${{ secrets.FAMILY_READ_TOKEN }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Store the review key",
          "run": "if [ -n \"$ANTHROPIC_API_KEY\" ]; then git config --global credential.helper 'cache --timeout=1800' && printf '%s\\n' \"$ANTHROPIC_API_KEY\" | \"$RUNNER_TEMP/ai-lab/bin/python\" -I -m ai_lab.auth login anthropic --task pr-review; fi",
          "env": {
            "ANTHROPIC_API_KEY": "${{ secrets.ANTHROPIC_API_KEY }}"
          }
        },
        {
          "name": "Adjudicate the claims",
          "run": "trap \"git credential-cache exit\" EXIT; uv run --no-sync python -m dev_lab.dev.forge review adjudicate ${{ github.event.issue.number }} --runtime \"ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python\""
        }
      ],
      "permissions": {
        "contents": "read",
        "statuses": "write",
        "pull-requests": "write",
        "issues": "write"
      }
    }
  }
}
