# Rendered by dev_lab.dev.ciworkflows from TOML (dev_lab/dev/ci_base.toml + [tool.dev_lab.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m dev_lab.dev.ciworkflows render`.
{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "integrate/main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "ci-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "permissions": {
    "contents": "read"
  },
  "env": {
    "HEAD_SHA": "${{ github.event.pull_request.head.sha || github.sha }}",
    "FAMILY_SOURCE": "${{ github.server_url }}/${{ github.repository_owner }}/"
  },
  "jobs": {
    "parts": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "id": "matrix",
          "name": "The parts and their runners",
          "run": "echo \"matrix=$(uv run --no-sync python -m dev_lab.dev.jobparts matrix --runners hosted --event ${{ github.event_name }})\" >> \"$GITHUB_OUTPUT\""
        }
      ],
      "outputs": {
        "matrix": "${{ steps.matrix.outputs.matrix }}"
      }
    },
    "part": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "needs": "parts",
      "name": "tests/${{ matrix.part }}",
      "runs-on": "${{ matrix.runs-on }}",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "name": "Produce and post the part",
          "run": "uv run --no-sync python -m dev_lab.dev.jobparts produce ${{ matrix.part }}"
        }
      ],
      "permissions": {
        "contents": "write",
        "statuses": "write"
      },
      "strategy": {
        "fail-fast": false,
        "matrix": "${{ fromJSON(needs.parts.outputs.matrix) }}"
      }
    },
    "absent-parts": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "needs": [
        "parts",
        "part"
      ],
      "if": "${{ always() && needs.parts.result == 'success' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "name": "Post every part no job settled",
          "run": "uv run --no-sync python -m dev_lab.dev.jobparts absent \"$HEAD_SHA\" --event ${{ github.event_name }}"
        }
      ],
      "permissions": {
        "contents": "read",
        "statuses": "write"
      }
    },
    "security": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "if": "${{ github.event_name == 'pull_request' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "name": "tests/security",
          "run": "uv run --no-sync python -m dev_lab.dev.forge security run --pr ${{ github.event.pull_request.number }}"
        }
      ],
      "permissions": {
        "contents": "read",
        "statuses": "write",
        "pull-requests": "read"
      }
    },
    "review": {
      "if": "${{ github.event_name == 'pull_request' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": false
          }
        },
        {
          "name": "Install the review door",
          "run": "cd \"$RUNNER_TEMP\"\nexport GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=\"http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader\" GIT_CONFIG_VALUE_0=\"Authorization: basic $(printf 'x-access-token:%s' \"${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}\" | base64 -w0)\"\ngit clone -q --no-tags --filter=blob:none --no-checkout \"${FAMILY_SOURCE}dev-lab.git\" \"$RUNNER_TEMP/dev-lab\"\ngit -C \"$RUNNER_TEMP/dev-lab\" fetch -q --no-tags origin \"$DEV_LAB_REF\"\ngit -C \"$RUNNER_TEMP/dev-lab\" checkout -q --detach \"$DEV_LAB_REF\"\npython3 -I -m venv \"$RUNNER_TEMP/review\" && \"$RUNNER_TEMP/review/bin/python\" -I -m pip install -q uv\n\"$RUNNER_TEMP/review/bin/uv\" export --no-config --project \"$RUNNER_TEMP/dev-lab\" --frozen --no-hashes --no-header --no-annotate --no-emit-project > \"$RUNNER_TEMP/review.txt\"\n\"$RUNNER_TEMP/review/bin/uv\" pip install --no-config --python \"$RUNNER_TEMP/review/bin/python\" -r \"$RUNNER_TEMP/review.txt\"\n\"$RUNNER_TEMP/review/bin/uv\" pip install --no-config --python \"$RUNNER_TEMP/review/bin/python\" --no-deps \"$RUNNER_TEMP/dev-lab\"\necho \"REVIEW_PYTHON=$RUNNER_TEMP/review/bin/python\" >> \"$GITHUB_ENV\"\n",
          "env": {
            "DEV_LAB_REF": "7a85bd13888cecf6ac65f3f5233942c7256efd5a",
            "FAMILY_READ_TOKEN": "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Install the review method",
          "run": "cd \"$RUNNER_TEMP\"\nexport GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=\"http.${FORGE_URL:-$GITHUB_SERVER_URL}/.extraHeader\" GIT_CONFIG_VALUE_0=\"Authorization: basic $(printf 'x-access-token:%s' \"${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}\" | base64 -w0)\"\npython3 -I -m venv \"$RUNNER_TEMP/ai-lab\" && \"$RUNNER_TEMP/ai-lab/bin/python\" -I -m pip install -q uv\n\"$RUNNER_TEMP/ai-lab/bin/uv\" pip install --no-config --python \"$RUNNER_TEMP/ai-lab/bin/python\" \"ai_lab @ git+${FAMILY_SOURCE}ai-lab.git@$AI_LAB_REF\"\n",
          "env": {
            "AI_LAB_REF": "3f8c7c5b25188b40673602682ce9df61157a16f6",
            "FAMILY_READ_TOKEN": "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "Store the review key",
          "run": "if [ -n \"$ANTHROPIC_API_KEY\" ]; then git config --global credential.helper \"cache --timeout=1800 --socket=$RUNNER_TEMP/git-credential-cache/socket\" && printf '%s\\n' \"$ANTHROPIC_API_KEY\" | \"$RUNNER_TEMP/ai-lab/bin/python\" -I -m ai_lab.auth login anthropic --task pr-review; fi",
          "env": {
            "ANTHROPIC_API_KEY": "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY || '' }}"
          }
        },
        {
          "name": "Hand the forge tokens to the door",
          "run": "umask 077\nmkdir -p \"$RUNNER_TEMP/forge-secrets\"\nprintf '%s' \"${FAMILY_READ_TOKEN:-$GITHUB_TOKEN}\" > \"$RUNNER_TEMP/forge-secrets/read\"\nprintf '%s' \"$GITHUB_TOKEN\" > \"$RUNNER_TEMP/forge-secrets/api\"\n",
          "env": {
            "FAMILY_READ_TOKEN": "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.FAMILY_READ_TOKEN || '' }}",
            "GITHUB_TOKEN": "${{ github.token }}"
          }
        },
        {
          "name": "tests/review",
          "run": "trap 'git credential-cache --socket=$RUNNER_TEMP/git-credential-cache/socket exit; rm -rf \"$RUNNER_TEMP/forge-secrets\"' EXIT\n\"$REVIEW_PYTHON\" -I -m dev_lab.dev.forge review run --pr ${{ github.event.pull_request.number }} --secret-env ANTHROPIC_API_KEY --git-token-file \"$RUNNER_TEMP/forge-secrets/read\" --api-token-file \"$RUNNER_TEMP/forge-secrets/api\" --runtime \"ai_lab.python=$RUNNER_TEMP/ai-lab/bin/python\"\n",
          "env": {
            "ANTHROPIC_API_KEY": "${{ (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && secrets.ANTHROPIC_API_KEY || '' }}"
          }
        }
      ],
      "permissions": {
        "contents": "read",
        "statuses": "write",
        "pull-requests": "write",
        "issues": "write"
      }
    },
    "merge-ready": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "needs": [
        "security",
        "review"
      ],
      "if": "${{ always() && github.event_name == 'pull_request' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "id": "ready",
          "name": "tests/merge-ready",
          "run": "said=\"$(uv run --no-sync python -m dev_lab.dev.forge merge ready --pr ${{ github.event.pull_request.number }})\"; echo \"$said\"; case \"$said\" in *\"; merged\") echo \"merged=true\" >> \"$GITHUB_OUTPUT\" ;; esac"
        },
        {
          "name": "Run CI on the merged integration",
          "if": "${{ steps.ready.outputs.merged == 'true' }}",
          "run": "gh workflow run ci.yml --repo \"$GITHUB_REPOSITORY\" --ref integrate/main",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          }
        }
      ],
      "permissions": {
        "contents": "write",
        "statuses": "write",
        "pull-requests": "write",
        "actions": "write"
      }
    },
    "promote": {
      "env": {
        "GITHUB_TOKEN": "${{ github.token }}"
      },
      "needs": [
        "absent-parts"
      ],
      "if": "${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/integrate/main' }}",
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "ref": "${{ env.HEAD_SHA }}",
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "uv sync --frozen --all-extras"
        },
        {
          "name": "Promote main",
          "run": "uv run --no-sync python -m dev_lab.dev.integrate promote \"$HEAD_SHA\" && git push origin main"
        },
        {
          "name": "Delete the branches integration now contains",
          "if": "${{ !cancelled() }}",
          "run": "uv run --no-sync python -m dev_lab.dev.branchprune sweep"
        }
      ],
      "permissions": {
        "contents": "write",
        "statuses": "write",
        "pull-requests": "write"
      }
    }
  }
}
