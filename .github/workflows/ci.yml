# Rendered by lab_commons.dev.ciworkflows from TOML (lab_commons/dev/ci_base.toml + [tool.lab_commons.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m lab_commons.dev.ciworkflows render`.
{
  "name": "CI",
  "on": {
    "push": {
      "branches": [
        "main"
      ]
    },
    "pull_request": {},
    "workflow_dispatch": {}
  },
  "concurrency": {
    "group": "ci-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "uses": "./.github/workflows/python-verify.yml",
      "permissions": {
        "contents": "read",
        "issues": "write"
      },
      "with": {
        "python-versions": "[\"3.12\", \"3.13\"]",
        "runner-os": "[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]",
        "extras": "dev viz-mpl viz-bokeh",
        "guard-targets": "adoption"
      }
    }
  }
}
