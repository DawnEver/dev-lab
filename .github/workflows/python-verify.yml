name: Python verify (reusable)

# ============================================================================================
# THIS FILE IS LOAD-BEARING FOR MORE THAN THIS REPOSITORY.
#
# lab-commons is the shared development system for the motronics / optimi-lab / wdg-lab family,
# so it is the natural host for the family's ONE CI definition. This workflow is called by:
#
#   * lab-commons itself   -> .github/workflows/ci.yml
#   * DawnEver/optimi-lab  -> .github/workflows/ci.yml
#
# Editing it changes CI in every caller. That is the point: a second copy of these steps is a
# second thing to keep in step, and it does not stay in step.
#
# WHAT IT DELIBERATELY DOES NOT DO: it does not spell out the checks. It shells out to the
# caller repo's `make verify`, which is the SINGLE entry point a human also runs before pushing.
# A gate added as an inline `- run:` here would be a gate no local run can reach.
# ============================================================================================

on:
  workflow_call:
    inputs:
      python-versions:
        description: 'JSON array of Python versions to run the matrix over.'
        required: false
        default: '["3.12", "3.13"]'
        type: string
      runner-os:
        description: >
          JSON array of GitHub-hosted runner labels to run the verify matrix over. Crossed with
          `python-versions`, so the job count is the PRODUCT -- the default is 3 x 2 = 6 legs.

          THE DEFAULT IS THE WHOLE SET, AND THAT IS THE COVERAGE GUARD. This family develops on
          Windows, shipped a CI that ran only Ubuntu, and claims macOS support; a coverage claim
          that silently shrinks is its named defect. An opt-IN axis reproduces that exactly -- the
          callers that never pass it stay on one platform and nothing says so. Defaulting to the
          full set inverts it: narrowing becomes an explicit JSON array in the CALLER's workflow,
          which is a line in a diff a reviewer reads. No test can assert that a platform actually
          ran; a default that must be typed over to shrink is the strongest guard this file holds.

          COST, MEASURED 2026-09-19: both consuming repositories (DawnEver/lab-commons,
          DawnEver/optimi-lab) answer the UNAUTHENTICATED GitHub API with 200, so both are PUBLIC
          and GitHub-hosted minutes on all three platforms are FREE -- the 2x Windows and 10x macOS
          multipliers apply to PRIVATE repositories only and are not being paid here. The real
          budget is WALL CLOCK, and the legs run in parallel, so 6 legs cost the slowest one rather
          than the sum. Should either repo go private, THIS is the input to narrow, and the trade
          to weigh then is the full python matrix on one OS plus a single python on the others
          (4 legs) -- a saving bought only by giving up coverage that is currently free.
        required: false
        default: '["ubuntu-latest", "windows-latest", "macos-latest"]'
        type: string
      extras:
        description: 'Space-separated optional-dependency extras to sync (each becomes --extra X).'
        required: false
        default: 'dev'
        type: string
      guard-targets:
        description: >
          Space-separated `make` targets run as their OWN named steps after `verify`, so that a
          named architectural guard is legible from the job list instead of buried in a pytest
          summary. Each is already inside `verify`; re-running one is cheap and the point is the
          label. Every target must exist in the caller's Makefile.
        required: false
        default: ''
        type: string
      report-failures:
        description: >
          File / update / close a tracking issue in the CALLING repository. Requires the caller
          to grant `issues: write` -- a reusable workflow can never widen the permissions it was
          given, so if the caller forgets, this silently cannot file and the mechanism reads as
          working while doing nothing. Leave it on and grant the permission.
        required: false
        default: true
        type: boolean

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      # Already false, and the OS axis is why it must STAY false: the whole value of a macOS leg is
      # the answer it gives, and fail-fast would cancel it the moment an unrelated Windows leg red.
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runner-os) }}
        python-version: ${{ fromJSON(inputs.python-versions) }}

    defaults:
      run:
        # LOAD-BEARING FROM THE MOMENT WINDOWS ENTERED THE MATRIX. The two `run:` steps below are
        # POSIX shell -- `for extra in ...; do` -- and a Windows runner's default shell is
        # PowerShell, which parses neither. GitHub ships Git Bash on the Windows images and
        # `shell: bash` selects it, so ONE recipe serves all three platforms. Setting it per-step
        # would be the same string twice; setting it here is the job saying what language it is in.
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          # Both repos derive their version from git (hatch-vcs here, setuptools-scm in
          # optimi-lab). A shallow clone has no tags, so the BUILD fails before a test runs.
          fetch-depth: 0

      # Third-party actions ARE pinned, by major version. The floating-first-party argument below
      # does not extend to code this family does not own.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment
        # Nothing is pinned. House policy is that first-party requirements FLOAT
        # (`lab-commons @ git+https://...` carries no ref on purpose): a repo held at a sha stops
        # being told when a shared rule moved. A resolution failure here is NEWS, not noise.
        run: |
          extra_flags=""
          for extra in ${{ inputs.extras }}; do
            extra_flags="$extra_flags --extra $extra"
          done
          uv sync --python ${{ matrix.python-version }} $extra_flags

      - name: make verify
        # THE WHOLE GATE, in one call. `uv run` puts the synced .venv on PATH, so the Makefile's
        # `python -m ruff` / `python -m pytest` resolve to the environment just built.
        #
        # `--no-sync` IS LOAD-BEARING, AND THE STEP ABOVE IS WHY. A bare `uv run` performs an
        # implicit resolution against `uv.lock`, and that implicit one carries NO `--extra` -- so it
        # prunes exactly the extras the previous step just put in place, the shape measured taking
        # one environment from 113 distributions to 30. It is also the `installdoor` remedy for a
        # lock-consuming command that is not meant to move an environment at all: it is already
        # built, one step up, with the flags the caller asked for.
        #
        # `make` ITSELF IS THE UNPROVEN LINK ON WINDOWS and is named here rather than worked
        # around. GNU Make is present on the Ubuntu and macOS images; on `windows-latest` it comes
        # in via the shipped MSYS2/Git-for-Windows tooling, and this repository has never executed
        # a Windows runner, so that is a READ of the runner-image manifest and not a measurement.
        # No fallback is added for it: `verify` exists precisely so CI and a human run the SAME
        # entry point, and a `python -m lab_commons.dev.verify` escape hatch here would be a second
        # definition of the gate -- the exact fork the header above forbids. If the first Windows
        # leg reds on a missing `make`, the repair is to install it in a step, not to route around.
        run: uv run --no-sync make verify

      - name: Named guards
        if: inputs.guard-targets != ''
        run: |
          for target in ${{ inputs.guard-targets }}; do
            echo "::group::make $target"
            uv run --no-sync make "$target"
            echo "::endgroup::"
          done

  report:
    # A RED CI THAT NOTIFIES NOBODY IS A RED CI NOBODY SEES. This job closes that gap with no new
    # secret: the built-in GITHUB_TOKEN, and one tracking issue that is created, UPDATED, and then
    # CLOSED again. Create-every-time would give a flapping build fifty issues; a notification
    # that never clears is one people learn to ignore.
    needs: verify
    if: ${{ always() && inputs.report-failures && github.event_name == 'push' }}
    # SINGLE-PLATFORM ON PURPOSE, and it is the one job that must NOT take the OS axis. This job
    # makes GitHub REST calls; it neither builds nor imports the package, so a second platform
    # could not tell it anything. Worse, it would be actively wrong: the mechanism is keyed on ONE
    # stable issue title, so three legs would race to create it, then comment three times on a red
    # and close-after-commenting three times on a green. `needs: verify` already collapses EVERY
    # matrix leg into a single `needs.verify.result`, which is the aggregate a notification wants.
    runs-on: ubuntu-latest
    permissions:
      # A reusable workflow cannot widen what the caller granted. The caller's job must declare
      # `permissions: { contents: read, issues: write }`; restating it here documents the need and
      # keeps this job from inheriting anything broader.
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // `github.repository` and GITHUB_TOKEN resolve to the CALLER's repository: a reusable
            // workflow runs in the caller's context, so optimi-lab's red opens an issue in
            // optimi-lab, not here.
            const {owner, repo} = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const title = `CI failing on ${branch}`;
            const label = 'ci-failure';
            const runUrl =
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = '${{ needs.verify.result }}' !== 'success';

            // THE LABEL MUST EXIST BEFORE IT IS APPLIED, and this is not defensive noise -- it
            // is the one link in this chain that had never been exercised. MEASURED 2026-09-16:
            // neither caller repository has a `ci-failure` label, because no build has gone red
            // since this job was written, so the first red would have been the first time the
            // `labels: [label]` below was ever evaluated. Whether the REST API auto-creates a
            // missing label on issue creation is a detail to look up, not to assume, and the cost
            // of assuming wrong is precisely the failure this job exists to prevent: a
            // notification that never arrives while the mechanism reads as working. Created
            // explicitly, tolerating the 422 that means somebody already made it.
            try {
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'b60205',
                description: 'Opened, updated and closed by CI itself. See .github/workflows.',
              });
            } catch (error) {
              if (error.status !== 422) throw error;   // 422 = already_exists, which is the goal
            }

            // The STABLE KEY is the exact title. Matching on it is what makes this
            // create-or-update rather than create-every-time. A label filter that matches nothing
            // returns an empty list rather than a 404, so a first run finds no existing issue and
            // creates one, which is the intended path.
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            const existing = open.find((issue) => issue.title === title);

            const body = [
              `\`${{ needs.verify.result }}\` on \`${branch}\`.`,
              '',
              `* run: ${runUrl}`,
              `* commit: \`${context.sha}\``,
              `* failing job: \`verify\` (see the run for which matrix leg)`,
              '',
              'This issue is opened, updated and CLOSED by CI itself. Closing it by hand does not',
              'fix anything; the next green run on this branch closes it.',
            ].join('\n');

            if (failed) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number, body,
                });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body, labels: [label],
                });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: `Green again on \`${context.sha}\`. ${runUrl}`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed',
              });
            }
