# Rendered by lab_commons.dev.ciworkflows from TOML (lab_commons/dev/ci_base.toml + [tool.lab_commons.ci] in pyproject.toml). Hand edits are refused; edit the TOML and run `python -m lab_commons.dev.ciworkflows render`.
{
  "name": "Python verify (reusable)",
  "on": {
    "workflow_call": {
      "inputs": {
        "python-versions": {
          "description": "JSON array of Python versions to run the matrix over.",
          "required": false,
          "default": "[\"3.12\", \"3.13\"]",
          "type": "string"
        },
        "runner-os": {
          "description": "JSON array of GitHub-hosted runner labels to run the verify matrix over. Crossed with `python-versions`, so the job count is the PRODUCT -- the default is 3 x 2 = 6 legs.\nTHE DEFAULT IS THE WHOLE SET, AND THAT IS THE COVERAGE GUARD. This family develops on Windows, shipped a CI that ran only Ubuntu, and claims macOS support; a coverage claim that silently shrinks is its named defect. An opt-IN axis reproduces that exactly -- the callers that never pass it stay on one platform and nothing says so. Defaulting to the full set inverts it: narrowing becomes an explicit JSON array in the CALLER's workflow, which is a line in a diff a reviewer reads. No test can assert that a platform actually ran; a default that must be typed over to shrink is the strongest guard this file holds.\nCOST, MEASURED 2026-09-19: both consuming repositories (DawnEver/lab-commons, DawnEver/consumer-c) answer the UNAUTHENTICATED GitHub API with 200, so both are PUBLIC and GitHub-hosted minutes on all three platforms are FREE -- the 2x Windows and 10x macOS multipliers apply to PRIVATE repositories only and are not being paid here. The real budget is WALL CLOCK, and the legs run in parallel, so 6 legs cost the slowest one rather than the sum. Should either repo go private, THIS is the input to narrow, and the trade to weigh then is the full python matrix on one OS plus a single python on the others (4 legs) -- a saving bought only by giving up coverage that is currently free.\n",
          "required": false,
          "default": "[\"ubuntu-latest\", \"windows-latest\", \"macos-latest\"]",
          "type": "string"
        },
        "extras": {
          "description": "Space-separated optional-dependency extras to sync (each becomes --extra X).",
          "required": false,
          "default": "dev",
          "type": "string"
        },
        "guard-targets": {
          "description": "Space-separated `make` targets run as their OWN named steps after `verify`, so that a named architectural guard is legible from the job list instead of buried in a pytest summary. Each is already inside `verify`; re-running one is cheap and the point is the label. Every target must exist in the caller's Makefile.\n",
          "required": false,
          "default": "",
          "type": "string"
        },
        "report-failures": {
          "description": "File / update / close a tracking issue in the CALLING repository. Requires the caller to grant `issues: write` -- a reusable workflow can never widen the permissions it was given, so if the caller forgets, this silently cannot file and the mechanism reads as working while doing nothing. Leave it on and grant the permission.\n",
          "required": false,
          "default": true,
          "type": "boolean"
        }
      }
    }
  },
  "jobs": {
    "verify": {
      "runs-on": "${{ matrix.os }}",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": "${{ fromJSON(inputs.runner-os) }}",
          "python-version": "${{ fromJSON(inputs.python-versions) }}"
        }
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@v4",
          "with": {
            "fetch-depth": 0
          }
        },
        {
          "name": "Install uv",
          "uses": "astral-sh/setup-uv@v5",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Sync the environment",
          "run": "extra_flags=\"\"\nfor extra in ${{ inputs.extras }}; do\n  extra_flags=\"$extra_flags --extra $extra\"\ndone\nuv sync --python ${{ matrix.python-version }} $extra_flags\n"
        },
        {
          "name": "Install the declared git hooks",
          "run": "uv run --no-sync python -m lab_commons.dev.hook_install --install\n"
        },
        {
          "name": "make verify",
          "run": "uv run --no-sync make verify\n"
        },
        {
          "name": "Named guards",
          "if": "inputs.guard-targets != ''",
          "run": "for target in ${{ inputs.guard-targets }}; do\n  echo \"::group::make $target\"\n  uv run --no-sync make \"$target\"\n  echo \"::endgroup::\"\ndone\n"
        }
      ]
    },
    "report": {
      "needs": "verify",
      "if": "${{ always() && inputs.report-failures && github.event_name == 'push' }}",
      "runs-on": "ubuntu-latest",
      "permissions": {
        "contents": "read",
        "issues": "write"
      },
      "steps": [
        {
          "uses": "actions/github-script@v7",
          "with": {
            "script": "// `github.repository` and GITHUB_TOKEN resolve to the CALLER's repository: a reusable\n// workflow runs in the caller's context, so consumer-c's red opens an issue in\n// consumer-c, not here.\nconst {owner, repo} = context.repo;\nconst branch = context.ref.replace('refs/heads/', '');\nconst title = `CI failing on ${branch}`;\nconst label = 'ci-failure';\nconst runUrl =\n  `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;\nconst failed = '${{ needs.verify.result }}' !== 'success';\n\n// THE LABEL MUST EXIST BEFORE IT IS APPLIED, and this is not defensive noise -- it\n// is the one link in this chain that had never been exercised. MEASURED 2026-09-16:\n// neither caller repository has a `ci-failure` label, because no build has gone red\n// since this job was written, so the first red would have been the first time the\n// `labels: [label]` below was ever evaluated. Whether the REST API auto-creates a\n// missing label on issue creation is a detail to look up, not to assume, and the cost\n// of assuming wrong is precisely the failure this job exists to prevent: a\n// notification that never arrives while the mechanism reads as working. Created\n// explicitly, tolerating the 422 that means somebody already made it.\ntry {\n  await github.rest.issues.createLabel({\n    owner, repo, name: label, color: 'b60205',\n    description: 'Opened, updated and closed by CI itself. See .github/workflows.',\n  });\n} catch (error) {\n  if (error.status !== 422) throw error;   // 422 = already_exists, which is the goal\n}\n\n// The STABLE KEY is the exact title. Matching on it is what makes this\n// create-or-update rather than create-every-time. A label filter that matches nothing\n// returns an empty list rather than a 404, so a first run finds no existing issue and\n// creates one, which is the intended path.\nconst open = await github.paginate(github.rest.issues.listForRepo, {\n  owner, repo, state: 'open', labels: label, per_page: 100,\n});\nconst existing = open.find((issue) => issue.title === title);\n\nconst body = [\n  `\\`${{ needs.verify.result }}\\` on \\`${branch}\\`.`,\n  '',\n  `* run: ${runUrl}`,\n  `* commit: \\`${context.sha}\\``,\n  `* failing job: \\`verify\\` (see the run for which matrix leg)`,\n  '',\n  'This issue is opened, updated and CLOSED by CI itself. Closing it by hand does not',\n  'fix anything; the next green run on this branch closes it.',\n].join('\\n');\n\nif (failed) {\n  if (existing) {\n    await github.rest.issues.createComment({\n      owner, repo, issue_number: existing.number, body,\n    });\n  } else {\n    await github.rest.issues.create({\n      owner, repo, title, body, labels: [label],\n    });\n  }\n} else if (existing) {\n  await github.rest.issues.createComment({\n    owner, repo, issue_number: existing.number,\n    body: `Green again on \\`${context.sha}\\`. ${runUrl}`,\n  });\n  await github.rest.issues.update({\n    owner, repo, issue_number: existing.number, state: 'closed',\n  });\n}\n"
          }
        }
      ]
    }
  }
}
